name: issue41-persist-masked-once

on:
  push:
    branches:
      - ui-ja/issue41-pilot
    paths:
      - .github/workflows/issue41-persist-masked-once.yml

permissions:
  contents: write

jobs:
  persist-masked-blind30:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact frozen Issue 32 v2 snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAP_COMMIT='9f1659cfabb885b2dfc0dd4fef3a6611f19bee11'
          SNAP_PATH='validation_quarantine/bridge_snapshots/ui_ja_issue41_overlap7_v2.json'
          SNAP_BLOB='974bb9c971caf632f8ec73dff39fe4c55e60efaa'
          SNAP_OUT="$RUNNER_TEMP/ui_ja_issue41_overlap7_v2.json"
          test "$(git rev-parse "$SNAP_COMMIT:$SNAP_PATH")" = "$SNAP_BLOB"
          git show "$SNAP_COMMIT:$SNAP_PATH" > "$SNAP_OUT"
          echo "ISSUE41_SNAPSHOT=$SNAP_OUT" >> "$GITHUB_ENV"

      - name: Regenerate and verify Issue 41 package
        shell: bash
        run: |
          set -euo pipefail
          python -m translation_quarantine.r3.r3_issue41_pipeline . --issue32-snapshot "$ISSUE41_SNAPSHOT" >/dev/null
          python -m translation_quarantine.r3.r3_issue41_verify \
            --root . \
            --output translation_quarantine/r3 \
            --issue32-snapshot "$ISSUE41_SNAPSHOT" \
            --rerun

      - name: Validate masked reviewer artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          inp = Path('translation_quarantine/r3/blind30_input_issue41.jsonl')
          key = Path('translation_quarantine/r3/blind30_key_issue41.json')
          rows = [json.loads(line) for line in inp.read_text(encoding='utf-8').splitlines() if line.strip()]
          key_data = json.loads(key.read_text(encoding='utf-8'))
          selected = key_data['selected']
          assert len(rows) == 30
          assert len(selected) == 30
          assert len({row['canonical'] for row in rows}) == 30
          assert {row['canonical'] for row in rows} == {row['canonical'] for row in selected}
          allowed = {'canonical', 'candidate_display', 'search_terms', 'semantic_evidence', 'issue32_snapshot_evidence'}
          forbidden = {
              'risk_class', 'effective_risk_class', 'selection_risk_class',
              'display_state', 'search_state', 'bridge32_state', 'bridge32_availability',
              'row_state', 'reason_codes', 'issue32_meaning_fingerprint',
              'evaluated_issue32_meaning_fingerprint', 'issue32_content_identity',
              'issue32_conflict_signal', 'prior_review_state', 'phase1a_qa', 'review_state'
          }
          for row in rows:
              assert set(row) <= allowed
              assert not (set(row) & forbidden)
              for term in row.get('search_terms', []):
                  assert set(term) <= {'term', 'term_class'}
          print('masked_blind30=PASS rows=30 leakage=0 key_set_match=PASS')
          PY

      - name: Force-add masked reviewer artifact only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f translation_quarantine/r3/blind30_input_issue41.jsonl
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'translation_quarantine/r3/blind30_input_issue41.jsonl'
          git commit -m '#41: persist masked blind30 reviewer artifact'
          git push origin HEAD:ui-ja/issue41-pilot
