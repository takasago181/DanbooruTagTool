name: Issue104 Adult General Gap Audit

on:
  push:
    branches:
      - audit/issue104-adult-general-missing-special
    paths:
      - scripts/issue104/**
      - data/generation/special2788_generation_profile.csv
      - .github/workflows/issue104_adult_general_gap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adult-general-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Validate scanner syntax
        run: |
          python3 -m py_compile scripts/issue104/adult_general_gap_audit.py
          python3 -m py_compile scripts/issue104/crosswalk_issue94_review.py
          python3 -m py_compile scripts/issue104/materialize_product_fit_review.py

      - name: Fetch pinned 2026-09-02 Danbooru snapshot
        shell: bash
        env:
          SOURCE_URL: https://huggingface.co/datasets/HDiffusion/historical-danbooru-tag-counts/resolve/e243474/danbooru-2026-09-02.csv?download=true
          EXPECTED_SHA256: 9b32d5ac0713ab252e7470ba6af9cb34de56878b6b3b13dfbbf6a4a37d82d95b
        run: |
          set -euo pipefail
          mkdir -p artifacts/issue104
          SOURCE="$RUNNER_TEMP/danbooru-2026-09-02.csv"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output "$SOURCE"
          echo "$EXPECTED_SHA256  $SOURCE" | sha256sum --check
          printf 'source_url=%s\nexpected_sha256=%s\nactual_sha256=%s\n' \
            "$SOURCE_URL" "$EXPECTED_SHA256" "$(sha256sum "$SOURCE" | awk '{print $1}')" \
            > artifacts/issue104/source_provenance.txt

      - name: Fetch pinned Issue 94 final review outcomes
        shell: bash
        env:
          ISSUE94_COMMIT: b505f34956dc60e189e8c749fbe0cb187ad5154e
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/takasago181/DanbooruTagTool/${ISSUE94_COMMIT}/docs/issue94"
          curl --fail --location --retry 3 "$BASE/special_gap_candidates_v1.csv" -o "$RUNNER_TEMP/issue94_candidates.csv"
          curl --fail --location --retry 3 "$BASE/special_gap_exclusion_ledger_v1.csv" -o "$RUNNER_TEMP/issue94_exclusions.csv"
          printf 'issue94_review_commit=%s\n' "$ISSUE94_COMMIT" > artifacts/issue104/issue94_review_provenance.txt

      - name: Run General-to-Special adult gap audit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/danbooru-2026-09-02.csv"
          python3 scripts/issue104/adult_general_gap_audit.py \
            --canonical-source "$SOURCE" \
            --special-profile data/generation/special2788_generation_profile.csv \
            --expected-special 2983 \
            --top-uncovered 5000 \
            --out-dir artifacts/issue104 \
            2>&1 | tee artifacts/issue104/run.log

      - name: Crosswalk with Issue 94 final human review
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue104/crosswalk_issue94_review.py \
            --adult-priority artifacts/issue104/adult_fetish_canonical_priority_v2.csv \
            --top-uncovered artifacts/issue104/top_uncovered_by_post_count_v2.csv \
            --issue94-candidates "$RUNNER_TEMP/issue94_candidates.csv" \
            --issue94-exclusions "$RUNNER_TEMP/issue94_exclusions.csv" \
            --out-dir artifacts/issue104 \
            2>&1 | tee artifacts/issue104/crosswalk.log

      - name: Materialize product-fit review
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue104/materialize_product_fit_review.py \
            --strict-crosswalk artifacts/issue104/adult_priority_issue94_crosswalk_v1.csv \
            --top-uncovered artifacts/issue104/general_not_in_special_v2.csv \
            --out-dir artifacts/issue104 \
            2>&1 | tee artifacts/issue104/product_fit_review.log

      - name: Validate audit and review boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('artifacts/issue104')
          s = json.loads((root/'summary_v2.json').read_text(encoding='utf-8'))
          x = json.loads((root/'issue94_crosswalk_summary_v1.json').read_text(encoding='utf-8'))
          r = json.loads((root/'product_fit_review_summary_v1.json').read_text(encoding='utf-8'))
          assert s['danbooru_general_rows'] == 30743
          assert s['special']['rows'] == 2983
          assert not s['special']['unresolved_nonsemantic_rows']
          assert s['general_canonical_covered_by_special'] + s['general_not_in_special_count'] == 30743
          assert s['adult_heuristic_is_exclusion_filter'] == 'NO'
          assert s['canonical_and_alias_adult_signals_separated'] == 'YES'
          assert s['product_general_membership_used_to_exclude'] == 'NO'
          assert x['issue94_candidate_still_missing_count'] == 0
          assert x['new_to_adult_focused_review_count'] == 206
          assert r['strict_new_reviewed'] == 206
          assert r['all_issue94_prescreen_missed_strict_rows_reviewed'] == 'YES'
          assert r['special_candidate_count'] > 0
          assert r['adult_content_used_as_rejection_reason'] == 'NO'
          for obj in (s, x, r):
              for key in ('production_mutation','issue70_mutated','content_filter_used'):
                  assert obj[key] == 'NO', (key, obj[key])
          for key in ('userdata_mutated','pseudo_canonical_created'):
              assert s[key] == r[key] == 'NO', key
          review = list(csv.DictReader((root/'product_fit_review_v1.csv').open(encoding='utf-8-sig')))
          candidates = list(csv.DictReader((root/'special_candidate_subset_v1.csv').open(encoding='utf-8-sig')))
          needs = list(csv.DictReader((root/'definition_review_queue_v1.csv').open(encoding='utf-8-sig')))
          assert len(review) == r['total_reviewed']
          assert len(candidates) == r['special_candidate_count']
          assert len(needs) == r['needs_definition_review_count']
          assert len({row['canonical_tag'] for row in review}) == len(review)
          print('ISSUE104_PRODUCT_FIT_REVIEW_GATE=PASS')
          PY

      - name: Persist reviewed evidence on audit branch
        shell: bash
        run: |
          set -euo pipefail
          DEST=docs/issue104
          mkdir -p "$DEST"
          for f in \
            source_provenance.txt issue94_review_provenance.txt summary_v2.json \
            issue94_crosswalk_summary_v1.json adult_priority_issue94_crosswalk_v1.csv \
            adult_priority_new_since_issue94_prescreen_v1.csv product_fit_review_v1.csv \
            special_candidate_subset_v1.csv definition_review_queue_v1.csv \
            supplemental_rescue_review_v1.csv product_fit_review_summary_v1.json; do
            cp "artifacts/issue104/$f" "$DEST/$f"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/issue104')
          a=json.loads((root/'summary_v2.json').read_text(encoding='utf-8'))
          x=json.loads((root/'issue94_crosswalk_summary_v1.json').read_text(encoding='utf-8'))
          r=json.loads((root/'product_fit_review_summary_v1.json').read_text(encoding='utf-8'))
          lines=[
            '# Issue #104 — Danbooru General adult/fetish gaps missing from Special', '',
            '## Result', '',
            f"- Danbooru General canonical: **{a['danbooru_general_rows']:,}**",
            f"- accepted Special baseline: **{a['special']['rows']:,}**",
            f"- General canonical not literally/identity-covered by Special: **{a['general_not_in_special_count']:,}**",
            f"- strict canonical adult/fetish priority: **{a['canonical_adult_fetish_priority_count']:,}**",
            f"- already reviewed/excluded by Issue #94: **{x['crosswalk_counts'].get('ISSUE94_REVIEWED_EXCLUDED',0):,}**",
            f"- missed by the old Issue #94 final-review prescreen and reviewed here: **{r['strict_new_reviewed']:,}**",
            f"- additional high-frequency/opaque rescue rows reviewed: **{r['supplemental_high_frequency_rescue_reviewed']:,}**",
            f"- Special candidates after product-fit review: **{r['special_candidate_count']:,}**",
            f"- definition-level review queue: **{r['needs_definition_review_count']:,}**", '',
            '## Interpretation', '',
            'The old Issue #94 bounded prescreen did not expose most of the strict adult/fetish-named General gaps to final human review. This audit therefore confirms a real Special deep-discovery coverage gap, while also rejecting broad General descriptors, memes, arbitrary object placements and lexical false positives instead of promoting every adult-looking tag.', '',
            'The candidate subset is **audit evidence only**. It does not certify model-generation effectiveness and does not mutate production Special.', '',
            '## Important source checks', '',
            '- Danbooru Tagging Checklist identifies sex, BDSM, sex objects, body parts and guro as explicit/basic tagging areas.',
            '- Danbooru `Tag group:Breasts tags` explicitly lists deep breast morphology, actions, body-part relations and breast-bondage identities used in this review.',
            '- Danbooru leash documentation explicitly lists `viewer_on_leash` and `viewer_holding_leash` as perspective/action variants.',
            '- Danbooru `standing_restraints`, `breast_zipper`, `breast_curtains`, `shibarikini`, and `hand_in_another\'s_panties` definitions were used as spot checks for the product-fit boundary.', '',
            '## Boundaries', '',
            '- automatic production promotion: **NO**',
            '- content filter: **NO**',
            '- Issue #70 mutation: **NO**',
            '- UserData mutation: **NO**',
            '- pseudo-canonical tags: **NO**', '',
            '## Next gate', '',
            'Review the remaining definition queue, then decide promotion of the candidate subset as a separate deterministic Special-expansion change. Do not silently add all General tags and do not treat post count alone as a promotion rule.',
          ]
          (root/'ISSUE104_AUDIT_SUMMARY_v1.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #104: persist adult Special gap review evidence'
            git push origin HEAD:audit/issue104-adult-general-missing-special
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue104-adult-general-gap-${{ github.sha }}
          path: artifacts/issue104
          if-no-files-found: error
          retention-days: 14
