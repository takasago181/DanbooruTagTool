name: Issue118 Special Anatomy Review V28

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_special_anatomy_review_v28.py
      - docs/issue118/research_sidecar_v15.csv
      - .github/workflows/issue118_special_anatomy_review_v28.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  special-anatomy-v28:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Special-only anatomy review v28
        run: |
          python3 -m py_compile scripts/issue118/materialize_special_anatomy_review_v28.py
          python3 scripts/issue118/materialize_special_anatomy_review_v28.py
      - name: Validate v28
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('docs/issue118/special_anatomy_review_v28')
          s = json.loads((p / 'summary_v28.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader((p / 'full_review_candidate_v28.csv').open(encoding='utf-8')))
          assert len(rows) == 170
          assert s['candidate_rows'] == 170
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_SPECIAL_ANATOMY_V28_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/special_anatomy_review_v28
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize Special-only anatomy review v28'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
