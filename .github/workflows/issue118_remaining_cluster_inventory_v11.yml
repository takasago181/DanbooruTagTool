name: Issue118 Remaining Cluster Inventory V11

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_remaining_cluster_inventory_v11.py
      - docs/issue118/research_sidecar_v4.csv
      - .github/workflows/issue118_remaining_cluster_inventory_v11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize remaining cluster inventory v11
        run: |
          python3 -m py_compile scripts/issue118/materialize_remaining_cluster_inventory_v11.py
          python3 scripts/issue118/materialize_remaining_cluster_inventory_v11.py
      - name: Validate v11
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          p = Path('docs/issue118/remaining_cluster_inventory_v11')
          s = json.loads((p / 'summary_v11.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader((p / 'cluster_inventory_v11.csv').open(encoding='utf-8')))

          assert s['remaining_unclassified_rows'] == 14040
          assert sum(s['membership_counts'].values()) == 14040
          assert len(rows) == s['cluster_count']
          assert sum(int(r['rows']) for r in rows) == 14040
          assert s['source_sidecar'] == 'research_sidecar_v4.csv'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_REMAINING_CLUSTER_INVENTORY_V11_GATE=PASS')
          PY
      - name: Persist research inventory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/remaining_cluster_inventory_v11
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize remaining cluster inventory v11'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
