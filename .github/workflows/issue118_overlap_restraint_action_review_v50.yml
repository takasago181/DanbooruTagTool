name: Issue118 Overlap Restraint Action Review V50

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_restraint_action_review_v50.py
      - docs/issue118/research_sidecar_v28.csv
      - .github/workflows/issue118_overlap_restraint_action_review_v50.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlap-restraint-action-review-v50:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v50 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_restraint_action_review_v50.py
          python3 scripts/issue118/materialize_overlap_restraint_action_review_v50.py
      - name: Validate v50
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/overlap_restraint_action_review_v50/full_review_candidate_v50.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/overlap_restraint_action_review_v50/summary_v50.json').read_text(encoding='utf-8'))
          assert len(rows)==38
          assert s['candidate_rows']==38
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          print('ISSUE118_OVERLAP_RESTRAINT_ACTION_V50_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_restraint_action_review_v50/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap restraint action review v50'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
