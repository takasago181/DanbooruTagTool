name: issue70-finalize-runtime-pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_finalize_runtime_pack.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconcile 186 results, build compact runtime pack, validate all 92739 rows
        shell: python
        run: |
          import csv, hashlib, json, subprocess
          from collections import Counter
          from pathlib import Path

          root=Path.cwd()
          manifest_path=root/'docs/issue70/data/source_chunks_manifest.json'
          state_path=root/'docs/issue70/data/queue_state.json'
          runtime_dir=root/'docs/issue70/data/runtime'
          runtime_dir.mkdir(parents=True,exist_ok=True)
          result_out=runtime_dir/'issue70_translation_results.csv'
          catalog_out=runtime_dir/'issue70_catalog_overlay.csv'
          runtime_manifest=runtime_dir/'manifest.json'

          def load_json(p): return json.loads(p.read_text(encoding='utf-8-sig'))
          def read_csv(p):
            with p.open('r',encoding='utf-8-sig',newline='') as f: return list(csv.DictReader(f))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def split_terms(raw):
            if not raw: return []
            s=raw.replace(',', ' | ')
            vals=[]
            for x in s.split('|'):
              x=' '.join(x.strip().split())
              if x and x not in vals: vals.append(x)
            return vals
          def merge_terms(*raws):
            vals=[]
            for raw in raws:
              for x in split_terms(raw):
                if x not in vals: vals.append(x)
            return ' | '.join(vals)
          def related_top3(raw):
            if not raw: return ''
            try: value=json.loads(raw)
            except Exception: return ''
            vals=[]
            if isinstance(value,list):
              for item in value:
                if isinstance(item,dict):
                  name=item.get('copyright')
                  if isinstance(name,str) and name and name not in vals: vals.append(name)
                if len(vals)>=3: break
            return ' | '.join(vals)

          manifest=load_json(manifest_path)
          state=load_json(state_path)
          chunks=manifest['chunks']
          assert len(chunks)==186
          state_by={int(c['chunk_index']):c for c in state['chunks']}
          assert len(state_by)==186

          result_fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          catalog_fields=['row_id','canonical_tag','category','category_name','post_count','display_ja','search_ja','aliases','related_copyright','translation_status']
          merged_results=[]; catalog_rows=[]
          status_counts=Counter(); category_counts=Counter(); relation_chars=0
          selected=[]

          for entry in chunks:
            idx=int(entry['chunk_index'])
            src=root/entry['file']
            assert src.is_file(), entry['file']
            assert sha(src)==entry['sha256'], f'source sha chunk {idx}'
            source=read_csv(src)
            assert len(source)==int(entry['row_count'])
            assert source[0]['row_id']==entry['first_row_id'] and source[-1]['row_id']==entry['last_row_id']

            st=state_by[idx]
            candidates=[]
            old=st.get('result_path')
            if old and (root/old).is_file(): candidates.append(root/old)
            queue=list((root/'docs/issue70/data/results/queue').glob(f'queue_chunk{idx:03d}_*.csv'))
            for p in queue:
              if p not in candidates: candidates.append(p)
            valid=[]
            for p in candidates:
              rows=read_csv(p)
              if not rows or list(rows[0].keys())!=result_fields or len(rows)!=len(source): continue
              if [(r['row_id'],r['canonical_tag'],r['category']) for r in rows] != [(r['row_id'],r['canonical_tag'],r['category']) for r in source]: continue
              if any(r['translation_status'] not in {'ACCEPTED_AI','REVIEW_REQUIRED'} or not r['display_ja'].strip() for r in rows): continue
              valid.append((p,rows))
            if not valid:
              raise SystemExit(f'chunk {idx}: no valid result among {[str(p) for p in candidates]}')
            # Preserve legacy result authority where queue_state already records it; otherwise queue result.
            chosen=None
            if old:
              for item in valid:
                if item[0]==root/old: chosen=item; break
            if chosen is None:
              if len(valid)!=1: raise SystemExit(f'chunk {idx}: ambiguous valid results {[str(p) for p,_ in valid]}')
              chosen=valid[0]
            p,rows=chosen
            counts=Counter(r['translation_status'] for r in rows)
            st.update({
              'state':'COMPLETED','claimed_by':None,'claimed_at':None,'heartbeat_at':None,
              'result_path':p.relative_to(root).as_posix(),'result_sha256':sha(p),
              'accepted_count':counts['ACCEPTED_AI'],'review_count':counts['REVIEW_REQUIRED'],'last_error':None
            })
            selected.append((idx,st['result_path'],st['result_sha256']))

            for s,r in zip(source,rows):
              merged_results.append({k:r[k] for k in result_fields})
              status_counts[r['translation_status']]+=1
              category_counts[s['category_name']]+=1
              rel=related_top3(s.get('related_copyright_candidates','')) if s['category_name']=='Character' else ''
              if rel: relation_chars+=1
              catalog_rows.append({
                'row_id':s['row_id'],'canonical_tag':s['canonical_tag'],'category':s['category'],'category_name':s['category_name'],
                'post_count':s['post_count'],'display_ja':r['display_ja'].strip(),
                'search_ja':merge_terms(r.get('search_ja',''),s.get('existing_search_ja','')),
                'aliases':merge_terms(s.get('verified_aliases',''),s.get('source_aliases','')),
                'related_copyright':rel,'translation_status':r['translation_status']
              })

          assert len(merged_results)==len(catalog_rows)==92739
          assert [r['row_id'] for r in merged_results]==[f'I70-{i:06d}' for i in range(1,92740)]
          assert category_counts==Counter({'Character':35890,'Copyright':8536,'Artist':48313}), category_counts
          assert relation_chars==35597, relation_chars
          assert sum(status_counts.values())==92739
          assert len({r['canonical_tag'] for r in catalog_rows})==92739

          with result_out.open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=result_fields,lineterminator='\n'); w.writeheader(); w.writerows(merged_results)
          with catalog_out.open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=catalog_fields,lineterminator='\n'); w.writeheader(); w.writerows(catalog_rows)

          total_accepted=status_counts['ACCEPTED_AI']; total_review=status_counts['REVIEW_REQUIRED']
          state['summary']={
            'completed_chunks':186,'claimed_chunks':0,'pending_chunks':0,'retryable_chunks':0,'failed_validation_chunks':0,
            'completed_rows':92739,'accepted_count':total_accepted,'review_count':total_review,'remaining_rows':0
          }
          state['reconciled_from_results']=True
          state['reconciled_at']='2026-09-16T10:00:00Z'
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rm={
            'format_version':1,'issue':70,'total_rows':92739,'chunk_count':186,
            'category_counts':dict(category_counts),'status_counts':dict(status_counts),
            'character_rows_with_related_copyright':relation_chars,
            'translation_results':'docs/issue70/data/runtime/issue70_translation_results.csv',
            'translation_results_sha256':sha(result_out),
            'catalog_overlay':'docs/issue70/data/runtime/issue70_catalog_overlay.csv',
            'catalog_overlay_sha256':sha(catalog_out),
            'source_manifest_sha256':sha(manifest_path),
            'queue_state_sha256_after_reconcile':sha(state_path),
            'relationship_policy':'Character related_copyright keeps top 3 ranked candidates from preserved source evidence; Copyright reverse lookup can be derived from these compact links.',
            'result_selection':'legacy queue_state result_path when present and valid; otherwise unique validated docs/issue70/data/results/queue result'
          }
          runtime_manifest.write_text(json.dumps(rm,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Final self-read validation.
          assert len(read_csv(result_out))==92739 and len(read_csv(catalog_out))==92739
          print('TOTAL',92739)
          print('CATEGORY_COUNTS',dict(category_counts))
          print('STATUS_COUNTS',dict(status_counts))
          print('CHARACTER_RELATION_COVERAGE',relation_chars)
          print('RESULT_SHA',sha(result_out))
          print('CATALOG_SHA',sha(catalog_out))
          print('QUEUE_STATE_SHA',sha(state_path))

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(state_path.relative_to(root)),str(result_out.relative_to(root)),str(catalog_out.relative_to(root)),str(runtime_manifest.relative_to(root))],check=True)
          subprocess.run(['git','commit','-m','issue70: consolidate 92739 rows and finalize runtime pack'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
