name: Issue177 Mitigation Validation

on:
  push:
    branches:
      - fix/issue177-hide-artist-disable-character-relations

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify lane diff is isolated
        shell: pwsh
        run: |
          $base = '45919734f6b03cb64e2269153e63f9a378b62691'
          $allowed = @(
            '.github/workflows/issue177_mitigation_validation.yml',
            'src/DanbooruTagTool.App/MainWindow.xaml',
            'src/DanbooruTagTool.App/ViewModels/DictionaryWorkspaceViewModel.cs',
            'src/DanbooruTagTool.App/Views/DictionaryWorkspaceView.xaml',
            'src/DanbooruTagTool.Tests/Issue70IntegrationTests.cs',
            'src/DanbooruTagTool.Tests/Issue117UnifiedBrowseTests.cs',
            'src/DanbooruTagTool.Tests/Issue141DiscoveryTests.cs',
            'src/DanbooruTagTool.Tests/Issue76MainUiIntegrationTests.cs',
            'src/DanbooruTagTool.Tests/TechnicalFixTests.cs'
          )
          $changed = @(git diff --name-only "$base...HEAD")
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          Write-Host "Changed files:"
          $changed | ForEach-Object { Write-Host "  $_" }
          if ($unexpected.Count -gt 0) {
            Write-Error ("Unexpected lane changes: " + ($unexpected -join ', '))
            exit 1
          }

      - name: Static UI entry-point audit
        shell: pwsh
        run: |
          $xamls = Get-ChildItem 'src/DanbooruTagTool.App' -Recurse -Filter '*.xaml'
          $artistHits = @($xamls | Select-String -Pattern 'Content="作者"|CommandParameter="Artist"|IsSearchArtist')
          if ($artistHits.Count -gt 0) {
            $artistHits | ForEach-Object { Write-Host $_ }
            Write-Error 'Artist UI/search entry point remains in XAML.'
            exit 1
          }
          $relationHits = @($xamls | Select-String -Pattern 'RelatedActionLabel|OpenRelated|RelationSummary')
          if ($relationHits.Count -gt 0) {
            $relationHits | ForEach-Object { Write-Host $_ }
            Write-Error 'Character/Copyright relation action binding remains in XAML.'
            exit 1
          }

      - name: Release build
        run: dotnet build src/DanbooruTagTool.sln -c Release --nologo

      - name: Full test suite
        run: dotnet test src/DanbooruTagTool.sln -c Release --no-build --nologo

      - name: Issue70 focused tests
        run: dotnet test src/DanbooruTagTool.Tests/DanbooruTagTool.Tests.csproj -c Release --no-build --nologo --filter "FullyQualifiedName~Issue70IntegrationTests"

      - name: Issue117 focused tests
        run: dotnet test src/DanbooruTagTool.Tests/DanbooruTagTool.Tests.csproj -c Release --no-build --nologo --filter "FullyQualifiedName~Issue117UnifiedBrowseTests"

      - name: Issue141 regression tests
        run: dotnet test src/DanbooruTagTool.Tests/DanbooruTagTool.Tests.csproj -c Release --no-build --nologo --filter "FullyQualifiedName~Issue141DiscoveryTests"
