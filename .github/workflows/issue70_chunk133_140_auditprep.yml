name: issue70-chunk133-140-auditprep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk133_140_auditprep.yml'
permissions:
  contents: read
jobs:
  auditprep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Japanese candidates for 4000 rows
        shell: python
        run: |
          import csv, re
          from pathlib import Path
          files=[
            Path('docs/issue70/data/source_chunks/source_066001_066500.csv'),
            Path('docs/issue70/data/source_chunks/source_066501_067000.csv'),
            Path('docs/issue70/data/source_chunks/source_067001_067500.csv'),
            Path('docs/issue70/data/source_chunks/source_067501_068000.csv'),
            Path('docs/issue70/data/source_chunks/source_068001_068500.csv'),
            Path('docs/issue70/data/source_chunks/source_068501_069000.csv'),
            Path('docs/issue70/data/source_chunks/source_069001_069500.csv'),
            Path('docs/issue70/data/source_chunks/source_069501_070000.csv'),
          ]
          outputs=[
            Path('docs/issue70/data/results/queue/queue_chunk133_I70-066001_I70-066500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk134_I70-066501_I70-067000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk135_I70-067001_I70-067500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk136_I70-067501_I70-068000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk137_I70-068001_I70-068500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk138_I70-068501_I70-069000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk139_I70-069001_I70-069500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk140_I70-069501_I70-070000.csv'),
          ]
          assert not any(p.exists() for p in outputs), 'one or more target queue files already exist'
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          kanji=re.compile(r'[\u3400-\u9fff]')
          nameish=re.compile(r"^[a-z][a-z0-9']+_[a-z][a-z0-9']+$")
          rows_all=[]; candidates=[]
          for p in files:
            with p.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            rows_all.extend(rows)
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): candidates.append(r)
          assert len(rows_all)==4000
          print('TOTAL_ROWS',len(rows_all))
          print('JP_CANDIDATE_COUNT',len(candidates))
          promising=[]
          for r in candidates:
            tag=r['canonical_tag']; c=r['existing_candidate_ja'].strip(); aliases=r['verified_aliases'].strip()
            ascii_letters=sum(ch.isascii() and ch.isalpha() for ch in c)
            jp_chars=sum(bool(jp.match(ch)) for ch in c)
            strong_jp=(jp_chars>=2 and ascii_letters<=2)
            if nameish.match(tag) or aliases or (strong_jp and kanji.search(c)):
              promising.append((r['row_id'],tag,aliases,c))
          print('PROMISING_COUNT',len(promising))
          for row in promising:
            print('CAND\t'+'\t'.join(row))
