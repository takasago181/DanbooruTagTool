name: Issue132 Legacy Materialize Write Requests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify historical requests are already materialized
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("docs/issue132/parallel")
          missing = []
          for lane in (1, 2, 3):
              req = root / f"lane-{lane}/write-requests"
              stage = root / f"lane-{lane}/staging"
              if not req.exists():
                  continue
              for path in req.glob("request_*.json"):
                  stem = path.stem.replace("request_", "window_") + ".json"
                  if not (stage / stem).exists():
                      missing.append(str(path))
          if missing:
              raise SystemExit("historical requests missing staging: " + ", ".join(missing))
          print("PASS: all historical write requests are already materialized")
          PY
