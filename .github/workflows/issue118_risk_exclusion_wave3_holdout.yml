name: Issue118 Risk Exclusion Wave3 Holdout

on:
  push:
    branches:
      - research/issue118-efficiency-mining
    paths:
      - scripts/issue118/materialize_risk_exclusion_wave3_holdout.py
      - .github/workflows/issue118_risk_exclusion_wave3_holdout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Validate script
        run: python3 -m py_compile scripts/issue118/materialize_risk_exclusion_wave3_holdout.py
      - name: Materialize fresh holdout
        run: python3 scripts/issue118/materialize_risk_exclusion_wave3_holdout.py
      - name: Validate holdout separation
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('docs/issue118/risk_exclusion_wave3')
          s=json.loads((p/'summary_holdout_v1.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader((p/'holdout_sample_v1.csv').open(encoding='utf-8')))
          assert len(rows)==36 and s['holdout_rows']==36
          assert {r['phase'] for r in rows}=={'FRESH_HOLDOUT_WAVE3'}
          assert s['discovery_holdout_overlap']==0
          assert s['rule_frozen_before_holdout']=='YES'
          assert s['promotion_performed']=='NO' and s['production_authority']=='NO'
          assert s['main_mutated']=='NO' and s['issue117_code_mutated']=='NO'
          print('ISSUE118_RISK_EXCLUSION_WAVE3_HOLDOUT=PASS')
          PY
      - name: Persist research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/risk_exclusion_wave3/holdout_sample_v1.csv docs/issue118/risk_exclusion_wave3/summary_holdout_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize fresh wave3 holdout'
            git push origin HEAD:research/issue118-efficiency-mining
          fi
