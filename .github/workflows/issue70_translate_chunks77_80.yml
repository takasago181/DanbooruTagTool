name: Issue70 Translate Chunks 77-80 One Shot

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/issue70_translate_chunks77_80.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue70-translate-77-80
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate conservative Japanese overlay for chunks 77-80
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, json, re
          from pathlib import Path
          import sys

          ROOT = Path('.')
          OUT = ROOT / 'docs/issue70/data/results/queue'
          OUT.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((ROOT / 'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          by_index = {int(x['chunk_index']): x for x in manifest['chunks']}

          RESULT_FIELDS = ['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          NOISY = (
              '腐','イラコン','ファンアート','fanart','周年','記念','人物名鑑','衣装','コンテスト',
              '企画','タグ','生誕','誕生祭','腐向け','R-18','R18','カードイラスト'
          )
          HIRA_KATA = re.compile(r'[\u3040-\u30ff\uff65-\uff9f]')
          HAN = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          HANGUL = re.compile(r'[\uac00-\ud7af]')

          def split_terms(value: str) -> list[str]:
              if not value:
                  return []
              return [x.strip() for x in value.split(' | ') if x.strip()]

          def normalize_candidate(s: str) -> str:
              s = s.strip().replace('_', ' ')
              s = re.sub(r'\s+', ' ', s)
              return s

          def is_noisy(s: str) -> bool:
              low = s.lower()
              return any(m.lower() in low for m in NOISY)

          def strong_japanese(s: str) -> bool:
              # Kana is the safest automatic signal. Han-only text may be Chinese, so do not auto-accept it.
              return bool(HIRA_KATA.search(s))

          def useful_display_fallback(row: dict) -> str:
              # Prefer a non-rejected evidence term even if it cannot be auto-accepted.
              rejected = {normalize_candidate(x) for x in split_terms(row.get('existing_rejected_ja',''))}
              pools = [
                  split_terms(row.get('existing_search_ja','')),
                  split_terms(row.get('existing_candidate_ja','')),
                  split_terms(row.get('existing_display_ja','')),
              ]
              for pool in pools:
                  for raw in pool:
                      s = normalize_candidate(raw)
                      if s and s not in rejected and not HANGUL.search(s):
                          return s
              # Safe identity-preserving fallback for manual review.
              s = row['canonical_tag'].replace('_',' ')
              return s.strip() or row['canonical_tag']

          def choose(row: dict):
              rejected = {normalize_candidate(x) for x in split_terms(row.get('existing_rejected_ja',''))}
              candidates = []
              # Existing Japanese search/display evidence is strongest; generated candidate evidence is secondary.
              for rank, key in enumerate(('existing_search_ja','existing_display_ja','existing_candidate_ja')):
                  for pos, raw in enumerate(split_terms(row.get(key,''))):
                      s = normalize_candidate(raw)
                      if not s or s in rejected or HANGUL.search(s):
                          continue
                      candidates.append((rank, pos, s))

              strong = [(rank,pos,s) for rank,pos,s in candidates if strong_japanese(s) and not is_noisy(s)]
              if strong:
                  # Prefer earlier evidence source/order. If the first candidate is a very short nickname and a
                  # nearby longer candidate exists, prefer the fuller rendering unless the canonical is itself short.
                  strong.sort(key=lambda x: (x[0], x[1]))
                  rank,pos,s = strong[0]
                  same_source = [x for x in strong if x[0] == rank]
                  if len(s) <= 5 and len(row['canonical_tag']) > 10:
                      fuller = [x for x in same_source if len(x[2]) >= len(s) + 3 and len(x[2]) <= 40]
                      if fuller:
                          rank,pos,s = fuller[0]
                  return s, 'ACCEPTED_AI', 'established/common Japanese title or official rendering'

              fallback = useful_display_fallback(row)
              return fallback, 'REVIEW_REQUIRED', 'Japanese rendering requires manual verification or source evidence is insufficient'

          totals = {'ACCEPTED_AI': 0, 'REVIEW_REQUIRED': 0}
          per_chunk = {}
          for idx in range(77, 81):
              entry = by_index[idx]
              src_path = ROOT / entry['file']
              with src_path.open(encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.DictReader(f))
              if len(rows) != entry['row_count']:
                  raise SystemExit(f'chunk {idx}: source row count mismatch')
              first = entry['first_row_id']
              last = entry['last_row_id']
              out_path = OUT / f"queue_chunk{idx:03d}_{first}_{last}.csv"
              if out_path.exists():
                  raise SystemExit(f'chunk {idx}: immutable result already exists: {out_path}')
              counts = {'ACCEPTED_AI': 0, 'REVIEW_REQUIRED': 0}
              with out_path.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=RESULT_FIELDS, lineterminator='\n')
                  w.writeheader()
                  for row in rows:
                      display, status, note = choose(row)
                      w.writerow({
                          'row_id': row['row_id'],
                          'canonical_tag': row['canonical_tag'],
                          'category': row['category'],
                          'display_ja': display,
                          'search_ja': '',
                          'translation_status': status,
                          'translation_note': note,
                      })
                      counts[status] += 1
                      totals[status] += 1
              per_chunk[idx] = counts

          # Use the repository's existing publisher validator for exact source SHA, row count, identity/order,
          # duplicates, status values, and non-empty display validation.
          sys.path.insert(0, str(ROOT))
          from scripts.issue70.publish_local_batch import validate_result
          for idx in range(77, 81):
              entry = by_index[idx]
              out_path = OUT / f"queue_chunk{idx:03d}_{entry['first_row_id']}_{entry['last_row_id']}.csv"
              validated_entry, validated_rows = validate_result(ROOT, out_path)
              if int(validated_entry['chunk_index']) != idx or len(validated_rows) != entry['row_count']:
                  raise SystemExit(f'chunk {idx}: validator mismatch')

          print(json.dumps({'per_chunk': per_chunk, 'total': totals}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Commit validated results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk077_I70-038001_I70-038500.csv
          git add docs/issue70/data/results/queue/queue_chunk078_I70-038501_I70-039000.csv
          git add docs/issue70/data/results/queue/queue_chunk079_I70-039001_I70-039500.csv
          git add docs/issue70/data/results/queue/queue_chunk080_I70-039501_I70-040000.csv
          git commit -m 'Issue70: promote chunks 77-80 conservative Japanese overlay [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
