name: Issue76 Special Browse v2 Prototype

on:
  push:
    branches:
      - design/issue76-special-taxonomy-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize and validate Issue76 v0.8 sidecar
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'issue76_v2_candidate_mapping_v0_8.csv'
          $meta = Join-Path $env:RUNNER_TEMP 'issue76_v2_candidate_meta_v0_8.json'
          python tools/issue76_build_v2_integrated.py --output $out --meta $meta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Issue76 full mapping SHA256: $sha"
          if ($sha -ne 'de5ef4cb712c31425b77fcc8bf2d8f56917356d79b3720845c81d46d8142d5d0') {
            throw "Issue76 v0.8 full mapping hash drift: $sha"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore src/DanbooruTagTool.sln

      - name: Release build
        shell: pwsh
        run: dotnet build src/DanbooruTagTool.sln -c Release --no-restore

      - name: Tests
        shell: pwsh
        run: dotnet test src/DanbooruTagTool.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Build runnable prototype package
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:RUNNER_TEMP 'issue76-catalog'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          dotnet run --project src/DanbooruTagTool.App/DanbooruTagTool.App.csproj -c Release --no-build -- --build-catalog "$PWD" "$PWD" "$catalogDir"
          if ($LASTEXITCODE -ne 0) {
            $errorLog = Join-Path $PWD 'src/DanbooruTagTool.App/bin/Release/net10.0-windows/catalog-build-error.txt'
            if (Test-Path -LiteralPath $errorLog) {
              Write-Host '--- catalog-build-error.txt ---'
              Get-Content -LiteralPath $errorLog
              Write-Host '--- end catalog-build-error.txt ---'
            }
            throw 'Issue76 prototype catalog build failed'
          }

          $portable = Join-Path $env:RUNNER_TEMP 'Issue76-Special-Browse-v2-Prototype'
          & ./src/publish-portable.ps1 -Catalog (Join-Path $catalogDir 'catalog.db') -Output $portable -Dotnet 'dotnet'
          if ($LASTEXITCODE -ne 0) { throw 'Issue76 portable publish failed' }

          $issue76 = Join-Path $portable 'Issue76'
          New-Item -ItemType Directory -Path $issue76 -Force | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'issue76_v2_candidate_mapping_v0_8.csv') (Join-Path $issue76 'issue76_v2_candidate_mapping_v0_8.csv')
          Copy-Item docs/issue76/ISSUE76_KNOWLEDGE_FIRST_TASK_MATRIX_v0_9.csv (Join-Path $issue76 'ISSUE76_KNOWLEDGE_FIRST_TASK_MATRIX_v0_9.csv')
          Copy-Item docs/issue76/ISSUE76_PRACTICAL_GENERATION_BROWSE_TEST_v0_6.md (Join-Path $issue76 'ISSUE76_PRACTICAL_GENERATION_BROWSE_TEST_v0_6.md')
          Copy-Item docs/issue76/ISSUE76_WPF_BROWSE_PROTOTYPE_SPEC_v0_9.md (Join-Path $issue76 'ISSUE76_WPF_BROWSE_PROTOTYPE_SPEC_v0_9.md')

          @'
          @echo off
          cd /d "%~dp0"
          DanbooruTagTool.exe --issue76-v2-prototype "%~dp0Issue76\issue76_v2_candidate_mapping_v0_8.csv"
          '@ | Set-Content -LiteralPath (Join-Path $portable 'RUN_ISSUE76_PROTOTYPE.bat') -Encoding ascii

          @'
          Issue #76 Special Browse v2 isolated prototype

          1. RUN_ISSUE76_PROTOTYPE.bat をダブルクリックしてください。
          2. これは試作用UIです。通常起動の本番UI・本番taxonomyは置き換えません。
          3. Issue76 フォルダ内の 30-task matrix / practical test document を見ながら実際の探しやすさを確認してください。
          4. 分類が細かすぎる・自然な入口から見つからない・絞り込みが不自然、のどれかが出た箇所だけ修正対象にします。

          Frozen v0.8 mapping SHA256:
          de5ef4cb712c31425b77fcc8bf2d8f56917356d79b3720845c81d46d8142d5d0
          '@ | Set-Content -LiteralPath (Join-Path $portable 'README_ISSUE76.txt') -Encoding utf8

          "ISSUE76_PORTABLE=$portable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload runnable prototype
        uses: actions/upload-artifact@v4
        with:
          name: Issue76-Special-Browse-v2-Prototype
          path: ${{ env.ISSUE76_PORTABLE }}
          if-no-files-found: error
          retention-days: 7
