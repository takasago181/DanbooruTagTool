name: Issue118 Overlap Body Anatomy Review V35

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_body_anatomy_review_v35.py
      - docs/issue118/research_sidecar_v21.csv
      - .github/workflows/issue118_overlap_body_anatomy_review_v35.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlap-body-anatomy-v35:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize overlap body anatomy v35
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_body_anatomy_review_v35.py
          python3 scripts/issue118/materialize_overlap_body_anatomy_review_v35.py
      - name: Validate v35
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('docs/issue118/overlap_body_anatomy_review_v35')
          rows=list(csv.DictReader((p/'full_review_candidate_v35.csv').open(encoding='utf-8')))
          s=json.loads((p/'summary_v35.json').read_text(encoding='utf-8'))
          assert len(rows)==66
          assert s['candidate_rows']==66
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_OVERLAP_BODY_ANATOMY_V35_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_body_anatomy_review_v35
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap body anatomy review v35'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
