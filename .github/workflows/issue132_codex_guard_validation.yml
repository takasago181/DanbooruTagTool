name: Issue132 Codex Direct Runtime Validation

on:
  push:
    branches:
      - research/taxonomy-usability-audit
      - research/issue132-codex-simplify-v1
    paths:
      - "docs/issue132/CODEX_RUNTIME_V3.md"
      - "docs/issue132/parallel/RUNTIME_AUTHORITY.json"
      - "docs/issue132/parallel/CODEX_QA_STATE.json"
      - "docs/issue132/parallel/pass_a_semantic_contract_v2.json"
      - "docs/issue132/parallel/codex-baseline/**"
      - "docs/issue132/parallel/lane-*/staging/window_*.json"
      - "scripts/issue132/codex_runtime.py"
      - "scripts/issue132/codex_semantic.py"
      - "scripts/issue132/codex_stage_window.py"
      - "scripts/issue132/codex_repair_baseline.py"
      - "scripts/issue132/check_runtime_layout.py"
      - "scripts/issue132/validate_flat_pass_a.py"
      - "scripts/issue132/test_codex_direct_runtime.py"
      - ".github/workflows/issue132_codex_guard_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue132-codex-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile active runtime
        run: |
          python -m py_compile \
            scripts/issue132/codex_runtime.py \
            scripts/issue132/codex_semantic.py \
            scripts/issue132/codex_stage_window.py \
            scripts/issue132/codex_repair_baseline.py \
            scripts/issue132/check_runtime_layout.py \
            scripts/issue132/validate_flat_pass_a.py \
            scripts/issue132/test_codex_direct_runtime.py

      - name: Check active runtime layout
        run: python scripts/issue132/check_runtime_layout.py

      - name: Test direct Codex runtime
        run: python scripts/issue132/test_codex_direct_runtime.py
