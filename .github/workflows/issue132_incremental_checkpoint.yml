name: Issue132 Legacy Checkpoint Validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate historical checkpoint/correction layer
        run: python scripts/issue132/validate_parallel_effective.py

      - name: Self-test historical staging compatibility
        run: |
          python scripts/issue132/test_staging_v2.py
          python scripts/issue132/test_staging_repair_overlay.py

      - name: Validate current effective Pass A state
        run: python scripts/issue132/validate_flat_pass_a.py
