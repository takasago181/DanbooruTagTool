name: Issue118 Special-only Explicit Sexual V21.1

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_special_only_explicit_v21_1.py
      - docs/issue118/special_only_explicit_v21/residual_unclassified_v21.csv
      - .github/workflows/issue118_special_only_explicit_v21_1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  special-explicit-v21-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Special-only explicit aliases v21.1
        run: |
          python3 -m py_compile scripts/issue118/materialize_special_only_explicit_v21_1.py
          python3 scripts/issue118/materialize_special_only_explicit_v21_1.py
      - name: Validate v21.1
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('docs/issue118/special_only_explicit_v21_1')
          s = json.loads((p / 'summary_v21_1.json').read_text(encoding='utf-8'))
          cand = list(csv.DictReader((p / 'explicit_sexual_candidate_v21_1.csv').open(encoding='utf-8')))
          residual = list(csv.DictReader((p / 'residual_unclassified_v21_1.csv').open(encoding='utf-8')))
          holdout = list(csv.DictReader((p / 'fresh_holdout_template_v21_1.csv').open(encoding='utf-8')))
          assert s['source_rows'] == 467
          assert len(cand) + len(residual) == 467
          assert s['explicit_candidate_rows'] == len(cand)
          assert s['residual_unclassified_rows'] == len(residual)
          assert len(holdout) == min(120, len(cand))
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_SPECIAL_ONLY_EXPLICIT_V21_1_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/special_only_explicit_v21_1
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize Special-only explicit aliases v21.1'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
