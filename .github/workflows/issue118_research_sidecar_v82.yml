name: Issue118 Research Sidecar V82

on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v82.py
      - docs/issue118/research_sidecar_v81.csv
      - docs/issue118/general_none_none_review_v115/review_policy_v115.json
      - docs/issue118/general_none_none_review_v115/full_review_candidate_v115.csv
      - .github/workflows/issue118_research_sidecar_v82.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v82:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v82
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v82.py
          python3 scripts/issue118/materialize_research_sidecar_v82.py
      - name: Validate v82
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v82.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v82.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==99
          assert s['new_promotions']=={'CONTEXTUAL':4,'NON_SEXUAL':92,'SEXUAL':3}
          assert s['retained_unclassified']==['lilistia']
          assert s['retained_unclassified_count']==1
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':8138,'UNCLASSIFIED':1243}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1933,'NON_SEXUAL':26560,'NULL':1243,'SEXUAL':2016}
          assert s['remaining_unclassified']==1243
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V82_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v82.csv docs/issue118/research_sidecar_summary_v82.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v82'
            git pull --rebase origin research/issue118-cluster-triage-v8
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
