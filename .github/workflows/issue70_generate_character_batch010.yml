name: Issue70 Generate Character Audit Batch 010

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_character_no_evidence_batch010.py
      - .github/workflows/issue70_generate_character_batch010.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue70-character-batch010
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Character batch 010
        run: python scripts/issue70/generate_character_no_evidence_batch010.py

      - name: Validate proposal-only output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_no_trusted_ja_batch010.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('docs/issue70/audit/character_no_trusted_ja_batch010.csv')
          with p.open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows) > 4000
          assert all(r['audit_verdict'] in {'KEEP','NEEDS_EXTERNAL_CHECK'} for r in rows)
          assert sum(r['audit_verdict']=='KEEP' for r in rows) > 4000
          assert sum(r['audit_verdict']=='NEEDS_EXTERNAL_CHECK' for r in rows) > 0
          print({'rows':len(rows),'keep':sum(r['audit_verdict']=='KEEP' for r in rows),'external':sum(r['audit_verdict']=='NEEDS_EXTERNAL_CHECK' for r in rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source

      - name: Commit audit batch only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/character_no_trusted_ja_batch010.csv
          if git diff --cached --quiet; then
            echo 'No generated audit changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist conservative Character audit batch 010'
          git push origin HEAD:audit/issue70-semantic-final
