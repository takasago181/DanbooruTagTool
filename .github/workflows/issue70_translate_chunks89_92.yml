name: Issue70 Translate Chunks 89-92 One Shot

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate conservative Japanese overlay for chunks 89-92
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, json, re, sys
          from pathlib import Path

          ROOT = Path('.')
          OUT = ROOT / 'docs/issue70/data/results/queue'
          OUT.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((ROOT / 'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          by_index = {int(x['chunk_index']): x for x in manifest['chunks']}
          FIELDS = ['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          NOISY = (
              '腐','イラコン','ファンアート','fanart','周年','記念','人物名鑑','衣装','コンテスト',
              '企画','タグ','生誕','誕生祭','腐向け','R-18','R18','カードイラスト'
          )
          HIRA_KATA = re.compile(r'[\u3040-\u30ff\uff65-\uff9f]')
          HANGUL = re.compile(r'[\uac00-\ud7af]')

          def split_terms(value: str):
              return [x.strip() for x in value.split(' | ') if x.strip()] if value else []

          def norm(s: str):
              return re.sub(r'\s+', ' ', s.strip().replace('_', ' '))

          def noisy(s: str):
              low = s.lower()
              return any(m.lower() in low for m in NOISY)

          def trusted_candidates(row: dict):
              rejected = {norm(x) for x in split_terms(row.get('existing_rejected_ja',''))}
              out = []
              for rank, key in enumerate(('existing_search_ja','existing_display_ja')):
                  for pos, raw in enumerate(split_terms(row.get(key,''))):
                      s = norm(raw)
                      if not s or s in rejected or HANGUL.search(s) or noisy(s):
                          continue
                      if HIRA_KATA.search(s):
                          out.append((rank,pos,s))
              out.sort(key=lambda x: (x[0],x[1]))
              return out

          def fallback(row: dict):
              rejected = {norm(x) for x in split_terms(row.get('existing_rejected_ja',''))}
              for key in ('existing_candidate_ja','existing_search_ja','existing_display_ja'):
                  for raw in split_terms(row.get(key,'')):
                      s = norm(raw)
                      if s and s not in rejected and not HANGUL.search(s):
                          return s
              s = row['canonical_tag'].replace('_',' ').strip()
              return s or row['canonical_tag']

          totals = {'ACCEPTED_AI':0,'REVIEW_REQUIRED':0}
          per_chunk = {}
          for idx in range(89,93):
              entry = by_index[idx]
              src_path = ROOT / entry['file']
              with src_path.open(encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.DictReader(f))
              if len(rows) != entry['row_count']:
                  raise SystemExit(f'chunk {idx}: source row count mismatch')
              out_path = OUT / f"queue_chunk{idx:03d}_{entry['first_row_id']}_{entry['last_row_id']}.csv"
              if out_path.exists():
                  raise SystemExit(f'chunk {idx}: immutable result already exists: {out_path}')
              counts = {'ACCEPTED_AI':0,'REVIEW_REQUIRED':0}
              with out_path.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=FIELDS, lineterminator='\n')
                  w.writeheader()
                  for row in rows:
                      trusted = trusted_candidates(row)
                      if trusted:
                          display = trusted[0][2]
                          status = 'ACCEPTED_AI'
                          note = 'established/common Japanese title or official rendering from trusted existing display/search evidence'
                      else:
                          display = fallback(row)
                          status = 'REVIEW_REQUIRED'
                          note = 'candidate-only or insufficient Japanese evidence; manual verification required'
                      w.writerow({
                          'row_id': row['row_id'],
                          'canonical_tag': row['canonical_tag'],
                          'category': row['category'],
                          'display_ja': display,
                          'search_ja': '',
                          'translation_status': status,
                          'translation_note': note,
                      })
                      counts[status] += 1
                      totals[status] += 1
              per_chunk[idx] = counts

          sys.path.insert(0, str(ROOT))
          from scripts.issue70.publish_local_batch import validate_result
          for idx in range(89,93):
              entry = by_index[idx]
              out_path = OUT / f"queue_chunk{idx:03d}_{entry['first_row_id']}_{entry['last_row_id']}.csv"
              validated_entry, validated_rows = validate_result(ROOT, out_path)
              if int(validated_entry['chunk_index']) != idx or len(validated_rows) != entry['row_count']:
                  raise SystemExit(f'chunk {idx}: validator mismatch')

          print(json.dumps({'per_chunk':per_chunk,'total':totals}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Commit validated results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk089_I70-044001_I70-044500.csv
          git add docs/issue70/data/results/queue/queue_chunk090_I70-044501_I70-045000.csv
          git add docs/issue70/data/results/queue/queue_chunk091_I70-045001_I70-045500.csv
          git add docs/issue70/data/results/queue/queue_chunk092_I70-045501_I70-046000.csv
          git commit -m 'Issue70: promote chunks 89-92 conservative Japanese overlay [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
