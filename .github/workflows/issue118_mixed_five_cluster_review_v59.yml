name: Issue118 Mixed Five Cluster Review V59

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_mixed_five_cluster_review_v59.py
      - docs/issue118/research_sidecar_v33.csv
      - .github/workflows/issue118_mixed_five_cluster_review_v59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mixed-five-cluster-review-v59:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v59 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_mixed_five_cluster_review_v59.py
          python3 scripts/issue118/materialize_mixed_five_cluster_review_v59.py
      - name: Validate v59
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/mixed_five_cluster_review_v59/full_review_candidate_v59.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/mixed_five_cluster_review_v59/summary_v59.json').read_text(encoding='utf-8'))
          assert len(rows)==91
          assert s['candidate_rows']==91
          assert s['cluster_counts']=={
              'OVERLAP|ACTION_CONTACT|CLOTHING_EXPOSURE|NONE':18,
              'OVERLAP|ACTION_CONTACT|RELATION_ROLE_CONTEXT|NONE':18,
              'OVERLAP|BODY_PART|BODY_ATTRIBUTE|NONE':18,
              'OVERLAP|BODY_PART|BODY_STATE|NONE':18,
              'OVERLAP|CLOTHING_STATE_EXPOSURE|CLOTHING_EXPOSURE|SEXUALIZED_CLOTHING':19,
          }
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_MIXED_FIVE_CLUSTER_V59_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/mixed_five_cluster_review_v59/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize mixed five-cluster review v59'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
