name: Issue118 Everyday Restraint Flag Review V52

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_everyday_restraint_flag_review_v52.py
      - docs/issue118/research_sidecar_v29.csv
      - .github/workflows/issue118_everyday_restraint_flag_review_v52.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  everyday-restraint-flag-review-v52:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v52 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_everyday_restraint_flag_review_v52.py
          python3 scripts/issue118/materialize_everyday_restraint_flag_review_v52.py
      - name: Validate v52
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/everyday_restraint_flag_review_v52/full_review_candidate_v52.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/everyday_restraint_flag_review_v52/summary_v52.json').read_text(encoding='utf-8'))
          assert len(rows)==34
          assert s['candidate_rows']==34
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_EVERYDAY_RESTRAINT_FLAG_V52_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/everyday_restraint_flag_review_v52/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize Everyday restraint-flag review v52'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
