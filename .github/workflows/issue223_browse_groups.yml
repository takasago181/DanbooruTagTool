name: Issue223 Browse Groups
on:
  pull_request:
    paths: ['src/**', 'docs/issue223/**', 'scripts/issue223/**', 'tests/issue223/**', '.github/workflows/issue223_browse_groups.yml']
  push:
    branches: [dev/issue223-browse-groups]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python scripts/issue223/build_browse_groups.py --check
      - run: python -m pytest tests/issue223 tests/issue216 tests/issue180 -q -p no:cacheprovider
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/DanbooruTagTool.sln -c Release --nologo
