name: issue70-chunk165-172-publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk165_172_auditprep.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validate and publish chunks 165-172
        shell: python
        run: |
          import csv, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path
          repo=Path.cwd()
          specs=[
            (165,'I70-082001','I70-082500','docs/issue70/data/source_chunks/source_082001_082500.csv','4e906ffc2389ccc5204240e1819ff6f4a585310a789e7998b5d061f5653a5f72','docs/issue70/data/results/queue/queue_chunk165_I70-082001_I70-082500.csv'),
            (166,'I70-082501','I70-083000','docs/issue70/data/source_chunks/source_082501_083000.csv','c9505eb3cb78c9c8c4307e67cec5af7d5c518388040d8d1bc18a2e02f549e43e','docs/issue70/data/results/queue/queue_chunk166_I70-082501_I70-083000.csv'),
            (167,'I70-083001','I70-083500','docs/issue70/data/source_chunks/source_083001_083500.csv','c5af1abe7a1eb631478304f25ef0e0733451bb17bc73ee9a8f6d1c7b47413d68','docs/issue70/data/results/queue/queue_chunk167_I70-083001_I70-083500.csv'),
            (168,'I70-083501','I70-084000','docs/issue70/data/source_chunks/source_083501_084000.csv','a84b4641b36327deb3dc2c821f0a17033db4e77fbd06563203ec6419839904ef','docs/issue70/data/results/queue/queue_chunk168_I70-083501_I70-084000.csv'),
            (169,'I70-084001','I70-084500','docs/issue70/data/source_chunks/source_084001_084500.csv','6b1ad99f49c019aaafff7fb4fb57b3bb9c73103d43b1b0f73ebba43e312039b4','docs/issue70/data/results/queue/queue_chunk169_I70-084001_I70-084500.csv'),
            (170,'I70-084501','I70-085000','docs/issue70/data/source_chunks/source_084501_085000.csv','297db187a06c6063772a72f3432e704e3ee9a5a4301461116fb7e5dbcf7ea3b0','docs/issue70/data/results/queue/queue_chunk170_I70-084501_I70-085000.csv'),
            (171,'I70-085001','I70-085500','docs/issue70/data/source_chunks/source_085001_085500.csv','0a0d9e8499cc5d184b8376f73b4173868ef0dfb13f61a0feb5817cf88080a0e3','docs/issue70/data/results/queue/queue_chunk171_I70-085001_I70-085500.csv'),
            (172,'I70-085501','I70-086000','docs/issue70/data/source_chunks/source_085501_086000.csv','2007b455f6d91361a921307045764e0c757501bf0a6b970d65cb54d9c62f555b','docs/issue70/data/results/queue/queue_chunk172_I70-085501_I70-086000.csv'),
          ]
          promotions={
            'ryo_chimo':'りょーちも',
            'takahashi_kazuki':'高橋和希',
            'yanase_takayuki':'柳瀬敬之',
            'hirano_toshihiro':'平野俊弘',
            'mizuno_eita':'水野英多',
            'takeda_hinata':'武田日向',
            'tsurumaki_kazuya':'鶴巻和哉',
          }
          result_fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          manifest=json.loads((repo/'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          entries={e['chunk_index']:e for e in manifest['chunks']}
          loaded=[]
          for idx,first,last,src_rel,expected_sha,out_rel in specs:
            entry=entries[idx]
            assert entry['first_row_id']==first and entry['last_row_id']==last and entry['row_count']==500 and entry['file']==src_rel and entry['sha256']==expected_sha
            src=repo/src_rel
            assert hashlib.sha256(src.read_bytes()).hexdigest()==expected_sha
            dst=repo/out_rel
            if dst.exists():
              raise SystemExit(f'immutable queue result already exists: {out_rel}')
            with src.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500 and rows[0]['row_id']==first and rows[-1]['row_id']==last
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            loaded.append((entry,rows,out_rel))
          total=0; jp_candidates=0; used=[]
          for entry,rows,out_rel in loaded:
            out=[]
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): jp_candidates+=1
              tag=r['canonical_tag']
              if tag in promotions:
                display=promotions[tag]
                used.append((r['row_id'],tag,display))
                note='semantic artist audit: independently verified Japanese name'
              else:
                display=tag.replace('_',' ')
                note='semantic artist audit: canonical handle preserved; no independently verified Japanese name'
              out.append({'row_id':r['row_id'],'canonical_tag':tag,'category':r['category'],'display_ja':display,'search_ja':'','translation_status':'ACCEPTED_AI','translation_note':note})
            dst=repo/out_rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            with dst.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=result_fields,lineterminator='\n'); w.writeheader(); w.writerows(out)
            total+=len(out)
          spec=importlib.util.spec_from_file_location('publish_local_batch',repo/'scripts/issue70/publish_local_batch.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for *_,out_rel in specs:
            entry,rows=mod.validate_result(repo,repo/out_rel)
            assert len(rows)==500
            print('VALIDATED',entry['chunk_index'],out_rel,len(rows))
          assert total==4000
          assert jp_candidates==1078
          assert len(used)==len(promotions)==7
          print('TOTAL_ROWS',total)
          print('JP_CANDIDATE_COUNT',jp_candidates)
          print('PROMOTION_COUNT',len(used))
          for x in used: print('PROMOTE\t'+'\t'.join(x))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add']+[s[-1] for s in specs],check=True)
          subprocess.run(['git','commit','-m','issue70: publish 4000-row artist audit chunks 165-172'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
