name: Issue118 Research Sidecar V65

on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v65.py
      - docs/issue118/research_sidecar_v64.csv
      - docs/issue118/high_risk_ten_cluster_review_v92/review_policy_v92.json
      - docs/issue118/high_risk_ten_cluster_review_v92/full_review_candidate_v92.csv
      - .github/workflows/issue118_research_sidecar_v65.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v65:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v65
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v65.py
          python3 scripts/issue118/materialize_research_sidecar_v65.py
      - name: Validate v65
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v65.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v65.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==97
          assert s['new_promotions']=={'CONTEXTUAL':54,'NON_SEXUAL':8,'SEXUAL':35}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':6505,'UNCLASSIFIED':2876}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1689,'NON_SEXUAL':25431,'NULL':2876,'SEXUAL':1756}
          assert s['remaining_unclassified']==2876
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V65_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v65.csv docs/issue118/research_sidecar_summary_v65.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v65'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
