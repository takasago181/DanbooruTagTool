name: Issue118 Review Summary

on:
  push:
    branches:
      - research/issue118-intent-pilot
    paths:
      - 'scripts/issue118/summarize_intent_reviews.py'
      - 'scripts/issue118/evaluate_pilot_rules.py'
      - 'scripts/issue118/estimate_population_coverage.py'
      - 'scripts/issue118/materialize_rule_holdout.py'
      - 'scripts/issue118/materialize_holdout_review.py'
      - 'scripts/issue118/evaluate_holdout_rules.py'
      - 'scripts/issue118/evaluate_candidate_rules_v2.py'
      - 'scripts/issue118/materialize_research_sidecar_v1.py'
      - 'docs/issue118/reviews/chunk_*_review_v1.csv'
      - '.github/workflows/issue118_review_summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Validate research scripts
        run: |
          python3 -m py_compile scripts/issue118/summarize_intent_reviews.py
          python3 -m py_compile scripts/issue118/evaluate_pilot_rules.py
          python3 -m py_compile scripts/issue118/estimate_population_coverage.py
          python3 -m py_compile scripts/issue118/materialize_rule_holdout.py
          python3 -m py_compile scripts/issue118/materialize_holdout_review.py
          python3 -m py_compile scripts/issue118/evaluate_holdout_rules.py
          python3 -m py_compile scripts/issue118/evaluate_candidate_rules_v2.py
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v1.py

      - name: Validate and summarize semantic evidence
        run: |
          set -euo pipefail
          python3 scripts/issue118/summarize_intent_reviews.py
          python3 scripts/issue118/evaluate_pilot_rules.py
          python3 scripts/issue118/estimate_population_coverage.py
          python3 scripts/issue118/materialize_rule_holdout.py
          python3 scripts/issue118/materialize_holdout_review.py
          python3 scripts/issue118/evaluate_holdout_rules.py
          python3 scripts/issue118/evaluate_candidate_rules_v2.py
          python3 scripts/issue118/materialize_research_sidecar_v1.py

      - name: Validate holdout refined-rule and sidecar contract
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          h=json.loads(Path('docs/issue118/holdout/rule_holdout_evaluation_v1.json').read_text(encoding='utf-8'))
          assert h['holdout_rows'] == 240
          assert h['by_candidate_rule']['AUTO_SEXUAL_EXPLICIT_SPECIAL_LEXEMES_V2']['target_precision'] == 1.0
          assert h['refined_nonsexual_v2']['target_precision'] == 1.0
          v=json.loads(Path('docs/issue118/reviews/candidate_rules_v2_evaluation.json').read_text(encoding='utf-8'))
          assert v['pilot']['AUTO_NONSEX_SAFE_GENERAL_ROOTS_V2']['target_precision'] == 1.0
          assert v['pilot']['AUTO_SEXUAL_EXPLICIT_SPECIAL_LEXEMES_V2']['target_precision'] == 1.0
          assert v['candidate_coverage']['rule_conflicts'] == 0
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v1.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v1.csv').open(encoding='utf-8-sig')))
          assert len(rows) == 31752 == s['identity_rows']
          assert len({r['identity_key'] for r in rows}) == 31752
          assert s['human_review_evidence_rows'] == 940
          assert sum(s['review_status_counts'].values()) == 31752
          assert all(r['sexual_intent'] in {'','SEXUAL','NON_SEXUAL','CONTEXTUAL'} for r in rows)
          assert all(r['review_status'] in {'HUMAN_REVIEWED','AUTO_HIGH_CONF','UNCLASSIFIED'} for r in rows)
          assert all((r['sexual_intent'] != '') if r['review_status'] != 'UNCLASSIFIED' else True for r in rows)
          assert s['production_authority'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_GATE=PASS')
          PY

      - name: Persist semantic review evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/issue118/reviews/semantic_pilot_summary_v1.json \
            docs/issue118/reviews/pilot_rule_evaluation_v1.json \
            docs/issue118/reviews/population_rule_coverage_v1.json \
            docs/issue118/reviews/candidate_rules_v2_evaluation.json \
            docs/issue118/holdout \
            docs/issue118/research_sidecar_v1.csv \
            docs/issue118/research_sidecar_summary_v1.json \
            docs/issue118/RESEARCH_SIDECAR_CONTRACT_v1.md
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar contract v1'
            git push origin HEAD:research/issue118-intent-pilot
          fi

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue118-review-summary-${{ github.sha }}
          path: |
            docs/issue118/reviews/*.json
            docs/issue118/reviews/chunk_*_review_v1.csv
            docs/issue118/holdout/*.csv
            docs/issue118/holdout/*.json
            docs/issue118/holdout/review_chunks/*.csv
            docs/issue118/holdout/reviews/*.csv
            docs/issue118/research_sidecar_v1.csv
            docs/issue118/research_sidecar_summary_v1.json
            docs/issue118/RESEARCH_SIDECAR_CONTRACT_v1.md
          if-no-files-found: error
          retention-days: 14
