name: Issue118 Intimate Action Review V31

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_intimate_action_review_v31.py
      - docs/issue118/research_sidecar_v17.csv
      - .github/workflows/issue118_intimate_action_review_v31.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intimate-action-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize intimate action v31 review set
        run: |
          python3 -m py_compile scripts/issue118/materialize_intimate_action_review_v31.py
          python3 scripts/issue118/materialize_intimate_action_review_v31.py
      - name: Validate v31
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('docs/issue118/intimate_action_review_v31')
          s = json.loads((p / 'summary_v31.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader((p / 'full_review_candidate_v31.csv').open(encoding='utf-8')))
          assert len(rows) == 80
          assert s['candidate_rows'] == 80
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_INTIMATE_ACTION_V31_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/intimate_action_review_v31
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize intimate action review v31'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
