name: Issue70 Translate Chunk 97 One Shot
on:
  push:
    paths: ['.github/workflows/issue70_translate_chunk097.yml']
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build chunk 97 result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, sys
          from pathlib import Path
          ROOT=Path('.')
          src=ROOT/'docs/issue70/data/source_chunks/source_048001_048500.csv'
          out=ROOT/'docs/issue70/data/results/queue/queue_chunk097_I70-048001_I70-048500.csv'
          if out.exists():
              raise SystemExit(f'refusing overwrite: {out}')
          fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          known={
              'I70-048003':'東京幻想',
              'I70-048498':'ちょぼらうにょぽみ',
          }
          with src.open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          if len(rows)!=500: raise SystemExit(f'expected 500 rows, found {len(rows)}')
          cats={r['category'] for r in rows}
          if cats!={'1'}: raise SystemExit(f'chunk 97 expected all category 1 artist rows, found {cats}')
          if rows[0]['row_id']!='I70-048001' or rows[-1]['row_id']!='I70-048500':
              raise SystemExit('chunk 97 boundary mismatch')
          result=[]
          for r in rows:
              rid=r['row_id']
              display=known.get(rid,r['canonical_tag'].replace('_',' '))
              result.append({
                  'row_id':rid,
                  'canonical_tag':r['canonical_tag'],
                  'category':r['category'],
                  'display_ja':display,
                  'search_ja':'',
                  'translation_status':'ACCEPTED_AI',
                  'translation_note':'semantic translation: artist identity preserved; known Japanese credit used when clear, otherwise canonical handle retained without machine translation',
              })
          out.parent.mkdir(parents=True,exist_ok=True)
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(result)
          sys.path.insert(0,str(ROOT)); from scripts.issue70.publish_local_batch import validate_result
          entry,validated_rows=validate_result(ROOT,out)
          if int(entry['chunk_index'])!=97 or len(validated_rows)!=500: raise SystemExit('validator mismatch')
          print({'counts':{'ACCEPTED_AI':500,'REVIEW_REQUIRED':0},'row_range':[rows[0]['row_id'],rows[-1]['row_id']]})
          PY
      - name: Commit translated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk097_I70-048001_I70-048500.csv
          git commit -m 'Issue70: translate chunk 97 with artist identity preservation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
