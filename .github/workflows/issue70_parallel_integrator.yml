name: Issue70 Parallel Integrator

on:
  push:
    branches:
      - 'audit/issue70-auto-lane-*'
    paths:
      - 'docs/issue70/automation/cycles/**/lane-*/RESULTS.csv'
      - 'docs/issue70/automation/cycles/**/lane-*/STATUS.json'\n      - 'docs/issue70/automation/cycles/**/lane-*/REVIEWED_UNRESOLVED.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue70-parallel-integrator
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch all lane branches
        run: |
          git fetch origin '+refs/heads/audit/issue70-auto-lane-*:refs/remotes/origin/audit/issue70-auto-lane-*'

      - name: Build integration candidate
        id: integration
        run: |
          python scripts/issue70/integrate_parallel_cycle.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('artifacts/issue70-parallel/integrator_state.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('ready=' + ('true' if d.get('ready') else 'false'))
          print('cycle_id=' + str(d.get('cycle_id','')))
          PY

      - name: Refresh exact progress
        if: steps.integration.outputs.ready == 'true'
        run: python scripts/issue70/summarize_semantic_audit_progress.py

      - name: Refresh unresolved external queue
        if: steps.integration.outputs.ready == 'true'
        run: python scripts/issue70/export_unresolved_external_queue.py

      - name: Refresh effective external progress
        if: steps.integration.outputs.ready == 'true'
        run: python scripts/issue70/summarize_external_resolution_progress.py

      - name: Validate integrated progress and production safety
        if: steps.integration.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state=json.loads(Path('artifacts/issue70-parallel/integrator_state.json').read_text(encoding='utf-8'))
          progress=json.loads(Path('docs/issue70/audit/EXTERNAL_PROGRESS_LIVE.json             docs/issue70/automation/REVIEWED_UNRESOLVED.csv').read_text(encoding='utf-8'))

          assert state['ready'] is True
          assert progress['production_modified'] is False
          assert progress['conflicted_external_rows'] == 0
          assert progress['resolved_external_rows'] == state['expected_resolved_external_rows'], (progress, state)
          assert progress['remaining_external_rows'] == state['expected_remaining_external_rows'], (progress, state)
          assert progress['remaining_by_category'] == state['expected_remaining_by_category'], (progress, state)
          assert progress['resolved_external_rows'] + progress['remaining_external_rows'] == progress['initial_external_rows']
          print({
              'cycle_id': state['cycle_id'],
              'merged_rows': state['merged_rows'],
              'resolved': progress['resolved_external_rows'],
              'remaining': progress['remaining_external_rows'],
              'remaining_by_category': progress['remaining_by_category'],
          })
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source

      - name: Publish integration atomically
        if: steps.integration.outputs.ready == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git fetch origin audit/issue70-semantic-final
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/audit/issue70-semantic-final)" ]; then
            echo "Authority advanced during integration; skip stale publish without failing."
            exit 0
          fi

          CYCLE="${{ steps.integration.outputs.cycle_id }}"
          git add             "docs/issue70/audit/external_resolution_parallel_${CYCLE}.csv"             "docs/issue70/automation/cycles/${CYCLE}/INTEGRATION_REPORT.json"             docs/issue70/audit/PROGRESS_LIVE.json             docs/issue70/audit/EXTERNAL_QUEUE_TOP100.csv             docs/issue70/audit/EXTERNAL_QUEUE_SUMMARY.json             docs/issue70/audit/EXTERNAL_PROGRESS_LIVE.json

          git commit -m "Issue70: integrate parallel ${CYCLE}"
          git push origin HEAD:audit/issue70-semantic-final
