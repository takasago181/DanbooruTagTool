name: Issue118 Research Sidecar V29

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v29.py
      - docs/issue118/research_sidecar_v28.csv
      - docs/issue118/overlap_restraint_action_review_v50/review_policy_v50.json
      - docs/issue118/overlap_restraint_action_review_v50/full_review_candidate_v50.csv
      - docs/issue118/special_restraint_fetish_review_v51/review_policy_v51.json
      - docs/issue118/special_restraint_fetish_review_v51/full_review_candidate_v51.csv
      - .github/workflows/issue118_research_sidecar_v29.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v29:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v29
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v29.py
          python3 scripts/issue118/materialize_research_sidecar_v29.py
      - name: Validate v29
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v29.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v29.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['remaining_unclassified']==5944
          assert s['new_promotions']=={'CONTEXTUAL':51,'NON_SEXUAL':3,'SEXUAL':19}
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V29_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v29.csv docs/issue118/research_sidecar_summary_v29.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v29'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
