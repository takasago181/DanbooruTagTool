name: issue70-chunk125-132-publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk125_132_auditprep.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validate and publish chunks 125-132
        shell: python
        run: |
          import csv, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path
          repo=Path.cwd()
          specs=[
            (125,'I70-062001','I70-062500','docs/issue70/data/source_chunks/source_062001_062500.csv','06899c1c9aa6178f46c08b4ac0d7ca22e25cfbcabd557969d291edc66e5e0a38','docs/issue70/data/results/queue/queue_chunk125_I70-062001_I70-062500.csv'),
            (126,'I70-062501','I70-063000','docs/issue70/data/source_chunks/source_062501_063000.csv','a321a1a51220351119bf923b172f6a2575ed369f15999e7086e9a261bc102f6a','docs/issue70/data/results/queue/queue_chunk126_I70-062501_I70-063000.csv'),
            (127,'I70-063001','I70-063500','docs/issue70/data/source_chunks/source_063001_063500.csv','834e752ee2a6f2d1ee1661e8d63e2f820253074bfd0b2c438d01b830a1776e8d','docs/issue70/data/results/queue/queue_chunk127_I70-063001_I70-063500.csv'),
            (128,'I70-063501','I70-064000','docs/issue70/data/source_chunks/source_063501_064000.csv','367eac598def57f1bc7acc8198785e156d1e74cd78f2672646b49c838bae9c7c','docs/issue70/data/results/queue/queue_chunk128_I70-063501_I70-064000.csv'),
            (129,'I70-064001','I70-064500','docs/issue70/data/source_chunks/source_064001_064500.csv','781370e5e939c10ea236a5fb73b967cd0ffeabb8cfca71f209b439d8dfc9b8e1','docs/issue70/data/results/queue/queue_chunk129_I70-064001_I70-064500.csv'),
            (130,'I70-064501','I70-065000','docs/issue70/data/source_chunks/source_064501_065000.csv','38fc363b786ecc5ff9656490f8a8474b55fa18ff403e4fd772c4fda7b577bfe9','docs/issue70/data/results/queue/queue_chunk130_I70-064501_I70-065000.csv'),
            (131,'I70-065001','I70-065500','docs/issue70/data/source_chunks/source_065001_065500.csv','d6bfffa0abada2bcb3d2c725cefa5f55e3095d91610f006226dd992e7facd4d9','docs/issue70/data/results/queue/queue_chunk131_I70-065001_I70-065500.csv'),
            (132,'I70-065501','I70-066000','docs/issue70/data/source_chunks/source_065501_066000.csv','35696a5754ffd1a954be7b5c038a106114204d0c0e5f94f66ced04cc2ed20083','docs/issue70/data/results/queue/queue_chunk132_I70-065501_I70-066000.csv'),
          ]
          promotions={
            'iwasaki_masakazu':'いわさきまさかず',
            'yano_akane':'矢野茜',
            'yoshimizu_kagami':'美水かがみ',
            'manabe_jouji':'真鍋譲治',
            'kawamura_toshie':'川村敏江',
            'amano_yoshitaka':'天野喜孝',
            'katsura_masakazu':'桂正和',
            'kamitani_george':'神谷盛治',
            'sakamoto_ahiru':'坂本アヒル',
            'awatake_takahiro':'粟岳高弘',
            'araki_hirohiko':'荒木飛呂彦',
          }
          result_fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          manifest=json.loads((repo/'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          entries={e['chunk_index']:e for e in manifest['chunks']}
          total=0; jp_candidates=0; used=[]
          # First pass: validate all inputs and ensure no target result exists before writing anything.
          loaded=[]
          for idx,first,last,src_rel,expected_sha,out_rel in specs:
            entry=entries[idx]
            assert entry['first_row_id']==first and entry['last_row_id']==last and entry['row_count']==500 and entry['file']==src_rel and entry['sha256']==expected_sha
            src=repo/src_rel
            assert hashlib.sha256(src.read_bytes()).hexdigest()==expected_sha
            dst=repo/out_rel
            if dst.exists():
              raise SystemExit(f'immutable queue result already exists: {out_rel}')
            with src.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500 and rows[0]['row_id']==first and rows[-1]['row_id']==last
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            loaded.append((entry,rows,out_rel))
          # Second pass: generate all eight queue files.
          for entry,rows,out_rel in loaded:
            out=[]
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): jp_candidates+=1
              tag=r['canonical_tag']
              if tag in promotions:
                display=promotions[tag]
                used.append((r['row_id'],tag,display))
                note='semantic artist audit: independently verified Japanese name'
              else:
                display=tag.replace('_',' ')
                note='semantic artist audit: canonical handle preserved; no independently verified Japanese name'
              out.append({'row_id':r['row_id'],'canonical_tag':tag,'category':r['category'],'display_ja':display,'search_ja':'','translation_status':'ACCEPTED_AI','translation_note':note})
            dst=repo/out_rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            with dst.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=result_fields,lineterminator='\n'); w.writeheader(); w.writerows(out)
            total+=len(out)
          spec=importlib.util.spec_from_file_location('publish_local_batch',repo/'scripts/issue70/publish_local_batch.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for *_,out_rel in specs:
            entry,rows=mod.validate_result(repo,repo/out_rel)
            assert len(rows)==500
            print('VALIDATED',entry['chunk_index'],out_rel,len(rows))
          assert total==4000
          assert jp_candidates==1432
          assert len(used)==len(promotions)==11
          print('TOTAL_ROWS',total)
          print('JP_CANDIDATE_COUNT',jp_candidates)
          print('PROMOTION_COUNT',len(used))
          for x in used: print('PROMOTE\t'+'\t'.join(x))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add']+[s[-1] for s in specs],check=True)
          subprocess.run(['git','commit','-m','issue70: publish 4000-row artist audit chunks 125-132'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
