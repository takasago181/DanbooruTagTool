name: Issue70 Generate Copyright Audit Batch 009

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_copyright_accepted_noflag_batch009.py
      - .github/workflows/issue70_generate_copyright_batch009.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue70-copyright-batch009
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate semantic batch 009
        run: python scripts/issue70/generate_copyright_accepted_noflag_batch009.py

      - name: Validate proposal-only output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/copyright_accepted_noflag_batch009.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('docs/issue70/audit/copyright_accepted_noflag_batch009.csv')
          with p.open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          assert rows
          assert all(r['audit_verdict'] in {'KEEP','FIX_DISPLAY','FIX_SEARCH','FIX_BOTH','NEEDS_EXTERNAL_CHECK','NEEDS_USER_DECISION'} for r in rows)
          assert sum(r['audit_verdict']=='KEEP' for r in rows) >= 250
          assert sum(r['audit_verdict'].startswith('FIX_') for r in rows) >= 10
          print({'rows':len(rows),'keep':sum(r['audit_verdict']=='KEEP' for r in rows),'fix':sum(r['audit_verdict'].startswith('FIX_') for r in rows),'external':sum(r['audit_verdict']=='NEEDS_EXTERNAL_CHECK' for r in rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source

      - name: Commit audit batch only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/copyright_accepted_noflag_batch009.csv
          if git diff --cached --quiet; then
            echo 'No generated audit changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist Copyright semantic audit batch 009'
          git push origin HEAD:audit/issue70-semantic-final
