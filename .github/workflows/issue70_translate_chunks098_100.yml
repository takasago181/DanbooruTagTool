name: Issue70 Translate Chunks 98-100 One Shot

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/issue70_translate_chunks098_100.yml']

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build chunks 98-100 results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, sys
          from pathlib import Path

          ROOT = Path('.')
          fields = ['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          specs = [
              (98, 'I70-048501', 'I70-049000', 'docs/issue70/data/source_chunks/source_048501_049000.csv', 'docs/issue70/data/results/queue/queue_chunk098_I70-048501_I70-049000.csv'),
              (99, 'I70-049001', 'I70-049500', 'docs/issue70/data/source_chunks/source_049001_049500.csv', 'docs/issue70/data/results/queue/queue_chunk099_I70-049001_I70-049500.csv'),
              (100, 'I70-049501', 'I70-050000', 'docs/issue70/data/source_chunks/source_049501_050000.csv', 'docs/issue70/data/results/queue/queue_chunk100_I70-049501_I70-050000.csv'),
          ]

          # Only names whose Japanese credit is confidently known are overridden.
          # Everything else keeps the canonical artist handle rather than risking machine translation.
          known = {
          }

          sys.path.insert(0, str(ROOT))
          from scripts.issue70.publish_local_batch import validate_result

          for chunk_index, first_id, last_id, src_s, out_s in specs:
              src = ROOT / src_s
              out = ROOT / out_s
              if out.exists():
                  raise SystemExit(f'refusing overwrite: {out}')

              with src.open(encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.DictReader(f))
              if len(rows) != 500:
                  raise SystemExit(f'chunk {chunk_index}: expected 500 rows, found {len(rows)}')
              if rows[0]['row_id'] != first_id or rows[-1]['row_id'] != last_id:
                  raise SystemExit(f'chunk {chunk_index}: boundary mismatch')
              cats = {r['category'] for r in rows}
              if cats != {'1'}:
                  raise SystemExit(f'chunk {chunk_index}: expected all Artist/category 1 rows, found {cats}')

              result = []
              for r in rows:
                  rid = r['row_id']
                  display = known.get(rid, r['canonical_tag'].replace('_', ' '))
                  result.append({
                      'row_id': rid,
                      'canonical_tag': r['canonical_tag'],
                      'category': r['category'],
                      'display_ja': display,
                      'search_ja': '',
                      'translation_status': 'ACCEPTED_AI',
                      'translation_note': 'semantic translation: artist identity preserved; known Japanese credit used only when clear, otherwise canonical handle retained without machine translation',
                  })

              out.parent.mkdir(parents=True, exist_ok=True)
              with out.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(result)

              entry, validated_rows = validate_result(ROOT, out)
              if int(entry['chunk_index']) != chunk_index or len(validated_rows) != 500:
                  raise SystemExit(f'chunk {chunk_index}: validator mismatch')
              print({'chunk': chunk_index, 'counts': {'ACCEPTED_AI': 500, 'REVIEW_REQUIRED': 0}, 'row_range': [first_id, last_id]})
          PY

      - name: Commit translated results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/issue70/data/results/queue/queue_chunk098_I70-048501_I70-049000.csv \
            docs/issue70/data/results/queue/queue_chunk099_I70-049001_I70-049500.csv \
            docs/issue70/data/results/queue/queue_chunk100_I70-049501_I70-050000.csv
          git commit -m 'Issue70: translate chunks 98-100 with artist identity preservation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
