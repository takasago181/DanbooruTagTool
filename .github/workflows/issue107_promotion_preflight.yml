name: Issue107 Promotion Preflight

on:
  push:
    branches:
      - prod/issue107-promote-adult-special-gaps
    paths:
      - scripts/issue107/**
      - docs/issue104/special_candidate_subset_v1.csv
      - data/generation/special2788_generation_profile.csv
      - .github/workflows/issue107_promotion_preflight.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promotion-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact 105-row promotion preflight
        run: |
          python3 scripts/issue107/materialize_promotion_preflight.py \
            --candidates docs/issue104/special_candidate_subset_v1.csv \
            --profile data/generation/special2788_generation_profile.csv \
            --out-dir artifacts/issue107 \
            | tee artifacts/issue107_preflight.log

      - name: Validate fixed preflight contract
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('artifacts/issue107')
          s=json.loads((root/'promotion_preflight_summary_v1.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader((root/'promotion_preflight_v1.csv').open(encoding='utf-8-sig')))
          assert s['base_special_count'] == 2983
          assert s['candidate_count'] == 105
          assert s['proposed_special_count'] == 3088
          assert s['id_range'] == '2984..3088'
          assert s['normalized_overlap_count'] == 0
          assert s['source_set_exact'] == 'YES'
          assert s['existing_ids_stable'] == 'YES'
          assert [int(r['proposed_special_id']) for r in rows] == list(range(2984, 3089))
          assert len({r['canonical_tag'] for r in rows}) == 105
          assert all(r['metadata_status'] == 'PENDING_PRODUCT_METADATA' for r in rows)
          for key in ('production_mutation','issue70_mutated','userdata_mutated','content_filter_used'):
              assert s[key] == 'NO'
          print('ISSUE107_PREFLIGHT_GATE=PASS')
          PY

      - name: Persist preflight evidence
        run: |
          mkdir -p docs/issue107
          cp artifacts/issue107/promotion_preflight_v1.csv docs/issue107/promotion_preflight_v1.csv
          cp artifacts/issue107/promotion_preflight_summary_v1.json docs/issue107/promotion_preflight_summary_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue107
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #107: persist promotion preflight evidence'
            git push origin HEAD:prod/issue107-promote-adult-special-gaps
          fi
