name: Issue118 Research Sidecar V58
on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v58.py
      - docs/issue118/research_sidecar_v57.csv
      - docs/issue118/general_clothing_state_exposure_none_review_v84/review_policy_v84.json
      - docs/issue118/general_clothing_state_exposure_none_review_v84/full_review_candidate_v84.csv
      - .github/workflows/issue118_research_sidecar_v58.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-sidecar-v58:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v58
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v58.py
          python3 scripts/issue118/materialize_research_sidecar_v58.py
      - name: Validate v58
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v58.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v58.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==100
          assert s['new_promotions']=={'CONTEXTUAL':20,'NON_SEXUAL':79,'SEXUAL':1}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':5875,'UNCLASSIFIED':3506}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1548,'NON_SEXUAL':24983,'NULL':3506,'SEXUAL':1715}
          assert s['remaining_unclassified']==3506
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V58_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v58.csv docs/issue118/research_sidecar_summary_v58.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v58'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
