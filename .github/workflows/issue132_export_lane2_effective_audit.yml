name: Issue132 Legacy Lane2 Audit Export (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export script syntax
        run: python -m py_compile scripts/issue132/export_lane2_effective_manual_audit.py
      - name: Current Codex runtime validation
        run: python scripts/issue132/validate_flat_pass_a.py
