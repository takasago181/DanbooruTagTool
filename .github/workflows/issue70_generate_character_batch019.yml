name: Issue70 Generate Character Audit Batch 019

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_character_single_candidate_keep_batch019.py
      - .github/workflows/issue70_generate_character_batch019.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-character-batch019
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/generate_character_single_candidate_keep_batch019.py
      - name: Validate proposal-only output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_single_candidate_keep_batch019.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path('docs/issue70/audit/character_single_candidate_keep_batch019.csv').open(encoding='utf-8-sig', newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows) >= 1
          assert all(r['audit_verdict'] == 'KEEP' for r in rows)
          assert all(r['reason_code'] == 'SINGLE_JA_CANDIDATE_STRONG_CONTEXT_NO_CONFLICT' for r in rows)
          print({'rows':len(rows),'keep':len(rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit audit batch only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/character_single_candidate_keep_batch019.csv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist Character single-candidate keep batch 019'
          git push origin HEAD:audit/issue70-semantic-final
