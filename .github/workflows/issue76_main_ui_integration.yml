name: Issue76 Main UI Integration

on:
  push:
    branches:
      - feature/issue76-special-v2-main-ui

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Issue 76 run main UI integration'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue76-special-v2-main-ui
          fetch-depth: 0

      - name: Apply current MainWindow integration
        shell: pwsh
        run: |
          python tools/issue76_apply_main_ui_integration.py
          python tools/issue76_fix_main_ui_integration.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore src/DanbooruTagTool.sln

      - name: Release build
        shell: pwsh
        run: dotnet build src/DanbooruTagTool.sln -c Release --no-restore

      - name: Tests
        shell: pwsh
        run: dotnet test src/DanbooruTagTool.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Diff check
        shell: pwsh
        run: git diff --check

      - name: Commit validated integration
        shell: pwsh
        run: |
          git config user.name "takasago181"
          git config user.email "61348957+takasago181@users.noreply.github.com"
          git rm tools/issue76_apply_main_ui_integration.py tools/issue76_fix_main_ui_integration.py .github/workflows/issue76_main_ui_integration.yml
          git add -A
          git commit -m "Issue 76 integrate v2 classification into current MainWindow"
          git push origin HEAD:feature/issue76-special-v2-main-ui
