name: Issue70 Diagnose Character Audit Batch 056

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/diagnose_character_accepted_remaining_batch056.py
      - .github/workflows/issue70_diagnose_character_batch056.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-character-batch056
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/diagnose_character_accepted_remaining_batch056.py
      - name: Validate diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_accepted_remaining_batch056_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/character_accepted_remaining_batch056_diagnostic.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert len(d['rows'])==d['population']
          assert sum(d['bucket_counts'].values())==d['population']
          print({'population':d['population'],'bucket_counts':d['bucket_counts']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/character_accepted_remaining_batch056_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist remaining Accepted Character diagnostic batch 056'
          git push origin HEAD:audit/issue70-semantic-final
