name: Issue118 Special Explicit Sex Review V47

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_special_explicit_sex_review_v47.py
      - docs/issue118/research_sidecar_v27.csv
      - .github/workflows/issue118_special_explicit_sex_review_v47.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  special-explicit-sex-review-v47:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v47 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_special_explicit_sex_review_v47.py
          python3 scripts/issue118/materialize_special_explicit_sex_review_v47.py
      - name: Validate v47
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/special_explicit_sex_review_v47/full_review_candidate_v47.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/special_explicit_sex_review_v47/summary_v47.json').read_text(encoding='utf-8'))
          assert len(rows)==37
          assert s['candidate_rows']==37
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          print('ISSUE118_SPECIAL_EXPLICIT_SEX_V47_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/special_explicit_sex_review_v47/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize Special explicit-sex review v47'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
