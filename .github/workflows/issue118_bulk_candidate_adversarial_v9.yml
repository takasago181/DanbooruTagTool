name: Issue118 Bulk Candidate Adversarial V9

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_bulk_candidate_adversarial_v9.py
      - .github/workflows/issue118_bulk_candidate_adversarial_v9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize adversarial inventory
        run: |
          python3 -m py_compile scripts/issue118/materialize_bulk_candidate_adversarial_v9.py
          python3 scripts/issue118/materialize_bulk_candidate_adversarial_v9.py
      - name: Validate v9
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          p = Path('docs/issue118/bulk_candidate_adversarial_v9')
          s = json.loads((p / 'summary_v9.json').read_text(encoding='utf-8'))
          inv = list(csv.DictReader((p / 'bulk_candidate_inventory_v9.csv').open(encoding='utf-8')))
          flagged = list(csv.DictReader((p / 'redteam_review_inventory_v9.csv').open(encoding='utf-8')))
          holdout = list(csv.DictReader((p / 'fresh_holdout_template_v9.csv').open(encoding='utf-8')))

          assert s['source_bulk_candidate_identities'] == 1843
          assert len(inv) == 1843
          assert len(flagged) == s['redteam_review_rows']
          assert len(holdout) == 120
          assert s['clean_for_fresh_holdout_rows'] + s['redteam_review_rows'] == 1843
          assert all(not r['human_intent'] for r in holdout)
          assert s['learned_token_use'] == 'DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['manual_pattern_use'] == 'DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['holdout_verdicts_generated'] == 'NO'
          assert s['semantic_authority'] == 'NO'
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_BULK_CANDIDATE_ADVERSARIAL_V9_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/bulk_candidate_adversarial_v9
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize bulk candidate adversarial v9'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
