name: Issue118 General Three Cluster Review V54

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_general_three_cluster_review_v54.py
      - docs/issue118/research_sidecar_v29.csv
      - .github/workflows/issue118_general_three_cluster_review_v54.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  general-three-cluster-review-v54:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v54 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_general_three_cluster_review_v54.py
          python3 scripts/issue118/materialize_general_three_cluster_review_v54.py
      - name: Validate v54
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/general_three_cluster_review_v54/full_review_candidate_v54.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/general_three_cluster_review_v54/summary_v54.json').read_text(encoding='utf-8'))
          assert len(rows)==72
          assert s['candidate_rows']==72
          assert s['cluster_counts']=={
              'GENERAL_ONLY|ACTION_CONTACT|NONE':25,
              'GENERAL_ONLY|CLOTHING/COSTUME|NONE':27,
              'GENERAL_ONLY|POSE_MOVEMENT|NONE':20,
          }
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_GENERAL_THREE_CLUSTER_V54_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/general_three_cluster_review_v54/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize general three-cluster review v54'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
