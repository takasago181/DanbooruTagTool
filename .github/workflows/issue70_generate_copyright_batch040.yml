name: Issue70 Generate Copyright Audit Batch 040

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_copyright_curated_keep_batch040.py
      - .github/workflows/issue70_generate_copyright_batch040.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/generate_copyright_curated_keep_batch040.py
      - name: Validate proposal only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/copyright_curated_safe_keep_batch040.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path('docs/issue70/audit/copyright_curated_safe_keep_batch040.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)>=1
          assert all(r['audit_verdict']=='KEEP' for r in rows)
          blocked={'DUPLICATE_DISPLAY_WITHIN_CATEGORY','DISAMBIGUATOR_NOT_VISIBLE','RAW_TAG_SYNTAX_IN_DISPLAY','UNBALANCED_BRACKETS','DISPLAY_UNUSUALLY_LONG'}
          for r in rows:
              flags={x.strip() for x in r['risk_flags'].split('|') if x.strip()}
              assert not (flags & blocked)
          print({'rows':len(rows),'keep':len(rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Refresh progress
        run: python scripts/issue70/summarize_semantic_audit_progress.py
      - name: Validate progress and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/PROGRESS_LIVE.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert d['conflicted_unique_rows']==0
          assert d['audited_unique_rows']+d['remaining_unaudited_rows']==d['initial_ledger_rows']
          print({k:d[k] for k in ['audited_unique_rows','remaining_unaudited_rows','remaining_by_category','verdict_counts_resolved']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
          git add docs/issue70/audit/copyright_curated_safe_keep_batch040.csv docs/issue70/audit/PROGRESS_LIVE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist safe curated Copyright KEEP batch 040'
          git push origin HEAD:audit/issue70-semantic-final
