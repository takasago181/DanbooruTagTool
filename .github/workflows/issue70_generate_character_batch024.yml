name: Issue70 Generate Character Audit Batch 024

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_character_curated_stale_evidence_keep_batch024.py
      - .github/workflows/issue70_generate_character_batch024.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-character-batch024
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/generate_character_curated_stale_evidence_keep_batch024.py
      - name: Validate proposal-only output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_curated_stale_evidence_keep_batch024.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path('docs/issue70/audit/character_curated_stale_evidence_keep_batch024.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)>=1
          assert all(r['audit_verdict']=='KEEP' for r in rows)
          assert all(r['reason_code']=='CURATED_CHARACTER_STALE_SOURCE_EVIDENCE_ONLY' for r in rows)
          forbidden=('DUPLICATE_DISPLAY_WITHIN_CATEGORY','DISAMBIGUATOR_NOT_VISIBLE','VARIANT_DISPLAY_MISSING_BASE_IDENTITY','STATUS_REVIEW_REQUIRED','RAW_TAG_SYNTAX_IN_DISPLAY')
          assert all(not any(x in (r['risk_flags'] or '') for x in forbidden) for r in rows)
          print({'rows':len(rows),'keep':len(rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Refresh exact progress summary
        run: python scripts/issue70/summarize_semantic_audit_progress.py
      - name: Validate progress summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/PROGRESS_LIVE.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert d['audited_unique_rows']+d['remaining_unaudited_rows']==d['initial_ledger_rows']
          assert d['conflicted_unique_rows']==0
          print({k:d[k] for k in ['audited_unique_rows','remaining_unaudited_rows','remaining_by_category','verdict_counts_resolved']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit audit batch and progress only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/character_curated_stale_evidence_keep_batch024.csv docs/issue70/audit/PROGRESS_LIVE.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist curated stale-evidence batch 024 and progress'
          git push origin HEAD:audit/issue70-semantic-final
