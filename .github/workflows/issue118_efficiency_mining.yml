name: Issue118 Efficiency Mining

on:
  push:
    branches:
      - research/issue118-efficiency-mining
    paths:
      - scripts/issue118/mine_crossvalidated_rules.py
      - scripts/issue118/cluster_coverage_queue.py
      - scripts/issue118/evaluate_lexeme_expansion_v3.py
      - scripts/issue118/evaluate_general_subpath_candidates.py
      - scripts/issue118/materialize_research_sidecar_v2.py
      - .github/workflows/issue118_efficiency_mining.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/issue118/mine_crossvalidated_rules.py
          python3 -m py_compile scripts/issue118/cluster_coverage_queue.py
          python3 -m py_compile scripts/issue118/evaluate_lexeme_expansion_v3.py
          python3 -m py_compile scripts/issue118/evaluate_general_subpath_candidates.py
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v2.py

      - name: Mine cross-validated candidate rules
        run: python3 scripts/issue118/mine_crossvalidated_rules.py

      - name: Cluster unclassified queue
        run: python3 scripts/issue118/cluster_coverage_queue.py

      - name: Evaluate lexeme expansion
        run: python3 scripts/issue118/evaluate_lexeme_expansion_v3.py

      - name: Evaluate General subpath candidates
        run: python3 scripts/issue118/evaluate_general_subpath_candidates.py

      - name: Materialize research sidecar v2
        run: python3 scripts/issue118/materialize_research_sidecar_v2.py

      - name: Validate outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/issue118/efficiency_mining_v1')
          s=json.loads((root/'summary_v1.json').read_text(encoding='utf-8'))
          assert s['coverage_queue_rows']==1000
          assert s['candidate_rows']+s['conflict_rows']+s['unresolved_rows']==1000
          assert s['safety_contract']['requires_both_pilot_and_holdout_support'] is True
          assert s['safety_contract']['training_purity_required']==1.0
          assert s['safety_contract']['taxonomy_or_family_only_rules_allowed'] is False

          c=json.loads(Path('docs/issue118/efficiency_clustering_v1/summary_v1.json').read_text(encoding='utf-8'))
          assert c['queue_rows']==1000 and c['production_promotion_performed']=='NO'
          l=json.loads(Path('docs/issue118/lexeme_expansion_v3/summary_v1.json').read_text(encoding='utf-8'))
          assert l['source_unclassified']==26044 and l['production_promotion_performed']=='NO'
          g=json.loads(Path('docs/issue118/general_subpath_candidates_v1/summary_v1.json').read_text(encoding='utf-8'))
          assert g['production_promotion_performed']=='NO'
          v2=json.loads(Path('docs/issue118/research_sidecar_summary_v2.json').read_text(encoding='utf-8'))
          assert v2['identity_rows']==31752
          assert v2['new_promotions_total']==1896
          assert v2['review_status_counts']['UNCLASSIFIED']==24148
          assert v2['production_authority']=='NO'
          print('ISSUE118_EFFICIENCY_MINING_GATE=PASS')
          PY

      - name: Persist research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/efficiency_mining_v1 docs/issue118/efficiency_clustering_v1 docs/issue118/lexeme_expansion_v3 docs/issue118/general_subpath_candidates_v1 docs/issue118/research_sidecar_v2.csv docs/issue118/research_sidecar_summary_v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize efficiency-expanded research sidecar v2'
            git push origin HEAD:research/issue118-efficiency-mining
          fi
