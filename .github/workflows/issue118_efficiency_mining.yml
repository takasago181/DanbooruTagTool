name: Issue118 Efficiency Mining

on:
  push:
    branches:
      - research/issue118-efficiency-mining
    paths:
      - scripts/issue118/mine_crossvalidated_rules.py
      - scripts/issue118/cluster_coverage_queue.py
      - scripts/issue118/evaluate_lexeme_expansion_v3.py
      - scripts/issue118/evaluate_general_subpath_candidates.py
      - scripts/issue118/materialize_research_sidecar_v2.py
      - scripts/issue118/evaluate_general_subpath_wave2.py
      - .github/workflows/issue118_efficiency_mining.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/issue118/mine_crossvalidated_rules.py
          python3 -m py_compile scripts/issue118/cluster_coverage_queue.py
          python3 -m py_compile scripts/issue118/evaluate_lexeme_expansion_v3.py
          python3 -m py_compile scripts/issue118/evaluate_general_subpath_candidates.py
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v2.py
          python3 -m py_compile scripts/issue118/evaluate_general_subpath_wave2.py
      - name: Materialize baseline research evidence
        run: |
          python3 scripts/issue118/mine_crossvalidated_rules.py
          python3 scripts/issue118/cluster_coverage_queue.py
          python3 scripts/issue118/evaluate_lexeme_expansion_v3.py
          python3 scripts/issue118/evaluate_general_subpath_candidates.py
          python3 scripts/issue118/materialize_research_sidecar_v2.py
      - name: Evaluate high-leverage General wave2
        run: python3 scripts/issue118/evaluate_general_subpath_wave2.py
      - name: Validate outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v2=json.loads(Path('docs/issue118/research_sidecar_summary_v2.json').read_text(encoding='utf-8'))
          assert v2['identity_rows']==31752 and v2['review_status_counts']['UNCLASSIFIED']==24148
          w=json.loads(Path('docs/issue118/general_subpath_wave2/summary.json').read_text(encoding='utf-8'))
          assert w['candidate_paths'] <= 8
          assert w['validation_rows'] <= 96
          assert w['production_promotion_performed']=='NO'
          print('ISSUE118_EFFICIENCY_WAVE2_GATE=PASS')
          PY
      - name: Persist research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/efficiency_mining_v1 docs/issue118/efficiency_clustering_v1 docs/issue118/lexeme_expansion_v3 docs/issue118/general_subpath_candidates_v1 docs/issue118/research_sidecar_v2.csv docs/issue118/research_sidecar_summary_v2.json docs/issue118/general_subpath_wave2
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize high-leverage General wave2'
            git push origin HEAD:research/issue118-efficiency-mining
          fi
