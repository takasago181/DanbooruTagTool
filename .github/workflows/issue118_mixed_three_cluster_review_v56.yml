name: Issue118 Mixed Three Cluster Review V56

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_mixed_three_cluster_review_v56.py
      - docs/issue118/research_sidecar_v31.csv
      - .github/workflows/issue118_mixed_three_cluster_review_v56.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mixed-three-cluster-review-v56:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v56 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_mixed_three_cluster_review_v56.py
          python3 scripts/issue118/materialize_mixed_three_cluster_review_v56.py
      - name: Validate v56
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/mixed_three_cluster_review_v56/full_review_candidate_v56.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/mixed_three_cluster_review_v56/summary_v56.json').read_text(encoding='utf-8'))
          assert len(rows)==66
          assert s['candidate_rows']==66
          assert s['cluster_counts']=={
              'OVERLAP|ACTION_CONTACT|CONTEXT_MODIFIER|NONE':22,
              'OVERLAP|ACTION_CONTACT|POSE_COMPOSITION|NONE':22,
              'OVERLAP|BODY_PART|DAMAGE_STATE_ACTION|INJURY':22,
          }
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_MIXED_THREE_CLUSTER_V56_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/mixed_three_cluster_review_v56/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize mixed three-cluster review v56'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
