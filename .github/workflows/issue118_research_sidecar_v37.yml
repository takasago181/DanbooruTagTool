name: Issue118 Research Sidecar V37

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v37.py
      - docs/issue118/research_sidecar_v36.csv
      - docs/issue118/mixed_seven_cluster_review_v61/review_policy_v61.json
      - docs/issue118/mixed_seven_cluster_review_v61/full_review_candidate_v61.csv
      - .github/workflows/issue118_research_sidecar_v37.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v37:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v37
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v37.py
          python3 scripts/issue118/materialize_research_sidecar_v37.py
      - name: Validate v37
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v37.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v37.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==94
          assert s['new_promotions']=={'CONTEXTUAL':31,'NON_SEXUAL':12,'SEXUAL':51}
          assert s['retained_unclassified_from_review']==['blacked_male']
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':4056,'UNCLASSIFIED':5325}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1150,'NON_SEXUAL':23579,'NULL':5325,'SEXUAL':1698}
          assert s['remaining_unclassified']==5325
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V37_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v37.csv docs/issue118/research_sidecar_summary_v37.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v37'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
