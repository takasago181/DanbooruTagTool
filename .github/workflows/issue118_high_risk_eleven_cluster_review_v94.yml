name: Issue118 High Risk Eleven Cluster Review V94

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_high_risk_eleven_cluster_review_v94.py
      - docs/issue118/research_sidecar_v65.csv
      - .github/workflows/issue118_high_risk_eleven_cluster_review_v94.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  high-risk-v94:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v94 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_high_risk_eleven_cluster_review_v94.py
          python3 scripts/issue118/materialize_high_risk_eleven_cluster_review_v94.py
      - name: Validate v94
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/high_risk_eleven_cluster_review_v94/full_review_candidate_v94.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/high_risk_eleven_cluster_review_v94/summary_v94.json').read_text(encoding='utf-8'))
          assert len(rows)==98
          assert s['candidate_rows']==98
          assert s['source_sidecar']=='research_sidecar_v65.csv'
          assert sum(s['cluster_counts'].values())==98
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_HIGH_RISK_ELEVEN_V94_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/high_risk_eleven_cluster_review_v94/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize high-risk eleven-cluster review v94'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
