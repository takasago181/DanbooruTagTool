name: issue70-chunk115-116-publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk115_116_auditprep.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validate and publish chunks 115-116
        shell: python
        run: |
          import csv, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path

          repo=Path.cwd()
          specs=[
            (115,'I70-057001','I70-057500','docs/issue70/data/source_chunks/source_057001_057500.csv','1d5b8800186d66f93629c76420ed88c9ebcf5ce8dd4e37c5431e514d564bb884','docs/issue70/data/results/queue/queue_chunk115_I70-057001_I70-057500.csv'),
            (116,'I70-057501','I70-058000','docs/issue70/data/source_chunks/source_057501_058000.csv','36afc2fe464ca1b807f8f6742b148b4f939ea11c81506155c4ecaede7fd53478','docs/issue70/data/results/queue/queue_chunk116_I70-057501_I70-058000.csv'),
          ]
          promotions={
            'haccan':'ハッカン',
            'hiwatari_rin':'樋渡りん',
            'robina':'ろび～な',
            'barasui':'ばらスィー',
            'katoki_hajime':'カトキハジメ',
            'kobayashi_ritz':'小林立',
            'nanaka_mai':'ななかまい',
            'yuuki_nobuteru':'結城信輝',
            'nekonyan':'ねこにゃん',
            'takeuchi_naoko':'武内直子',
            'shindol':'新堂エル',
            'fujimori_shiki':'藤森しき',
          }
          result_fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          manifest=json.loads((repo/'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          entries={e['chunk_index']:e for e in manifest['chunks']}
          total=0; jp_candidates=0; used=[]
          for idx,first,last,src_rel,expected_sha,out_rel in specs:
            entry=entries[idx]
            assert entry['first_row_id']==first and entry['last_row_id']==last and entry['row_count']==500 and entry['file']==src_rel and entry['sha256']==expected_sha
            src=repo/src_rel
            assert hashlib.sha256(src.read_bytes()).hexdigest()==expected_sha
            with src.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500 and rows[0]['row_id']==first and rows[-1]['row_id']==last
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            out=[]
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): jp_candidates+=1
              tag=r['canonical_tag']
              if tag in promotions:
                display=promotions[tag]
                used.append((r['row_id'],tag,display))
                note='semantic artist audit: independently verified Japanese name'
              else:
                display=tag.replace('_',' ')
                note='semantic artist audit: canonical handle preserved; no independently verified Japanese name'
              out.append({'row_id':r['row_id'],'canonical_tag':tag,'category':r['category'],'display_ja':display,'search_ja':'','translation_status':'ACCEPTED_AI','translation_note':note})
            dst=repo/out_rel
            if dst.exists():
              raise SystemExit(f'immutable queue result already exists: {out_rel}')
            dst.parent.mkdir(parents=True,exist_ok=True)
            with dst.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=result_fields,lineterminator='\n'); w.writeheader(); w.writerows(out)
            total+=len(out)

          spec=importlib.util.spec_from_file_location('publish_local_batch',repo/'scripts/issue70/publish_local_batch.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for *_,out_rel in specs:
            entry,rows=mod.validate_result(repo,repo/out_rel)
            assert len(rows)==500
            print('VALIDATED',entry['chunk_index'],out_rel,len(rows))
          assert total==1000
          assert jp_candidates==418
          assert len(used)==len(promotions)==12
          print('TOTAL_ROWS',total)
          print('JP_CANDIDATE_COUNT',jp_candidates)
          print('PROMOTION_COUNT',len(used))
          for x in used: print('PROMOTE\t'+'\t'.join(x))

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add']+[s[-1] for s in specs],check=True)
          subprocess.run(['git','commit','-m','issue70: publish 1000-row artist audit chunks 115-116'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
