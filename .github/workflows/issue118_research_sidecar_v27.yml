name: Issue118 Research Sidecar V27

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v27.py
      - docs/issue118/research_sidecar_v26.csv
      - docs/issue118/overlap_action_anatomy_review_v43/review_policy_v43.json
      - docs/issue118/overlap_action_anatomy_review_v43/full_review_candidate_v43.csv
      - docs/issue118/action_object_use_review_v44/review_policy_v44.json
      - docs/issue118/action_object_use_review_v44/full_review_candidate_v44.csv
      - .github/workflows/issue118_research_sidecar_v27.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v27:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v27
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v27.py
          python3 scripts/issue118/materialize_research_sidecar_v27.py
      - name: Validate v27
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v27.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v27.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['remaining_unclassified']==6137
          assert s['new_promotions']=={'CONTEXTUAL':6,'NON_SEXUAL':42,'SEXUAL':54}
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V27_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v27.csv docs/issue118/research_sidecar_summary_v27.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v27'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
