name: Issue76 Refine Browse Controls Retry

on:
  push:
    branches:
      - feature/issue76-special-v2-main-ui

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Issue 76 retry integrated browse controls refinement'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue76-special-v2-main-ui
          fetch-depth: 0

      - name: Apply refinement retry
        shell: pwsh
        run: python tools/issue76_refine_browse_controls_retry.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore src/DanbooruTagTool.sln

      - name: Release build
        shell: pwsh
        run: dotnet build src/DanbooruTagTool.sln -c Release --no-restore

      - name: Tests
        shell: pwsh
        run: dotnet test src/DanbooruTagTool.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Diff check
        shell: pwsh
        run: git diff --check

      - name: Commit validated refinement
        shell: pwsh
        run: |
          git config user.name "takasago181"
          git config user.email "61348957+takasago181@users.noreply.github.com"
          git rm tools/issue76_refine_browse_controls.py tools/issue76_refine_browse_controls_retry.py .github/workflows/issue76_refine_browse_controls.yml .github/workflows/issue76_refine_browse_controls_retry.yml
          git add -A
          git commit -m "Issue 76 refine Special browse controls from user test"
          git push origin HEAD:feature/issue76-special-v2-main-ui
