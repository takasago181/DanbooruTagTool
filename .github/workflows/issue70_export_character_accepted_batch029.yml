name: Issue70 Export Character Accepted Batch 029 Diagnostic

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/export_remaining_character_accepted_batch029_diagnostic.py
      - .github/workflows/issue70_export_character_accepted_batch029.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-character-accepted-batch029-diagnostic
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/export_remaining_character_accepted_batch029_diagnostic.py
      - name: Validate diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_remaining_accepted_batch029_diagnostic.csv
          test -s docs/issue70/audit/character_remaining_accepted_batch029_summary.json
          python - <<'PY'
          import csv,json
          from pathlib import Path
          with Path('docs/issue70/audit/character_remaining_accepted_batch029_diagnostic.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          d=json.loads(Path('docs/issue70/audit/character_remaining_accepted_batch029_summary.json').read_text(encoding='utf-8'))
          assert len(rows)==d['population']
          assert d['production_modified'] is False
          assert len(rows)>=1
          print({'rows':len(rows),'groups':len(d['groups'])})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/character_remaining_accepted_batch029_diagnostic.csv docs/issue70/audit/character_remaining_accepted_batch029_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist remaining Character Accepted diagnostic batch 029'
          git push origin HEAD:audit/issue70-semantic-final
