name: Issue118 Exposure Six Cluster Review V60

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_exposure_six_cluster_review_v60.py
      - docs/issue118/research_sidecar_v35.csv
      - .github/workflows/issue118_exposure_six_cluster_review_v60.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exposure-six-cluster-review-v60:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v60 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_exposure_six_cluster_review_v60.py
          python3 scripts/issue118/materialize_exposure_six_cluster_review_v60.py
      - name: Validate v60
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/exposure_six_cluster_review_v60/full_review_candidate_v60.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/exposure_six_cluster_review_v60/summary_v60.json').read_text(encoding='utf-8'))
          assert len(rows)==89
          assert s['candidate_rows']==89
          assert s['source_sidecar']=='research_sidecar_v35.csv'
          assert s['cluster_counts']=={
              'OVERLAP|ACTION_CONTACT|CLOTHING_EXPOSURE|ANATOMY':12,
              'OVERLAP|CLOTHING|CLOTHING_EXPOSURE|EXPOSURE_INTIMATE':14,
              'OVERLAP|CLOTHING|CLOTHING_EXPOSURE|SEXUALIZED_CLOTHING':17,
              'OVERLAP|CLOTHING_STATE_EXPOSURE|(none)|EXPOSURE_INTIMATE':16,
              'OVERLAP|CLOTHING_STATE_EXPOSURE|BODY_ATTRIBUTE|ANATOMY':17,
              'OVERLAP|CLOTHING_STATE_EXPOSURE|CLOTHING_EXPOSURE|ANATOMY':13,
          }
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_EXPOSURE_SIX_CLUSTER_V60_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/exposure_six_cluster_review_v60/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize exposure six-cluster review v60'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
