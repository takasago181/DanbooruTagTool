name: Issue70 Export Explicit Mismatch Rows

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/export_explicit_mismatch_rows.py
      - .github/workflows/issue70_export_explicit_mismatch_rows.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/export_explicit_mismatch_rows.py
      - name: Validate diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/EXPLICIT_MISMATCH_ROWS.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/EXPLICIT_MISMATCH_ROWS.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert len(d['rows']) >= 1
          print({'rows':len(d['rows'])})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/EXPLICIT_MISMATCH_ROWS.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist explicit mismatch diagnostic rows'
          git push origin HEAD:audit/issue70-semantic-final
