name: Issue132 Legacy Manual Audit Repair (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Historical repair script syntax
        run: python -m py_compile scripts/issue132/rebuild_manual_audit_structural_repairs.py
      - name: Current Codex runtime validation
        run: python scripts/issue132/validate_flat_pass_a.py
