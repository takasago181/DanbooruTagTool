name: Issue118 Pose Movement Refinement V14

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_pose_movement_refinement_v14.py
      - docs/issue118/research_sidecar_v5.csv
      - docs/issue64/production_candidate/effective_sidecar.csv
      - .github/workflows/issue118_pose_movement_refinement_v14.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pose movement refinement v14
        run: |
          python3 -m py_compile scripts/issue118/materialize_pose_movement_refinement_v14.py
          python3 scripts/issue118/materialize_pose_movement_refinement_v14.py
      - name: Validate v14
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          p = Path('docs/issue118/pose_movement_refinement_v14')
          s = json.loads((p / 'summary_v14.json').read_text(encoding='utf-8'))
          boundary = list(csv.DictReader((p / 'pose_boundary_v14.csv').open(encoding='utf-8')))
          clean = list(csv.DictReader((p / 'pose_clean_v14.csv').open(encoding='utf-8')))
          holdout = list(csv.DictReader((p / 'fresh_holdout_template_v14.csv').open(encoding='utf-8')))
          assert s['source_rows'] == 726
          assert len(boundary) == s['boundary_rows']
          assert len(clean) == s['clean_candidate_rows']
          assert len(boundary) + len(clean) == 726
          assert len(holdout) == 120
          assert all(not r['human_intent'] for r in holdout)
          assert s['holdout_verdicts_generated'] == 'NO'
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_POSE_MOVEMENT_V14_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/pose_movement_refinement_v14
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize pose movement refinement v14'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
