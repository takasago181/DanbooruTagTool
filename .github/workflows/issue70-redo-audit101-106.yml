name: Issue70 temporary audit chunks 101-106

on:
  push:
    paths:
      - '.github/workflows/issue70-redo-audit101-106.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compact artist candidate audit report
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path

          repo = Path.cwd()
          jobs = [
              ('050001','050500'),('050501','051000'),('051001','051500'),
              ('051501','052000'),('052001','052500'),('052501','053000'),
          ]
          jp = re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          out = repo / 'docs/issue70/data/tmp_artist_candidate_audit_101_106.csv'
          fields = ['row_id','canonical_tag','source_aliases','verified_aliases','existing_candidate_ja','existing_display_ja','existing_search_ja']
          rows_out=[]
          total=0
          for start,end in jobs:
              src=repo/f'docs/issue70/data/source_chunks/source_{start}_{end}.csv'
              with src.open(encoding='utf-8-sig', newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==500
              assert all(r['category']=='1' and r['category_name']=='Artist' for r in rows)
              total += len(rows)
              for r in rows:
                  cand=r.get('existing_candidate_ja','') or ''
                  disp=r.get('existing_display_ja','') or ''
                  sea=r.get('existing_search_ja','') or ''
                  # Only rows where Japanese-looking evidence exists need semantic inspection.
                  if jp.search(cand) or jp.search(disp) or jp.search(sea):
                      rows_out.append({k:r.get(k,'') for k in fields})
          with out.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows_out)
          print(f'total_source_rows={total}')
          print(f'japanese_evidence_rows={len(rows_out)}')
          PY
      - name: Commit temporary audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/tmp_artist_candidate_audit_101_106.csv
          git commit -m 'chore(issue70): temporary artist audit report 101-106'
          git push origin HEAD:main
