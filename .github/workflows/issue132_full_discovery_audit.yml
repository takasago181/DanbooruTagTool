name: Issue132 Full Discovery Coverage Audit

on:
  push:
    branches:
      - research/taxonomy-usability-audit
    paths:
      - "scripts/issue132/**"
      - "docs/issue132/CURRENT_RECOMMENDED_DIRECTION.md"
      - "docs/issue132/FULL_SEMANTIC_REVIEW_PROTOCOL.md"
      - "docs/issue132/LUNA_*.md"
      - "docs/issue132/CODEX_FULL_SEMANTIC_REVIEW_HANDOFF.md"
      - "docs/issue132/prototype_route_overrides_v0_1.csv"
      - "docs/issue132/parallel/pass_a_contract_manifest_v1.json"
      - "docs/issue118/production_candidate/sexual_intent_v2.csv"
      - "docs/issue64/production_candidate/effective_sidecar.csv"
      - "data/generation/special2788_generation_profile.csv"
      - "src/DanbooruTagTool.Data/Issue56Inputs.cs"
      - "src/DanbooruTagTool.Data/Issue76Data/**"
      - "src/DanbooruTagTool.Data/UnifiedBrowseData/special_route_overrides_v1.csv"
      - "docs/issue96/special_expansion_promotion_proposal_v1.csv"
      - "docs/issue107/promotion_metadata_v1.csv"
      - ".github/workflows/issue132_full_discovery_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/taxonomy-usability-audit
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run full discovery coverage audit
        run: |
          python scripts/issue132/full_discovery_coverage_audit.py \
            --root . \
            --out artifacts/issue132/full-discovery-audit

      - name: Build Luna neutral input
        run: |
          python scripts/issue132/build_luna_neutral_input.py \
            --out artifacts/issue132/luna-neutral/luna_neutral_review_input_v2.csv

      - name: Verify review vocabulary against runtime code
        run: python scripts/issue132/check_review_vocabulary_against_code.py

      - name: Freeze Pass A contract manifest
        run: |
          python scripts/issue132/build_pass_a_contract_manifest.py \
            --neutral artifacts/issue132/luna-neutral/luna_neutral_review_input_v2.csv \
            --neutral-manifest artifacts/issue132/luna-neutral/luna_neutral_review_input_v2.manifest.json \
            --out artifacts/issue132/pass-a-contract/pass_a_contract_manifest_v1.json

      - name: Test Pass A ledger validator contract
        run: python scripts/issue132/test_validate_luna_pass_a.py

      - name: Test Pass B deterministic diff contract
        run: python scripts/issue132/test_build_pass_b_diff.py

      - name: Validate committed parallel checkpoints
        run: python scripts/issue132/validate_parallel_checkpoints.py

      - name: Check pre-handoff authority consistency
        run: python scripts/issue132/check_pre_handoff_consistency.py

      - name: Smoke bootstrap and resume helper
        run: |
          python scripts/issue132/bootstrap_luna_pass_a.py \
            --artifact-root artifacts/issue132/bootstrap-smoke \
            --review-dir artifacts/issue132/bootstrap-review
          python scripts/issue132/bootstrap_luna_pass_a.py \
            --artifact-root artifacts/issue132/bootstrap-smoke \
            --review-dir artifacts/issue132/bootstrap-review

      - name: Confirm incomplete finalizer fails closed
        run: |
          if python scripts/issue132/finalize_luna_pass_a.py \
            --artifact-root artifacts/issue132/bootstrap-smoke \
            --review-dir artifacts/issue132/bootstrap-review; then
            echo "ERROR: finalizer accepted incomplete Pass A"
            exit 1
          else
            echo "PASS: finalizer rejected incomplete Pass A"
          fi




      - name: Upload audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue132-full-discovery-audit
          path: |
            artifacts/issue132/full-discovery-audit
            artifacts/issue132/luna-neutral
            artifacts/issue132/pass-a-contract
          if-no-files-found: error

