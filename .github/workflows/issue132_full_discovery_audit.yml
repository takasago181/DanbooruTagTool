name: Issue132 Legacy Full Discovery Rebuild (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run legacy full-discovery diagnostic
        run: |
          python scripts/issue132/full_discovery_coverage_audit.py \
            --root . \
            --out artifacts/issue132/full-discovery-audit

      - name: Rebuild neutral input as a diagnostic artifact only
        run: |
          python scripts/issue132/build_luna_neutral_input.py \
            --out artifacts/issue132/luna-neutral/luna_neutral_review_input_v2.csv
          test "$(sha256sum artifacts/issue132/luna-neutral/luna_neutral_review_input_v2.csv | awk '{print $1}')" = \
            "ac0f888d02f19a440c63b3b9f695c58f9ba53b98ebe9756edec51db1c5ff8f7d"

      - name: Validate tracked frozen shards
        run: |
          python scripts/issue132/validate_worker_neutral_shards.py \
            --input docs/issue132/parallel/input/luna_neutral_review_input_v2.csv \
            --shard-root docs/issue132/parallel/input-shards

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue132-legacy-full-discovery-diagnostic
          path: artifacts/issue132
          if-no-files-found: error
          retention-days: 30
