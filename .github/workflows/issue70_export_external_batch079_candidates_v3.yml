name: Issue70 Export External Batch079 Candidates v3
on:
  push:
    branches: [audit/issue70-semantic-final]
    paths:
      - 'scripts/issue70/export_external_batch079_candidates_v3.py'
      - '.github/workflows/issue70_export_external_batch079_candidates_v3.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-export-batch079-candidates-v3
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export effective batch079 candidates
        run: python scripts/issue70/export_external_batch079_candidates_v3.py
      - name: Validate diagnostic outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          a=list(csv.DictReader(Path('docs/issue70/audit/EXTERNAL_QUEUE_BATCH079_CANDIDATES.csv').open(encoding='utf-8-sig',newline='')))
          c=list(csv.DictReader(Path('docs/issue70/audit/EXTERNAL_QUEUE_BATCH079_COPYRIGHT_CANDIDATES.csv').open(encoding='utf-8-sig',newline='')))
          e=json.loads(Path('docs/issue70/audit/EXTERNAL_PROGRESS_LIVE.json').read_text(encoding='utf-8'))
          assert len(a)==600, len(a)
          assert len({r['row_id'] for r in a})==600
          assert all(r['category'] in {'Copyright','Character','Artist'} for r in a)
          assert len(c)>=80, len(c)
          assert len({r['row_id'] for r in c})==len(c)
          assert e['resolved_external_rows']==321
          assert e['remaining_external_rows']==1174
          assert e['conflicted_external_rows']==0
          assert e['production_modified'] is False
          print({'top600':len(a),'copyright_candidates':len(c),'remaining':e['remaining_external_rows']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit corrected diagnostic candidates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/issue70/audit/EXTERNAL_QUEUE_BATCH079_CANDIDATES.csv docs/issue70/audit/EXTERNAL_QUEUE_BATCH079_COPYRIGHT_CANDIDATES.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Issue70: export robust batch079 effective candidates'
          git push origin HEAD:audit/issue70-semantic-final
