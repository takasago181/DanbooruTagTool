name: Issue70 Generate Character Audit Batch 037

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_character_search_repair_batch037.py
      - .github/workflows/issue70_generate_character_batch037.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/generate_character_search_repair_batch037.py
      - name: Validate proposal only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_source_supported_search_repair_batch037.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path('docs/issue70/audit/character_source_supported_search_repair_batch037.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)>=1
          assert all(r['audit_verdict']=='FIX_SEARCH' for r in rows)
          assert all(r['reason_code']=='SOURCE_SUPPORTED_DISPLAY_MISSING_FROM_SEARCH' for r in rows)
          assert all(r['source_support_field'] in {'existing_display_ja','existing_search_ja','verified_aliases','source_aliases'} for r in rows)
          print({'rows':len(rows),'fix_search':len(rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Refresh progress
        run: python scripts/issue70/summarize_semantic_audit_progress.py
      - name: Validate progress and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/PROGRESS_LIVE.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert d['conflicted_unique_rows']==0
          assert d['audited_unique_rows']+d['remaining_unaudited_rows']==d['initial_ledger_rows']
          print({k:d[k] for k in ['audited_unique_rows','remaining_unaudited_rows','remaining_by_category','verdict_counts_resolved']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
          git add docs/issue70/audit/character_source_supported_search_repair_batch037.csv docs/issue70/audit/PROGRESS_LIVE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist source-supported search repair batch 037'
          git push origin HEAD:audit/issue70-semantic-final
