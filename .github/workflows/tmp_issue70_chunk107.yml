name: TEMP Issue70 Chunk107 Artist Audit

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp_issue70_chunk107.yml'

permissions:
  contents: write

concurrency:
  group: issue70-chunk107-audit
  cancel-in-progress: false

jobs:
  audit-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build semantically audited Artist result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import re
          from pathlib import Path

          source = Path('docs/issue70/data/source_chunks/source_053001_053500.csv')
          result = Path('docs/issue70/data/results/queue/queue_chunk107_I70-053001_I70-053500.csv')
          if result.exists():
              raise SystemExit(f'immutable result already exists: {result}')

          # Independently verified Japanese/common credits from this chunk.
          # Unknown/unverified artists deliberately retain a human-readable canonical handle.
          verified = {
              'nekobayashi': ('猫囃子', ''),
              'matsubara_hidenori': ('松原秀典', ''),
              'ezaki_bisuko': ('江崎びす子', ''),
              'fujieda_miyabi': ('藤枝雅', ''),
              'matsuo_yuusuke': ('松尾祐輔', ''),
              'kikuchi_milo': ('キクチミロ', ''),
              'suzuragi_karin': ('鈴羅木かりん', ''),
              'annindoufu_(oicon)': ('杏仁豆腐', ''),
              'katou_itsuwa': ('加藤いつわ', ''),
              'nakamura_eight': ('中村エイト', ''),
              'ueda_metawo': ('上田メタヲ', ''),
              'tsukasa_jun': ('司淳', ''),
              'nakajima_atsuko': ('中嶋敦子', ''),
              'fukudahda': ('フクダーダ', ''),
          }

          jp_re = re.compile(r'[ぁ-んァ-ヶ一-龯々〆ヵヶ]')
          with source.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          if len(rows) != 500:
              raise SystemExit(f'expected 500 source rows, got {len(rows)}')
          if rows[0]['row_id'] != 'I70-053001' or rows[-1]['row_id'] != 'I70-053500':
              raise SystemExit('unexpected chunk107 boundaries')
          if any(r['category'] != '1' or r['category_name'] != 'Artist' for r in rows):
              raise SystemExit('chunk107 contains non-Artist row')

          out_fields = [
              'row_id', 'canonical_tag', 'category', 'display_ja', 'search_ja',
              'translation_status', 'translation_note'
          ]
          out = []
          promoted = []
          candidate_reviewed = 0
          for r in rows:
              tag = r['canonical_tag']
              if tag in verified:
                  display, search = verified[tag]
                  note = 'semantic re-audit: independently verified official/common Japanese artist credit'
                  promoted.append((r['row_id'], tag, display))
              else:
                  display = tag.replace('_', ' ')
                  search = ''
                  evidence = ' '.join([
                      r.get('existing_candidate_ja', ''),
                      r.get('existing_display_ja', ''),
                      r.get('existing_search_ja', ''),
                  ])
                  if jp_re.search(evidence):
                      candidate_reviewed += 1
                      note = ('semantic re-audit: Japanese-looking candidate reviewed but not independently trusted; '
                              'canonical artist handle preserved to avoid machine translation or forced transliteration')
                  else:
                      note = 'semantic re-audit: no independently verified Japanese artist credit; canonical artist handle preserved'
              out.append({
                  'row_id': r['row_id'],
                  'canonical_tag': tag,
                  'category': r['category'],
                  'display_ja': display,
                  'search_ja': search,
                  'translation_status': 'ACCEPTED_AI',
                  'translation_note': note,
              })

          result.parent.mkdir(parents=True, exist_ok=True)
          with result.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=out_fields, lineterminator='\n')
              w.writeheader()
              w.writerows(out)

          print(f'rows={len(out)} artist_rows={len(rows)} verified_japanese_promotions={len(promoted)} candidate_rows_semantically_reviewed={candidate_reviewed}')
          for item in promoted:
              print('PROMOTE', *item, sep='\t')
          PY

      - name: Structural validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('issue70_publish', 'scripts/issue70/publish_local_batch.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          result = Path('docs/issue70/data/results/queue/queue_chunk107_I70-053001_I70-053500.csv')
          entry, rows = mod.validate_result(Path.cwd(), result)
          print(f'VALIDATOR_PASS chunk={entry["chunk_index"]} rows={len(rows)} first={rows[0]["row_id"]} last={rows[-1]["row_id"]}')
          PY

      - name: Commit result to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk107_I70-053001_I70-053500.csv
          git commit -m 'Issue #70: translate artist chunk 107'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
