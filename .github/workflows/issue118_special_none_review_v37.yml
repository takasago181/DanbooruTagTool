name: Issue118 Special None Review V37

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_special_none_review_v37.py
      - docs/issue118/research_sidecar_v22.csv
      - .github/workflows/issue118_special_none_review_v37.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  special-none-v37:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Special-none v37
        run: |
          python3 -m py_compile scripts/issue118/materialize_special_none_review_v37.py
          python3 scripts/issue118/materialize_special_none_review_v37.py
      - name: Validate v37
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('docs/issue118/special_none_review_v37')
          rows=list(csv.DictReader((p/'full_review_candidate_v37.csv').open(encoding='utf-8')))
          s=json.loads((p/'summary_v37.json').read_text(encoding='utf-8'))
          assert len(rows)==257
          assert s['candidate_rows']==257
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_SPECIAL_NONE_V37_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/special_none_review_v37
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize Special-none review v37'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
