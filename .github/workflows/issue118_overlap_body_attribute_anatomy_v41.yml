name: Issue118 Overlap Body Attribute Anatomy Review V41

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_body_attribute_anatomy_review_v41.py
      - docs/issue118/research_sidecar_v25.csv
      - .github/workflows/issue118_overlap_body_attribute_anatomy_v41.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v41 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_body_attribute_anatomy_review_v41.py
          python3 scripts/issue118/materialize_overlap_body_attribute_anatomy_review_v41.py
      - name: Validate v41
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/overlap_body_attribute_anatomy_review_v41/full_review_candidate_v41.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/overlap_body_attribute_anatomy_review_v41/summary_v41.json').read_text(encoding='utf-8'))
          assert len(rows)==53
          assert s['candidate_rows']==53
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_OVERLAP_BODY_ATTRIBUTE_ANATOMY_V41_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_body_attribute_anatomy_review_v41
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap body attribute anatomy review v41'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
