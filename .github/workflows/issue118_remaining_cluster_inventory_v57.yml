name: Issue118 Remaining Cluster Inventory V57

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_remaining_cluster_inventory_v57.py
      - docs/issue118/research_sidecar_v32.csv
      - .github/workflows/issue118_remaining_cluster_inventory_v57.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remaining-cluster-inventory-v57:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v57 inventory
        run: |
          python3 -m py_compile scripts/issue118/materialize_remaining_cluster_inventory_v57.py
          python3 scripts/issue118/materialize_remaining_cluster_inventory_v57.py
      - name: Validate v57
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/remaining_cluster_inventory_v57/cluster_inventory_v57.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/remaining_cluster_inventory_v57/summary_v57.json').read_text(encoding='utf-8'))
          assert s['remaining_unclassified_rows']==5694
          assert sum(s['membership_counts'].values())==5694
          assert s['source_sidecar']=='research_sidecar_v32.csv'
          assert len(rows)==s['cluster_count']
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_REMAINING_CLUSTER_INVENTORY_V57_GATE=PASS')
          PY
      - name: Persist research inventory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/remaining_cluster_inventory_v57/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize remaining cluster inventory v57'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
