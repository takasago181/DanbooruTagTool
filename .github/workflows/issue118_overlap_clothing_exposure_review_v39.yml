name: Issue118 Overlap Clothing Exposure Review V39

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_clothing_exposure_review_v39.py
      - docs/issue118/research_sidecar_v23.csv
      - .github/workflows/issue118_overlap_clothing_exposure_review_v39.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlap-clothing-exposure-v39:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize overlap clothing exposure v39
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_clothing_exposure_review_v39.py
          python3 scripts/issue118/materialize_overlap_clothing_exposure_review_v39.py
      - name: Validate v39
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('docs/issue118/overlap_clothing_exposure_review_v39')
          rows=list(csv.DictReader((p/'full_review_candidate_v39.csv').open(encoding='utf-8')))
          s=json.loads((p/'summary_v39.json').read_text(encoding='utf-8'))
          assert len(rows)==83 and s['candidate_rows']==83
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_OVERLAP_CLOTHING_EXPOSURE_V39_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_clothing_exposure_review_v39
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap clothing exposure review v39'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
