name: Issue118 Research Sidecar V17

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v17.py
      - docs/issue118/research_sidecar_v16.csv
      - docs/issue118/special_anatomy_review_v28/review_policy_v28.json
      - docs/issue118/special_anatomy_review_v28/full_review_candidate_v28.csv
      - .github/workflows/issue118_research_sidecar_v17.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v17
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v17.py
          python3 scripts/issue118/materialize_research_sidecar_v17.py
      - name: Validate v17
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          side = Path('docs/issue118/research_sidecar_v17.csv')
          summary = Path('docs/issue118/research_sidecar_summary_v17.json')
          rows = list(csv.DictReader(side.open(encoding='utf-8')))
          s = json.loads(summary.read_text(encoding='utf-8'))
          assert len(rows) == 31752
          assert s['remaining_unclassified'] == 7298
          assert s['new_promotions'] == {'CONTEXTUAL': 42, 'SEXUAL': 128}
          assert s['review_verdicts_generated_by_materializer'] == 'NO'
          assert s['review_artifacts_are_external_inputs'] == 'YES'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_V17_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v17.csv docs/issue118/research_sidecar_summary_v17.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v17'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
