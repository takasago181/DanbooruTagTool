name: Issue118 Pathless Low Risk V23

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_pathless_low_risk_v23.py
      - docs/issue118/research_sidecar_v11.csv
      - .github/workflows/issue118_pathless_low_risk_v23.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pathless-v23:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pathless low-risk v23
        run: |
          python3 -m py_compile scripts/issue118/materialize_pathless_low_risk_v23.py
          python3 scripts/issue118/materialize_pathless_low_risk_v23.py
      - name: Validate v23
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('docs/issue118/pathless_low_risk_v23')
          s = json.loads((p / 'summary_v23.json').read_text(encoding='utf-8'))
          low = list(csv.DictReader((p / 'low_risk_candidate_v23.csv').open(encoding='utf-8')))
          residual = list(csv.DictReader((p / 'boundary_residual_v23.csv').open(encoding='utf-8')))
          holdout = list(csv.DictReader((p / 'fresh_holdout_template_v23.csv').open(encoding='utf-8')))
          assert s['source_rows'] == 2332
          assert len(low) + len(residual) == 2332
          assert len(holdout) == 120
          assert s['holdout_verdicts_generated'] == 'NO'
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_PATHLESS_V23_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/pathless_low_risk_v23
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize pathless low-risk v23'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
