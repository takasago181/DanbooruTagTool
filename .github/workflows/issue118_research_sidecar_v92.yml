name: Issue118 Research Sidecar V92
on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v92.py
      - docs/issue118/research_sidecar_v91.csv
      - docs/issue118/general_none_none_review_v125/review_policy_v125.json
      - docs/issue118/general_none_none_review_v125/full_review_candidate_v125.csv
      - .github/workflows/issue118_research_sidecar_v92.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-sidecar-v92:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v92
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v92.py
          python3 scripts/issue118/materialize_research_sidecar_v92.py
      - name: Validate v92
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v92.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v92.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==100
          assert s['new_promotions']=={'CONTEXTUAL':2,'NON_SEXUAL':97,'SEXUAL':1}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':9138,'UNCLASSIFIED':243}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1950,'NON_SEXUAL':27526,'NULL':243,'SEXUAL':2033}
          assert s['remaining_unclassified']==243
          assert s['review_verdicts_generated_by_materializer']=='NO' and s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO' and s['main_mutated']=='NO' and s['issue117_code_mutated']=='NO' and s['catalog_mutated']=='NO' and s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V92_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v92.csv docs/issue118/research_sidecar_summary_v92.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v92'
            git pull --rebase origin research/issue118-cluster-triage-v8
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
