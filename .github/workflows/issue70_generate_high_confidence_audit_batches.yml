name: Issue70 Generate High Confidence Audit Batches

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_high_confidence_audit_batches.py
      - .github/workflows/issue70_generate_high_confidence_audit_batches.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue70-high-confidence-audit-batches
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate proposal-only batches
        run: python scripts/issue70/generate_high_confidence_audit_batches.py

      - name: Validate non-mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('docs/issue70/audit')
          s = json.loads((root/'high_confidence_batches_006_008_summary.json').read_text(encoding='utf-8'))
          assert s['production_modified'] is False
          assert s['search_restore_batch006'] > 0
          assert s['search_dedup_batch007'] > 0
          assert s['artist_initial_audit_batch008'] == 1026
          for name in ('search_restore_batch006.csv','search_dedup_batch007.csv','artist_initial_audit_batch008.csv'):
              with (root/name).open(encoding='utf-8-sig', newline='') as f:
                  rows=list(csv.DictReader(f))
              assert rows
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source

      - name: Commit audit proposals only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/search_restore_batch006.csv \
                  docs/issue70/audit/search_dedup_batch007.csv \
                  docs/issue70/audit/artist_initial_audit_batch008.csv \
                  docs/issue70/audit/high_confidence_batches_006_008_summary.json
          if git diff --cached --quiet; then
            echo 'No generated audit changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist high-confidence semantic audit batches 006-008'
          git push origin HEAD:audit/issue70-semantic-final
