name: Issue118 Overlap Action Three Cluster Review V55

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_action_three_cluster_review_v55.py
      - docs/issue118/research_sidecar_v30.csv
      - .github/workflows/issue118_overlap_action_three_cluster_review_v55.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlap-action-three-cluster-review-v55:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v55 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_action_three_cluster_review_v55.py
          python3 scripts/issue118/materialize_overlap_action_three_cluster_review_v55.py
      - name: Validate v55
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/overlap_action_three_cluster_review_v55/full_review_candidate_v55.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/overlap_action_three_cluster_review_v55/summary_v55.json').read_text(encoding='utf-8'))
          assert len(rows)==78
          assert s['candidate_rows']==78
          assert s['cluster_counts']=={
              'OVERLAP|ACTION_CONTACT|(none)|NONE':25,
              'OVERLAP|ACTION_CONTACT|DIRECT_COMPOSITE|ANATOMY':26,
              'OVERLAP|ACTION_CONTACT|FLUID_STATE_ACTION|NONE':27,
          }
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_OVERLAP_ACTION_THREE_CLUSTER_V55_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_action_three_cluster_review_v55/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap action three-cluster review v55'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
