name: Issue70 Commit Character Audit Batch 049

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - docs/issue70/audit/character_single_candidate_remaining_batch049.csv
      - .github/workflows/issue70_commit_character_batch049.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-character-batch049
  cancel-in-progress: false
jobs:
  validate-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate curated decisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('docs/issue70/audit/character_single_candidate_remaining_batch049.csv')
          with p.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==21
          assert len({r['row_id'] for r in rows})==21
          assert all(r['audit_verdict'] in {'FIX_DISPLAY','NEEDS_EXTERNAL_CHECK'} for r in rows)
          assert all(r['approval_status']=='PROPOSED' for r in rows)
          print({'rows':len(rows),'fix_display':sum(r['audit_verdict']=='FIX_DISPLAY' for r in rows),'external':sum(r['audit_verdict']=='NEEDS_EXTERNAL_CHECK' for r in rows)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Refresh exact progress summary
        run: python scripts/issue70/summarize_semantic_audit_progress.py
      - name: Validate progress summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/PROGRESS_LIVE.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert d['audited_unique_rows']+d['remaining_unaudited_rows']==d['initial_ledger_rows']
          assert d['conflicted_unique_rows']==0
          print({k:d[k] for k in ['audited_unique_rows','remaining_unaudited_rows','remaining_by_category','verdict_counts_resolved']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit refreshed progress only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/PROGRESS_LIVE.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: refresh progress after Character batch 049'
          git push origin HEAD:audit/issue70-semantic-final
