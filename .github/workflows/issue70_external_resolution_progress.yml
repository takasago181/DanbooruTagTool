name: Issue70 External Resolution Progress

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/summarize_external_resolution_progress.py
      - docs/issue70/audit/external_resolutions/**
      - .github/workflows/issue70_external_resolution_progress.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-external-resolution-progress
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/summarize_external_resolution_progress.py
      - name: Validate external progress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/EXTERNAL_PROGRESS_LIVE.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert d['resolved_external_rows'] + d['remaining_external_rows'] == d['initial_external_rows']
          assert d['conflicted_external_rows'] == 0
          print(d)
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit progress only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/EXTERNAL_PROGRESS_LIVE.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: refresh external resolution progress'
          git push origin HEAD:audit/issue70-semantic-final
