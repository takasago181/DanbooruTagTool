name: Issue118 Overlap Action Interaction None Review V45

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_action_interaction_none_review_v45.py
      - docs/issue118/research_sidecar_v26.csv
      - .github/workflows/issue118_overlap_action_interaction_none_review_v45.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlap-action-interaction-none-review-v45:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v45 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_action_interaction_none_review_v45.py
          python3 scripts/issue118/materialize_overlap_action_interaction_none_review_v45.py
      - name: Validate v45
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/overlap_action_interaction_none_review_v45/full_review_candidate_v45.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/overlap_action_interaction_none_review_v45/summary_v45.json').read_text(encoding='utf-8'))
          assert len(rows)==45
          assert s['candidate_rows']==45
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          print('ISSUE118_OVERLAP_ACTION_INTERACTION_NONE_V45_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_action_interaction_none_review_v45/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap action interaction none review v45'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
