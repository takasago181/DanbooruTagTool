name: Issue70 Generate Character Audit Batches 015-016

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/generate_character_batches015_016.py
      - .github/workflows/issue70_generate_character_batches015_016.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: issue70-character-batches015-016
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/generate_character_batches015_016.py
      - name: Validate proposal-only outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path('docs/issue70/audit')
          def rows(n):
              with (root/n).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          a=rows('character_curated_keep_batch015.csv'); b=rows('character_curated_context_batch016.csv')
          assert len(a)>=200 and all(r['audit_verdict']=='KEEP' for r in a)
          assert len(b)>=300 and all(r['audit_verdict']=='FIX_DISPLAY' for r in b)
          print({'batch015':len(a),'batch016':len(b)})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit audit proposals only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/character_curated_keep_batch015.csv docs/issue70/audit/character_curated_context_batch016.csv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist curated Character audit batches 015-016'
          git push origin HEAD:audit/issue70-semantic-final
