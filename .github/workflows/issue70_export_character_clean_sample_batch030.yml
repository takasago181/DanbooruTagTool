name: Issue70 Export Remaining Character Clean Sample Batch 030

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/export_remaining_character_clean_sample_batch030_diagnostic.py
      - .github/workflows/issue70_export_character_clean_sample_batch030.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/export_remaining_character_clean_sample_batch030_diagnostic.py
      - name: Validate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_remaining_clean_sample_batch030_diagnostic.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('docs/issue70/audit/character_remaining_clean_sample_batch030_diagnostic.csv')
          with p.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==68
          assert all(r['audit_bucket']=='ACCEPTED_CLEAN_SAMPLE' for r in rows)
          print({'rows':len(rows),'production_modified':False})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic
        shell: bash
        run: |
          git add docs/issue70/audit/character_remaining_clean_sample_batch030_diagnostic.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: export remaining Character clean sample batch 030'
          git push origin HEAD:audit/issue70-semantic-final
