name: Issue118 Research Sidecar V30

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v30.py
      - docs/issue118/research_sidecar_v29.csv
      - docs/issue118/everyday_restraint_flag_review_v52/review_policy_v52.json
      - docs/issue118/everyday_restraint_flag_review_v52/full_review_candidate_v52.csv
      - docs/issue118/general_three_cluster_review_v54/review_policy_v54.json
      - docs/issue118/general_three_cluster_review_v54/full_review_candidate_v54.csv
      - .github/workflows/issue118_research_sidecar_v30.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v30:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v30
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v30.py
          python3 scripts/issue118/materialize_research_sidecar_v30.py
      - name: Validate v30
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v30.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v30.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==106
          assert s['new_promotions']=={'CONTEXTUAL':19,'NON_SEXUAL':84,'SEXUAL':3}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':3543,'UNCLASSIFIED':5838}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':971,'NON_SEXUAL':23495,'NULL':5838,'SEXUAL':1448}
          assert s['remaining_unclassified']==5838
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V30_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v30.csv docs/issue118/research_sidecar_summary_v30.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v30'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
