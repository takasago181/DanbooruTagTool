name: Issue118 Remaining Small Clusters Review V104

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_remaining_small_clusters_review_v104.py
      - docs/issue118/research_sidecar_v70.csv
      - .github/workflows/issue118_remaining_small_clusters_review_v104.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remaining-small-clusters-v104:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v104 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_remaining_small_clusters_review_v104.py
          python3 scripts/issue118/materialize_remaining_small_clusters_review_v104.py
      - name: Validate v104
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/remaining_small_clusters_review_v104/full_review_candidate_v104.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/remaining_small_clusters_review_v104/summary_v104.json').read_text(encoding='utf-8'))
          assert len(rows)==100
          assert s['candidate_rows']==100
          assert s['eligible_small_cluster_rows']==143
          assert s['giant_cluster_rows']==2237
          assert s['source_sidecar']=='research_sidecar_v70.csv'
          assert s['retained_exclusions']==['cock-tail','knee_boobs','licking_tip','mushikan','powerful_ass']
          assert all((r.get('human_intent') or '')=='' for r in rows)
          assert all((r.get('review_note') or '')=='' for r in rows)
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_REMAINING_SMALL_CLUSTERS_V104_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/remaining_small_clusters_review_v104/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize remaining small-cluster review v104'
            git pull --rebase origin research/issue118-cluster-triage-v8
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
