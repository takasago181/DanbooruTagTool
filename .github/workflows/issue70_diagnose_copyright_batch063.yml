name: Issue70 Diagnose Copyright Audit Batch 063

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/diagnose_copyright_remaining_accepted_batch063.py
      - .github/workflows/issue70_diagnose_copyright_batch063.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue70-copyright-batch063
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/diagnose_copyright_remaining_accepted_batch063.py
      - name: Validate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/copyright_remaining_accepted_batch063_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/copyright_remaining_accepted_batch063_diagnostic.json').read_text(encoding='utf-8'))
          assert d['population']>=1
          assert d['production_modified'] is False
          print({k:d[k] for k in ['population','duplicate_rows','exact_preserved_ja_rows']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/issue70/audit/copyright_remaining_accepted_batch063_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist final Accepted Copyright diagnostic batch 063'
          git push origin HEAD:audit/issue70-semantic-final
