name: Issue70 Semantic Risk Census

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/audit_semantic_risk.py
      - docs/issue70/SEMANTIC_FINAL_AUDIT.md
      - .github/workflows/issue70_semantic_risk_census.yml
      - docs/issue70/data/runtime/issue70_translation_results.csv
      - docs/issue70/data/source/issue70_translation_source_with_relations.csv
  pull_request:
    branches: [main]
    paths:
      - scripts/issue70/audit_semantic_risk.py
      - docs/issue70/SEMANTIC_FINAL_AUDIT.md
      - .github/workflows/issue70_semantic_risk_census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile scanner
        run: python -m py_compile scripts/issue70/audit_semantic_risk.py

      - name: Run read-only risk census
        run: |
          python scripts/issue70/audit_semantic_risk.py \
            --out artifacts/issue70-semantic-audit \
            --sample-per-category 300

      - name: Validate census outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/issue70-semantic-audit/risk_summary.json
          test -s artifacts/issue70-semantic-audit/review_required.csv
          test -s artifacts/issue70-semantic-audit/accepted_risk.csv
          test -s artifacts/issue70-semantic-audit/accepted_clean_sample.csv
          test -s artifacts/issue70-semantic-audit/audit_ledger_template.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/issue70-semantic-audit/risk_summary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['totals']['rows_scanned'] == 92739
          assert data['totals']['review_required'] == 13221
          assert data['totals']['accepted_ai'] == 79518
          assert data['production_modified'] is False
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue70-semantic-risk-census
          path: artifacts/issue70-semantic-audit/
          if-no-files-found: error
          retention-days: 14
