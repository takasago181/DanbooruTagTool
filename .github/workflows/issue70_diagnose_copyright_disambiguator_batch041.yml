name: Issue70 Diagnose Copyright Source Disambiguator Batch 041

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/diagnose_copyright_source_disambiguator_batch041.py
      - .github/workflows/issue70_diagnose_copyright_disambiguator_batch041.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/diagnose_copyright_source_disambiguator_batch041.py
      - name: Validate diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/copyright_source_disambiguator_batch041_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/copyright_source_disambiguator_batch041_diagnostic.json').read_text(encoding='utf-8'))
          assert d['production_modified'] is False
          assert d['candidate_rows'] >= d['safe_unique_rows'] >= 0
          print({k:d[k] for k in ['candidate_rows','safe_unique_rows','ambiguous_candidate_terms']})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          git add docs/issue70/audit/copyright_source_disambiguator_batch041_diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist Copyright source-disambiguator diagnostic batch 041'
          git push origin HEAD:audit/issue70-semantic-final
