name: Issue118 Safe General V6

on:
  push:
    branches:
      - research/issue118-cluster-rules
    paths:
      - scripts/issue118/materialize_safe_general_converged_v6.py
      - .github/workflows/issue118_safe_general_v6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize converged v6
        run: |
          python3 -m py_compile scripts/issue118/materialize_safe_general_converged_v6.py
          python3 scripts/issue118/materialize_safe_general_converged_v6.py
      - name: Validate v6 contract
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('docs/issue118/safe_general_converged_v6')
          s=json.loads((p/'summary_v6.json').read_text(encoding='utf-8'))
          clean=list(csv.DictReader((p/'candidate_inventory_v6.csv').open(encoding='utf-8')))
          excluded=list(csv.DictReader((p/'adversarial_exclusions_v6.csv').open(encoding='utf-8')))
          reintro=list(csv.DictReader((p/'reviewed_safe_reintroduced_v6.csv').open(encoding='utf-8')))
          new_excl=list(csv.DictReader((p/'new_exclusions_vs_v5.csv').open(encoding='utf-8')))
          assert len(clean)+len(excluded)==10258
          assert len(clean)==s['clean_candidate_rows_v6']
          assert len(excluded)==s['excluded_rows_v6']
          assert len(reintro)==14==s['reviewed_safe_reintroduced_rows']
          assert len(new_excl)==s['newly_excluded_vs_v5_rows']
          assert s['new_unreviewed_reintroductions']==0
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_SAFE_GENERAL_V6_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/safe_general_converged_v6
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize converged safe General v6'
            git push origin HEAD:research/issue118-cluster-rules
          fi
