name: issue70-chunk141-148-auditprep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk141_148_auditprep.yml'
permissions:
  contents: read
jobs:
  auditprep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Japanese candidates for 4000 rows
        shell: python
        run: |
          import csv, re
          from pathlib import Path
          files=[
            Path('docs/issue70/data/source_chunks/source_070001_070500.csv'),
            Path('docs/issue70/data/source_chunks/source_070501_071000.csv'),
            Path('docs/issue70/data/source_chunks/source_071001_071500.csv'),
            Path('docs/issue70/data/source_chunks/source_071501_072000.csv'),
            Path('docs/issue70/data/source_chunks/source_072001_072500.csv'),
            Path('docs/issue70/data/source_chunks/source_072501_073000.csv'),
            Path('docs/issue70/data/source_chunks/source_073001_073500.csv'),
            Path('docs/issue70/data/source_chunks/source_073501_074000.csv'),
          ]
          outputs=[
            Path('docs/issue70/data/results/queue/queue_chunk141_I70-070001_I70-070500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk142_I70-070501_I70-071000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk143_I70-071001_I70-071500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk144_I70-071501_I70-072000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk145_I70-072001_I70-072500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk146_I70-072501_I70-073000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk147_I70-073001_I70-073500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk148_I70-073501_I70-074000.csv'),
          ]
          assert not any(p.exists() for p in outputs), 'one or more target queue files already exist'
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          kanji=re.compile(r'[\u3400-\u9fff]')
          nameish=re.compile(r"^[a-z][a-z0-9']+_[a-z][a-z0-9']+$")
          rows_all=[]; candidates=[]
          for p in files:
            with p.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            rows_all.extend(rows)
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): candidates.append(r)
          assert len(rows_all)==4000
          print('TOTAL_ROWS',len(rows_all))
          print('JP_CANDIDATE_COUNT',len(candidates))
          promising=[]
          for r in candidates:
            tag=r['canonical_tag']; c=r['existing_candidate_ja'].strip(); aliases=r['verified_aliases'].strip()
            ascii_letters=sum(ch.isascii() and ch.isalpha() for ch in c)
            jp_chars=sum(bool(jp.match(ch)) for ch in c)
            strong_jp=(jp_chars>=2 and ascii_letters<=2)
            if nameish.match(tag) or aliases or (strong_jp and kanji.search(c)):
              promising.append((r['row_id'],tag,aliases,c))
          print('PROMISING_COUNT',len(promising))
          for row in promising:
            print('CAND\t'+'\t'.join(row))
