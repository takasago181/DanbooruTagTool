name: Issue118 Clothing Adversarial V12.2

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_clothing_adversarial_v12_2.py
      - docs/issue118/clothing_everyday_refinement_v12_1/clothing_clean_v12_1.csv
      - .github/workflows/issue118_clothing_adversarial_v12_2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v12-2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize clothing adversarial v12.2
        run: |
          python3 -m py_compile scripts/issue118/materialize_clothing_adversarial_v12_2.py
          python3 scripts/issue118/materialize_clothing_adversarial_v12_2.py
      - name: Validate v12.2
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          p = Path('docs/issue118/clothing_adversarial_v12_2')
          s = json.loads((p / 'summary_v12_2.json').read_text(encoding='utf-8'))
          flagged = list(csv.DictReader((p / 'redteam_review_v12_2.csv').open(encoding='utf-8')))
          clean = list(csv.DictReader((p / 'clothing_clean_v12_2.csv').open(encoding='utf-8')))
          holdout = list(csv.DictReader((p / 'fresh_holdout_template_v12_2.csv').open(encoding='utf-8')))

          assert s['source_clean_rows_v12_1'] == 2704
          assert len(flagged) == s['redteam_review_rows']
          assert len(clean) == s['clean_candidate_rows_v12_2']
          assert len(flagged) + len(clean) == 2704
          assert len(holdout) == 120
          assert all(not r['human_intent'] for r in holdout)
          assert s['risk_rules_use'] == 'DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['holdout_verdicts_generated'] == 'NO'
          assert s['semantic_authority'] == 'NO'
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_CLOTHING_ADVERSARIAL_V12_2_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/clothing_adversarial_v12_2
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize clothing adversarial v12.2'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
