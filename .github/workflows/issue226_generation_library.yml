name: Issue226 Generation Library

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/issue226/**'
      - 'scripts/maintenance/check_runtime_shape.ps1'
      - 'scripts/maintenance/test_runtime_pipeline.ps1'
      - '.github/workflows/issue226_generation_library.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/issue226/**'
      - 'scripts/maintenance/check_runtime_shape.ps1'
      - 'scripts/maintenance/test_runtime_pipeline.ps1'
      - '.github/workflows/issue226_generation_library.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue226-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-library:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Full Release regression including library fixtures
        shell: pwsh
        env:
          DTT_LIBRARY_PERF_OUTPUT: ${{ runner.temp }}/issue226-performance.json
        run: dotnet test src/DanbooruTagTool.Tests/DanbooruTagTool.Tests.csproj -c Release --logger "trx;LogFileName=library-full-release.trx" --results-directory "${{ runner.temp }}/issue226-tests"
      - name: Portable shape and UserData protection contracts
        shell: pwsh
        run: ./scripts/maintenance/test_runtime_pipeline.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue226-library-regression
          path: |
            ${{ runner.temp }}/issue226-tests
            ${{ runner.temp }}/issue226-performance.json
          retention-days: 14
