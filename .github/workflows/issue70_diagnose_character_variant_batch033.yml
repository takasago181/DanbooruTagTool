name: Issue70 Diagnose Remaining Character Variant Batch 033

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - scripts/issue70/diagnose_remaining_character_variant_batch033.py
      - .github/workflows/issue70_diagnose_character_variant_batch033.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/issue70/diagnose_remaining_character_variant_batch033.py
      - name: Validate diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/issue70/audit/character_remaining_variant_batch033_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/issue70/audit/character_remaining_variant_batch033_diagnostic.json').read_text(encoding='utf-8'))
          assert d['population']==1199
          assert d['production_modified'] is False
          assert sum(g['count'] for g in d['groups'])==1199
          print([(g['reason'],g['count']) for g in d['groups']])
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          git add docs/issue70/audit/character_remaining_variant_batch033_diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: persist remaining variant diagnostic batch 033'
          git push origin HEAD:audit/issue70-semantic-final
