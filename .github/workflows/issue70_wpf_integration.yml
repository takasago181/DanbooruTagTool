name: issue70-catalog-roundtrip-final-check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_wpf_integration.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Add catalog.db roundtrip regression
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/DanbooruTagTool.Tests/Issue70IntegrationTests.cs')
          s=p.read_text(encoding='utf-8-sig')
          anchor='''    private static string FindRepoRoot()\n    {'''
          test='''    [Fact]\n    public void CatalogDatabaseRoundTripPreservesIssue70CategoryRelationsAndSearchMetadata()\n    {\n        using var temp = new TempDirectory();\n        var path = Path.Combine(temp.Path, "catalog.db");\n        var character = new CatalogEntry("C:hatsune_miku", "hatsune_miku", "hatsune_miku", "初音ミク", false, 145166, ["miku"], ["ミク"], [])\n        { TagCategory = "Character", RelatedCopyright = ["vocaloid"] };\n        var copyright = new CatalogEntry("R:vocaloid", "vocaloid", "vocaloid", "VOCALOID", false, 200000, [], ["ボーカロイド"], [])\n        { TagCategory = "Copyright" };\n        var artist = new CatalogEntry("A:nagano_mamoru", "nagano_mamoru", "nagano_mamoru", "永野護", false, 1000, ["mamoru nagano"], ["ながのまもる"], [])\n        { TagCategory = "Artist" };\n\n        CatalogDatabase.Build(path, [character, copyright, artist], "issue70-roundtrip-test");\n        var reopened = CatalogDatabase.Open(path);\n\n        var miku = reopened.Entries.Single(e => e.Canonical == "hatsune_miku");\n        Assert.Equal("Character", miku.EffectiveCategory);\n        Assert.Equal(["vocaloid"], miku.RelatedCopyright);\n        Assert.Contains("miku", miku.Aliases);\n        Assert.Contains("ミク", miku.JapaneseSearch);\n        Assert.Equal("Copyright", reopened.Entries.Single(e => e.Canonical == "vocaloid").EffectiveCategory);\n        Assert.Equal("Artist", reopened.Entries.Single(e => e.Canonical == "nagano_mamoru").EffectiveCategory);\n\n        var search = new SearchEngine(reopened);\n        Assert.Contains(search.Search("ミク"), hit => hit.Entry.Canonical == "hatsune_miku");\n        Assert.Contains(search.Search("miku"), hit => hit.Entry.Canonical == "hatsune_miku");\n        Assert.Contains(search.Search("ながのまもる"), hit => hit.Entry.Canonical == "nagano_mamoru");\n    }\n\n'''
          assert anchor in s
          assert 'CatalogDatabaseRoundTripPreservesIssue70CategoryRelationsAndSearchMetadata' not in s
          p.write_text(s.replace(anchor,test+anchor,1),encoding='utf-8',newline='\n')
      - name: Test Release
        shell: pwsh
        run: dotnet test src/DanbooruTagTool.sln -c Release --nologo
      - name: Diff check and commit regression
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DanbooruTagTool.Tests/Issue70IntegrationTests.cs
          git commit -m 'issue70: cover catalog db roundtrip for overlay metadata'
          git push origin HEAD:main
