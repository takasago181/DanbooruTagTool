name: issue70-wpf-integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_wpf_integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pin Issue 70 deterministic runtime bytes
        shell: python
        run: |
          from pathlib import Path
          g=Path('.gitattributes')
          s=g.read_text(encoding='utf-8')
          block='\n# Issue #70 consolidated runtime pack is byte-hashed by the WPF importer.\ndocs/issue70/data/runtime/*.csv text eol=lf\ndocs/issue70/data/runtime/*.json text eol=lf\ndocs/issue70/data/queue_state.json text eol=lf\n'
          if 'docs/issue70/data/runtime/*.csv text eol=lf' not in s:
              g.write_text(s.rstrip()+block,encoding='utf-8',newline='\n')
          p=Path('docs/issue70/data/runtime/issue70_catalog_overlay.csv')
          text=p.read_text(encoding='utf-8-sig')
          p.write_text(text,encoding='utf-8-sig',newline='\n')
      - name: Fix temporary integration test imports
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/issue70/apply_wpf_integration.py')
          s=p.read_text(encoding='utf-8')
          old="tests='''using DanbooruTagTool.App.ViewModels;"
          new="tests='''using System.IO;\nusing DanbooruTagTool.App.ViewModels;"
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Apply Issue 70 WPF integration patch
        shell: pwsh
        run: python scripts/issue70/apply_wpf_integration.py
      - name: Test Release
        shell: pwsh
        run: dotnet test src/DanbooruTagTool.sln -c Release --nologo
      - name: Diff check and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes src/DanbooruTagTool.Core/Catalog.cs src/DanbooruTagTool.Data/Storage.cs src/DanbooruTagTool.Data/AcceptedAssetImporter.cs src/DanbooruTagTool.Data/Issue70CatalogOverlayImporter.cs src/DanbooruTagTool.App/App.xaml.cs src/DanbooruTagTool.App/ViewModels/MainViewModel.cs src/DanbooruTagTool.Tests/ProductionTests.cs src/DanbooruTagTool.Tests/Issue70IntegrationTests.cs
          git commit -m 'issue70: integrate Character Copyright Artist into WPF catalog'
          git push origin HEAD:main
