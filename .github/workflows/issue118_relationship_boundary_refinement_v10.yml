name: Issue118 Relationship Boundary Refinement V10

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_relationship_boundary_refinement_v10.py
      - .github/workflows/issue118_relationship_boundary_refinement_v10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v10 refinement
        run: |
          python3 -m py_compile scripts/issue118/materialize_relationship_boundary_refinement_v10.py
          python3 scripts/issue118/materialize_relationship_boundary_refinement_v10.py
      - name: Validate v10
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          p = Path('docs/issue118/relationship_boundary_refinement_v10')
          s = json.loads((p / 'summary_v10.json').read_text(encoding='utf-8'))
          flagged = list(csv.DictReader((p / 'relationship_boundary_review_v10.csv').open(encoding='utf-8')))
          clean = list(csv.DictReader((p / 'clean_candidate_inventory_v10.csv').open(encoding='utf-8')))
          holdout = list(csv.DictReader((p / 'fresh_holdout_template_v10.csv').open(encoding='utf-8')))

          assert s['source_v9_clean_rows'] == 1711
          assert len(flagged) == s['relationship_boundary_review_rows']
          assert len(clean) == s['clean_candidate_rows_v10']
          assert len(flagged) + len(clean) == 1711
          assert len(holdout) == 120
          assert {'brocon', 'top/bottom_dynamic_annotated'} <= {r['identity_key'] for r in flagged}
          assert all(not r['human_intent'] for r in holdout)
          assert s['boundary_rules_use'] == 'DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['holdout_verdicts_generated'] == 'NO'
          assert s['semantic_authority'] == 'NO'
          assert s['auto_promotion_performed'] == 'NO'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RELATIONSHIP_BOUNDARY_REFINEMENT_V10_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/relationship_boundary_refinement_v10
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize relationship boundary refinement v10'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
