name: Issue70 Recurate Chunk 90 One Shot
on:
  push:
    paths: ['.github/workflows/issue70_recurate_chunk090.yml']
permissions:
  contents: write
jobs:
  recurate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-curate chunk 90 artist identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, sys
          from pathlib import Path
          ROOT=Path('.')
          path=ROOT/'docs/issue70/data/results/queue/queue_chunk090_I70-044501_I70-045000.csv'
          fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          known={
          'I70-044504':'アボガド6','I70-044516':'和泉つばす','I70-044523':'つなこ','I70-044529':'武内崇','I70-044538':'ねことうふ','I70-044539':'おにぎりくん','I70-044541':'遠坂あさぎ','I70-044542':'さより（NEKO WORKs）','I70-044546':'山本崇一朗','I70-044559':'藤真拓哉','I70-044560':'トモセシュンサク','I70-044567':'まったくモー助','I70-044577':'もちオーレ','I70-044586':'こるり','I70-044600':'島田フミカネ','I70-044603':'石恵','I70-044604':'ぴろ水','I70-044614':'しろまんた','I70-044625':'Ilya Kuvshinov','I70-044627':'村上水軍','I70-044633':'朝凪','I70-044643':'佐藤空気','I70-044673':'アルデヒド','I70-044687':'いとうのいぢ','I70-044693':'三嶋くろね','I70-044696':'鈴平ひろ','I70-044702':'八宝備仁','I70-044721':'比村奇石','I70-044723':'渡辺明夫','I70-044732':'よむ','I70-044766':'矢吹健太朗','I70-044773':'深崎暮人','I70-044792':'原田たけひと','I70-044796':'岸田メル','I70-044800':'山下しゅんや','I70-044807':'みけおう','I70-044854':'大槍葦人','I70-044860':'うるし原智志','I70-044863':'りいちゅ','I70-044871':'モタ','I70-044884':'藤ちょこ','I70-044899':'はいむらきよたか','I70-044921':'Mika Pikazo','I70-044936':'モグダン','I70-044964':'桜沢いづみ','I70-044978':'オミナエシ','I70-044991':'七尾奈留','I70-045000':'しらび'
          }
          with path.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          if len(rows)!=500: raise SystemExit(f'expected 500 rows, found {len(rows)}')
          if {r['category'] for r in rows}!={'1'}: raise SystemExit('chunk 90 expected all category 1 artist rows')
          ids={r['row_id'] for r in rows}
          if set(known)-ids: raise SystemExit('known artist row-id mismatch')
          corrected=0
          for row in rows:
              old=row['display_ja']
              rid=row['row_id']
              # Artist/user handles are identities, not ordinary words: never machine-translate them.
              row['display_ja']=known.get(rid,row['canonical_tag'].replace('_',' '))
              if row['display_ja']!=old: corrected+=1
              row['translation_status']='ACCEPTED_AI'
              row['translation_note']='semantic re-curation: artist identity normalized; known Japanese credit used when clear, otherwise canonical handle preserved without machine translation'
          with path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          sys.path.insert(0,str(ROOT)); from scripts.issue70.publish_local_batch import validate_result
          entry,validated_rows=validate_result(ROOT,path)
          if int(entry['chunk_index'])!=90 or len(validated_rows)!=500: raise SystemExit('validator mismatch')
          print({'counts':{'ACCEPTED_AI':500,'REVIEW_REQUIRED':0},'corrected_display':corrected})
          PY
      - name: Commit re-curated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk090_I70-044501_I70-045000.csv
          git commit -m 'Issue70: semantically re-curate chunk 90 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
