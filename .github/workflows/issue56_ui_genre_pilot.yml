name: Issue56 UI Genre Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - dev/issue56-special-dict-ui-taxonomy
    paths:
      - tools/issue56_ui_genre_pilot_selector.py
      - tests/test_issue56_ui_genre_pilot_selector.py
      - data/special2788/prompt_reference/**
      - docs/issue56/pilot/issue56_ui_genre_taxonomy_candidate_v1_2.json
      - docs/issue56/pilot/issue56_ui_genre_pilot_v1_classification_map.csv
      - docs/issue56/pilot/ISSUE56_UI_GENRE_PILOT_REVIEW_v1.md
      - .github/workflows/issue56_ui_genre_pilot.yml

permissions:
  contents: read

jobs:
  verify-and-build-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Issue56 selector tests
        run: python -m pytest -q tests/test_issue56_ui_genre_pilot_selector.py

      - name: Build reproducible pilot
        run: python tools/issue56_ui_genre_pilot_selector.py

      - name: Show pilot metadata
        run: cat docs/issue56/pilot/issue56_ui_genre_pilot_v1.meta.json

      - name: Upload pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issue56-ui-genre-pilot
          path: docs/issue56/pilot/
          if-no-files-found: error
          retention-days: 14
