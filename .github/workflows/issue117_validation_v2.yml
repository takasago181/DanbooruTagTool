name: issue117 validation v2

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "docs/issue118/production_candidate/**"
      - ".github/workflows/issue117_validation_v2.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/DanbooruTagTool.sln
      - name: Release build
        run: dotnet build src/DanbooruTagTool.sln -c Release --no-restore
      - name: Full tests
        run: dotnet test src/DanbooruTagTool.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Focused Issue 117 tests
        run: dotnet test src/DanbooruTagTool.Tests/DanbooruTagTool.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Issue117UnifiedBrowseTests" --logger "console;verbosity=normal"
      - name: Diff check
        shell: bash
        run: git diff --check origin/main...HEAD
