name: Issue118 Research Sidecar V5

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v5.py
      - docs/issue118/research_sidecar_v4.csv
      - docs/issue118/clothing_refinement_v12_7/clothing_clean_v12_7.csv
      - docs/issue118/clothing_refinement_v12_7/holdout_gate_v12_7.json
      - docs/issue118/clothing_adversarial_v12_2/redteam_review_decisions_v12_2.json
      - .github/workflows/issue118_research_sidecar_v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-sidecar-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v5
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v5.py
          python3 scripts/issue118/materialize_research_sidecar_v5.py
      - name: Validate sidecar v5
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          s = json.loads(Path('docs/issue118/research_sidecar_summary_v5.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader(Path('docs/issue118/research_sidecar_v5.csv').open(encoding='utf-8')))
          assert len(rows) == 31752
          assert s['new_clothing_auto_promotions'] == 2600
          assert s['new_clothing_human_promotions'] == 6
          assert s['remaining_unclassified'] == 11434
          assert s['review_status_counts'] == {
              'AUTO_HIGH_CONF': 19256,
              'HUMAN_REVIEWED': 1062,
              'UNCLASSIFIED': 11434,
          }
          assert s['sexual_intent_counts'] == {
              'CONTEXTUAL': 201,
              'NON_SEXUAL': 19531,
              'NULL': 11434,
              'SEXUAL': 586,
          }
          assert s['review_verdicts_generated_by_materializer'] == 'NO'
          assert s['review_artifacts_are_external_inputs'] == 'YES'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_V5_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v5.csv docs/issue118/research_sidecar_summary_v5.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v5'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
