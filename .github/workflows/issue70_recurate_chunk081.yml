              raise SystemExit(f'expected 500 rows, found {len(rows)}')

          ids = {r['row_id'] for r in rows}
          missing_corrections = set(corrections) - ids
          missing_reviews = explicit_review - ids
          if missing_corrections or missing_reviews:
              raise SystemExit(f'row-id mismatch corrections={sorted(missing_corrections)} reviews={sorted(missing_reviews)}')

          counts = {'ACCEPTED_AI': 0, 'REVIEW_REQUIRED': 0}
          corrected = 0
          promoted = 0
          for row in rows:
              rid = row['row_id']
              old_display = row['display_ja']
              old_status = row['translation_status']
              if rid in explicit_review:
                  row['translation_status'] = 'REVIEW_REQUIRED'
                  row['translation_note'] = 'semantic re-curation: genuinely ambiguous/unresolved; manual verification still required'
              else:
                  if rid in corrections:
                      row['display_ja'] = corrections[rid]
                      if row['display_ja'] != old_display:
                          corrected += 1
                  row['translation_status'] = 'ACCEPTED_AI'
                  row['translation_note'] = 'semantic re-curation: title/name judged usable; official/common rendering preferred over literal candidate'
                  if old_status != 'ACCEPTED_AI':
                      promoted += 1
              counts[row['translation_status']] += 1

