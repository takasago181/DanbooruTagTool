name: Issue118 Research Sidecar V43

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v43.py
      - docs/issue118/research_sidecar_v42.csv
      - docs/issue118/general_body_part_none_review_v68/review_policy_v68.json
      - docs/issue118/general_body_part_none_review_v68/full_review_candidate_v68.csv
      - .github/workflows/issue118_research_sidecar_v43.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v43:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v43
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v43.py
          python3 scripts/issue118/materialize_research_sidecar_v43.py
      - name: Validate v43
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v43.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v43.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==41
          assert s['new_promotions']=={'CONTEXTUAL':6,'NON_SEXUAL':35}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':4555,'UNCLASSIFIED':4826}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1228,'NON_SEXUAL':23997,'NULL':4826,'SEXUAL':1701}
          assert s['remaining_unclassified']==4826
          assert s['body_cluster_intentionally_retained_unclassified']==['knee_boobs','powerful_ass']
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V43_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v43.csv docs/issue118/research_sidecar_summary_v43.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v43'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
