name: Issue179 Character Audit Snapshot

on:
  push:
    branches:
      - research/issue179-character-quality-audit

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Character runtime population
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, math, re, hashlib
          from pathlib import Path
          from collections import Counter

          overlay = Path("docs/issue70/data/runtime/issue70_catalog_overlay_2d_final.csv")
          expected = "bf366734b41b2be9e6cb52de919ef55b7312445e1715f96a357db37abda8dad5"
          digest = hashlib.sha256(overlay.read_bytes()).hexdigest()
          assert digest == expected, (digest, expected)

          with overlay.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          chars = [r for r in rows if r["category_name"] == "Character"]
          assert len(chars) == 35278

          def percentile(values, q):
              values = sorted(values)
              pos = (len(values)-1)*q
              lo, hi = math.floor(pos), math.ceil(pos)
              if lo == hi: return values[lo]
              return round(values[lo]*(hi-pos)+values[hi]*(pos-lo), 2)

          counts = [int(r["post_count"]) for r in chars]
          cross = Counter((r["translation_status"], "ASCII" if r["display_ja"].isascii() else "NON_ASCII") for r in chars)
          summary = {
              "character_count": len(chars),
              "translation_status": dict(Counter(r["translation_status"] for r in chars)),
              "status_x_display_script": {"|".join(k): v for k,v in sorted(cross.items())},
              "post_count_quantiles": {str(q): percentile(counts, q) for q in [0, .01, .1, .25, .5, .75, .9, .99, 1]},
              "qualified_suffix_count": sum(bool(re.search(r"_\([^()]+\)$", r["canonical_tag"])) for r in chars),
              "aliases_nonempty": sum(bool(r["aliases"].strip()) for r in chars),
              "search_ja_nonempty": sum(bool(r["search_ja"].strip()) for r in chars),
              "related_copyright_nonempty": sum(bool(r["related_copyright"].strip()) for r in chars),
              "display_contains_underscore": sum("_" in r["display_ja"] for r in chars),
              "display_ascii_only": sum(r["display_ja"].isascii() for r in chars),
          }

          fields = ["row_id","canonical_tag","post_count","display_ja","search_ja","aliases","translation_status"]
          top_review = sorted(
              (r for r in chars if r["translation_status"] == "REVIEW_REQUIRED"),
              key=lambda r: (-int(r["post_count"]), r["canonical_tag"])
          )[:20]
          accepted_ascii = sorted(
              (r for r in chars if r["translation_status"] == "ACCEPTED_AI" and r["display_ja"].isascii()),
              key=lambda r: (-int(r["post_count"]), r["canonical_tag"])
          )[:20]

          fixes = Path("docs/issue70/finalization/FINAL_SEMANTIC_FIXES.csv")
          with fixes.open("r", encoding="utf-8-sig", newline="") as f:
              fix_rows = list(csv.DictReader(f))
          char_fixes = [r for r in fix_rows if r.get("category") == "Character"]
          action_counts = Counter(r["effective_action"] for r in char_fixes)
          reason_counts = Counter(r["reason_code"] for r in char_fixes)

          known = {
              "dawn_(pokemon)", "pikachu", "hatsune_miku", "gotoh_hitori",
              "ikazuchi_(kancolle)", "inazuma_(kancolle)", "shirakami_fubuki", "kirby"
          }
          known_fixes = [r for r in char_fixes if r["canonical_tag"] in known]

          print("ISSUE179_DETAIL_BEGIN")
          print(json.dumps({
              "summary": summary,
              "top_review_required": [{k:r[k] for k in fields} for r in top_review],
              "top_accepted_ascii": [{k:r[k] for k in fields} for r in accepted_ascii],
              "character_semantic_fix_rows": len(char_fixes),
              "character_semantic_fix_actions": dict(action_counts),
              "character_semantic_fix_top_reasons": reason_counts.most_common(20),
              "known_case_semantic_fixes": known_fixes,
          }, ensure_ascii=False, indent=2))
          print("ISSUE179_DETAIL_END")
          PY
