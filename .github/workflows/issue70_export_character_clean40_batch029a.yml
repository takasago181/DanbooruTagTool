name: Issue70 Export Character Clean 40 Batch 029A

on:
  push:
    branches:
      - audit/issue70-semantic-final
    paths:
      - .github/workflows/issue70_export_character_clean40_batch029a.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/issue70-semantic-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export clean accepted sample rows
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=Path('docs/issue70/audit/character_remaining_accepted_batch029_diagnostic.csv')
          out=Path('docs/issue70/audit/character_accepted_clean40_batch029a_diagnostic.csv')
          with src.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          rows=[r for r in rows if r['audit_bucket']=='ACCEPTED_CLEAN_SAMPLE' and not r['risk_flags'].strip() and not r['translation_note'].strip()]
          assert len(rows)==40, len(rows)
          with out.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          print({'rows':len(rows),'production_modified':False})
          PY
          git diff --exit-code -- docs/issue70/data/runtime docs/issue70/data/source
      - name: Commit diagnostic only
        shell: bash
        run: |
          git add docs/issue70/audit/character_accepted_clean40_batch029a_diagnostic.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Issue70: export Character clean40 diagnostic batch 029A'
          git push origin HEAD:audit/issue70-semantic-final
