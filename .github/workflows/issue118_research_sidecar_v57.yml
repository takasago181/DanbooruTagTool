name: Issue118 Research Sidecar V57
on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v57.py
      - docs/issue118/research_sidecar_v56.csv
      - docs/issue118/general_action_interaction_none_review_v82/review_policy_v82.json
      - docs/issue118/general_action_interaction_none_review_v82/full_review_candidate_v82.csv
      - .github/workflows/issue118_research_sidecar_v57.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-sidecar-v57:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v57
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v57.py
          python3 scripts/issue118/materialize_research_sidecar_v57.py
      - name: Validate v57
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v57.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v57.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==95
          assert s['new_promotions']=={'CONTEXTUAL':18,'NON_SEXUAL':72,'SEXUAL':5}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':5775,'UNCLASSIFIED':3606}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1528,'NON_SEXUAL':24904,'NULL':3606,'SEXUAL':1714}
          assert s['remaining_unclassified']==3606
          assert s['completed_cluster']=='GENERAL_ONLY|ACTION_CONTACT/INTERACTION|NONE'
          assert s['completed_cluster_rows']==795
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V57_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v57.csv docs/issue118/research_sidecar_summary_v57.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v57'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
