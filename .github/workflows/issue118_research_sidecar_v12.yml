name: Issue118 Research Sidecar V12

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v12.py
      - docs/issue118/pathless_structural_safe_v24/review_gate_v24.json
      - docs/issue118/pathless_structural_safe_v24/fresh_holdout_template_v24.csv
      - docs/issue118/research_sidecar_v11.csv
      - .github/workflows/issue118_research_sidecar_v12.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v12
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v12.py
          python3 scripts/issue118/materialize_research_sidecar_v12.py
      - name: Validate v12
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          side = list(csv.DictReader(Path('docs/issue118/research_sidecar_v12.csv').open(encoding='utf-8')))
          s = json.loads(Path('docs/issue118/research_sidecar_summary_v12.json').read_text(encoding='utf-8'))
          assert len(side) == 31752
          assert s['new_pathless_structural_human_nonsexual_promotions'] == 83
          assert s['remaining_unclassified'] == 7826
          assert s['review_verdicts_generated_by_materializer'] == 'NO'
          assert s['review_artifacts_are_external_inputs'] == 'YES'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_V12_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v12.csv docs/issue118/research_sidecar_summary_v12.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v12'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
