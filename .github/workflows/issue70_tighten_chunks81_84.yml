name: Issue70 Tighten Chunks 81-84 One Shot

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/issue70_tighten_chunks81_84.yml'

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten candidate-only acceptance for chunks 81-84
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, json, re, sys
          from pathlib import Path

          ROOT = Path('.')
          manifest = json.loads((ROOT / 'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          by_index = {int(x['chunk_index']): x for x in manifest['chunks']}
          HIRA_KATA = re.compile(r'[\u3040-\u30ff\uff65-\uff9f]')
          NOISY = ('腐','イラコン','ファンアート','fanart','周年','記念','人物名鑑','衣装','コンテスト','企画','タグ','生誕','誕生祭','腐向け','R-18','R18','カードイラスト')
          FIELDS = ['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']

          def split_terms(value: str):
              return [x.strip() for x in value.split(' | ') if x.strip()] if value else []

          def norm(s: str):
              return re.sub(r'\s+', ' ', s.strip().replace('_', ' '))

          def trusted_terms(src):
              out = set()
              for key in ('existing_search_ja','existing_display_ja'):
                  for raw in split_terms(src.get(key,'')):
                      s = norm(raw)
                      if s and HIRA_KATA.search(s) and not any(m.lower() in s.lower() for m in NOISY):
                          out.add(s)
              return out

          manual = {
              'armored_core_v': ('アーマード・コア V','ACCEPTED_AI','known official/common Japanese rendering; corrected from unverified literal candidate'),
          }

          changed = 0
          demoted = 0
          manual_fixed = 0
          totals = {'ACCEPTED_AI': 0, 'REVIEW_REQUIRED': 0}
          per_chunk = {}

          for idx in range(81,85):
              entry = by_index[idx]
              src_path = ROOT / entry['file']
              out_path = ROOT / 'docs/issue70/data/results/queue' / f"queue_chunk{idx:03d}_{entry['first_row_id']}_{entry['last_row_id']}.csv"
              with src_path.open(encoding='utf-8-sig', newline='') as f:
                  src_rows = list(csv.DictReader(f))
              with out_path.open(encoding='utf-8-sig', newline='') as f:
                  out_rows = list(csv.DictReader(f))
              if len(src_rows) != len(out_rows):
                  raise SystemExit(f'chunk {idx}: row count mismatch')
              counts = {'ACCEPTED_AI': 0, 'REVIEW_REQUIRED': 0}
              for src, out in zip(src_rows, out_rows):
                  if (src['row_id'],src['canonical_tag'],src['category']) != (out['row_id'],out['canonical_tag'],out['category']):
                      raise SystemExit(f'chunk {idx}: identity mismatch at {src["row_id"]}')
                  if out['canonical_tag'] in manual:
                      display,status,note = manual[out['canonical_tag']]
                      if (out['display_ja'],out['translation_status'],out['translation_note']) != (display,status,note):
                          out['display_ja'] = display
                          out['translation_status'] = status
                          out['translation_note'] = note
                          changed += 1
                          manual_fixed += 1
                  elif out['translation_status'] == 'ACCEPTED_AI' and norm(out['display_ja']) not in trusted_terms(src):
                      out['translation_status'] = 'REVIEW_REQUIRED'
                      out['translation_note'] = 'candidate-only Japanese evidence is unverified; manual verification required'
                      changed += 1
                      demoted += 1
                  counts[out['translation_status']] += 1
                  totals[out['translation_status']] += 1
              with out_path.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=FIELDS, lineterminator='\n')
                  w.writeheader(); w.writerows(out_rows)
              per_chunk[idx] = counts

          sys.path.insert(0, str(ROOT))
          from scripts.issue70.publish_local_batch import validate_result
          for idx in range(81,85):
              entry = by_index[idx]
              out_path = ROOT / 'docs/issue70/data/results/queue' / f"queue_chunk{idx:03d}_{entry['first_row_id']}_{entry['last_row_id']}.csv"
              validated_entry, validated_rows = validate_result(ROOT, out_path)
              if int(validated_entry['chunk_index']) != idx or len(validated_rows) != entry['row_count']:
                  raise SystemExit(f'chunk {idx}: validator mismatch')

          print(json.dumps({'changed':changed,'demoted_candidate_only':demoted,'manual_fixed':manual_fixed,'per_chunk':per_chunk,'total':totals}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Commit tightened results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk081_I70-040001_I70-040500.csv
          git add docs/issue70/data/results/queue/queue_chunk082_I70-040501_I70-041000.csv
          git add docs/issue70/data/results/queue/queue_chunk083_I70-041001_I70-041500.csv
          git add docs/issue70/data/results/queue/queue_chunk084_I70-041501_I70-042000.csv
          git commit -m 'Issue70: tighten chunks 81-84 candidate-only acceptance [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
