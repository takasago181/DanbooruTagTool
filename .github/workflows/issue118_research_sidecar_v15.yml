name: Issue118 Research Sidecar V15

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v15.py
      - docs/issue118/object_prop_low_risk_v26/review_policy_v26.json
      - docs/issue118/object_prop_low_risk_v26/boundary_review_policy_v26.json
      - docs/issue118/research_sidecar_v14.csv
      - .github/workflows/issue118_research_sidecar_v15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v15
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v15.py
          python3 scripts/issue118/materialize_research_sidecar_v15.py
      - name: Validate v15
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          side = list(csv.DictReader(Path('docs/issue118/research_sidecar_v15.csv').open(encoding='utf-8')))
          s = json.loads(Path('docs/issue118/research_sidecar_summary_v15.json').read_text(encoding='utf-8'))
          assert len(side) == 31752
          assert s['new_promotions'] == {'CONTEXTUAL': 8, 'NON_SEXUAL': 143, 'SEXUAL': 8}
          assert s['new_total_promotions'] == 159
          assert s['kept_unclassified'] == 2
          assert s['remaining_unclassified'] == 7646
          assert s['review_verdicts_generated_by_materializer'] == 'NO'
          assert s['review_artifacts_are_external_inputs'] == 'YES'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_V15_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v15.csv docs/issue118/research_sidecar_summary_v15.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v15'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
