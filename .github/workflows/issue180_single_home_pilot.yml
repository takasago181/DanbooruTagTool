name: Issue180 Character HOME v3

on:
  push:
    branches:
      - research/issue180-single-home-pilot
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue180-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Issue180 research-only scope
        run: python scripts/issue180/validate_research_scope_v2.py
      - name: Run Issue180 v3 tests
        run: python -m unittest discover -s tests/issue180 -v
      - name: Build, resolve, validate, and reproduce Issue180 v3
        run: python scripts/issue180/run_issue180_v3.py
      - name: Validate Issue179 handoff freshness
        run: python scripts/issue180/validate_issue179_origin_handoff_v1.py
      - name: Verify protected sources are unchanged
        shell: bash
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/issue70/data/runtime/issue70_translation_results.csv \
            docs/issue70/data/runtime/issue70_catalog_overlay.csv \
            src tools/production data/production
