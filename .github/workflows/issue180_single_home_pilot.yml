name: Issue180 Single Home Pilot

on:
  push:
    branches:
      - research/issue180-single-home-pilot
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-home pilot
        run: python scripts/issue180/build_single_home_pilot.py
      - name: Prepare diverse 250-character pilot
        run: python scripts/issue180/prepare_diverse_pilot.py
      - name: Validate HOME authority policy
        run: python scripts/issue180/validate_authority_policy.py
      - name: Classify 250 pilot authority candidates
        run: python scripts/issue180/build_authority_candidates.py
      - name: Build full Character qualifier preflight
        run: python scripts/issue180/build_full_character_preflight.py
      - name: Triage unknown qualifiers
        run: python scripts/issue180/triage_unknown_qualifiers.py
      - name: Build root review batch A
        run: python scripts/issue180/build_root_review_batch_a.py
      - name: Prefill root review batch A candidates
        run: python scripts/issue180/prefill_root_review_batch_a.py
      - name: Check root review batch A against Copyright catalog
        run: python scripts/issue180/check_root_review_batch_a_catalog.py
      - name: Gate root review batch A families
        run: python scripts/issue180/gate_root_review_batch_a.py
      - name: Build next 50 root-family review backlog
        run: python scripts/issue180/build_next_root_review_backlog.py
      - name: Check next 50 root families against Copyright catalog
        run: python scripts/issue180/check_next_root_review_catalog.py
      - name: Build unqualified Character authority control sample
        run: python scripts/issue180/build_unqualified_review_sample.py
      - name: Prioritize next 50 root review lanes
        run: python scripts/issue180/prioritize_next_root_review.py
      - name: Analyze unqualified control sample structure
        run: python scripts/issue180/analyze_unqualified_sample_structure.py
      - name: Build Batch A authority worklist
        run: python scripts/issue180/build_batch_a_authority_worklist.py
      - name: Apply Batch A first-party evidence v1
        run: python scripts/issue180/apply_batch_a_authority_evidence_v1.py
      - name: Second review Batch A evidence v1
        run: python scripts/issue180/second_review_batch_a_v1.py
      - name: Isolate remaining Batch A authority research
        run: python scripts/issue180/build_batch_a_remaining_research.py
      - name: Build next P1 exact-root authority batch
        run: python scripts/issue180/build_next_p1_review_batch.py
      - name: Build next P3 semantic research batch
        run: python scripts/issue180/build_next_p3_research_batch.py
      - name: Build unqualified authority worklist
        run: python scripts/issue180/build_unqualified_authority_worklist.py
      - name: Shard P1 authority review
        run: python scripts/issue180/shard_p1_authority_review.py
      - name: Shard P3 semantic research
        run: python scripts/issue180/shard_p3_semantic_research.py
      - name: Shard unqualified controls
        run: python scripts/issue180/shard_unqualified_controls.py
      - name: Double-shard P1 authority review
        run: python scripts/issue180/shard_p1_authority_review_x2.py
      - name: Double-shard P3 semantic research
        run: python scripts/issue180/shard_p3_semantic_research_x2.py
      - name: Double-shard unqualified controls
        run: python scripts/issue180/shard_unqualified_controls_x2.py
      - name: Validate doubled-parallel precision gate
        run: python scripts/issue180/validate_parallel_precision_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: issue180-single-home-pilot
          path: |
            artifacts/issue180-single-home-pilot/
            artifacts/issue180-diverse-pilot/
            artifacts/issue180-full-preflight/
