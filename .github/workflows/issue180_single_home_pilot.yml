name: Issue180 Single Home Pilot

on:
  push:
    branches:
      - research/issue180-single-home-pilot
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-home pilot
        run: python scripts/issue180/build_single_home_pilot.py
      - name: Prepare diverse 250-character pilot
        run: python scripts/issue180/prepare_diverse_pilot.py
      - name: Validate HOME authority policy
        run: python scripts/issue180/validate_authority_policy.py
      - name: Classify 250 pilot authority candidates
        run: python scripts/issue180/build_authority_candidates.py
      - name: Build full Character qualifier preflight
        run: python scripts/issue180/build_full_character_preflight.py
      - name: Triage unknown qualifiers
        run: python scripts/issue180/triage_unknown_qualifiers.py
      - name: Build root review batch A
        run: python scripts/issue180/build_root_review_batch_a.py
      - name: Prefill root review batch A candidates
        run: python scripts/issue180/prefill_root_review_batch_a.py
      - name: Check root review batch A against Copyright catalog
        run: python scripts/issue180/check_root_review_batch_a_catalog.py
      - name: Gate root review batch A families
        run: python scripts/issue180/gate_root_review_batch_a.py
      - name: Build next 50 root-family review backlog
        run: python scripts/issue180/build_next_root_review_backlog.py
      - name: Check next 50 root families against Copyright catalog
        run: python scripts/issue180/check_next_root_review_catalog.py
      - name: Build unqualified Character authority control sample
        run: python scripts/issue180/build_unqualified_review_sample.py
      - name: Prioritize next 50 root review lanes
        run: python scripts/issue180/prioritize_next_root_review.py
      - name: Analyze unqualified control sample structure
        run: python scripts/issue180/analyze_unqualified_sample_structure.py
      - name: Build Batch A authority worklist
        run: python scripts/issue180/build_batch_a_authority_worklist.py
      - name: Apply Batch A first-party evidence v1
        run: python scripts/issue180/apply_batch_a_authority_evidence_v1.py
      - name: Second review Batch A evidence v1
        run: python scripts/issue180/second_review_batch_a_v1.py
      - name: Isolate remaining Batch A authority research
        run: python scripts/issue180/build_batch_a_remaining_research.py
      - name: Apply remaining Batch A evidence v2
        run: python scripts/issue180/apply_batch_a_remaining_evidence_v2.py
      - name: Second review remaining Batch A evidence v2
        run: python scripts/issue180/second_review_batch_a_remaining_v2.py
      - name: Build next P1 exact-root authority batch
        run: python scripts/issue180/build_next_p1_review_batch.py
      - name: Build next P3 semantic research batch
        run: python scripts/issue180/build_next_p3_research_batch.py
      - name: Conservative review P1 exact-root batch
        run: python scripts/issue180/review_p1_conservative_v1.py
      - name: Conservative review P3 semantic batch
        run: python scripts/issue180/review_p3_conservative_v1.py
      - name: Gate P1/P3 candidates against Copyright catalog
        run: python scripts/issue180/gate_p1_p3_catalog_semantics_v1.py
      - name: Audit P1/P3 Japanese display coverage
        run: python scripts/issue180/audit_p1_p3_japanese_display_v1.py
      - name: Audit P1/P3 Japanese display and search coverage v2
        run: python scripts/issue180/audit_p1_p3_japanese_display_v2.py
      - name: Apply P1/P3 first-party authority evidence v1
        run: python scripts/issue180/apply_p1_p3_authority_evidence_v1.py
      - name: Second-review P1/P3 authority evidence
        run: python scripts/issue180/second_review_p1_p3_authority_v1.py
      - name: Build all Character user review export
        run: python scripts/issue180/build_all_character_user_review.py
      - name: Run full Character relation regression gate
        run: python scripts/issue180/full_character_regression_v1.py
      - name: Build unqualified authority worklist
        run: python scripts/issue180/build_unqualified_authority_worklist.py
      - name: Shard P1 authority review
        run: python scripts/issue180/shard_p1_authority_review.py
      - name: Shard P3 semantic research
        run: python scripts/issue180/shard_p3_semantic_research.py
      - name: Shard unqualified controls
        run: python scripts/issue180/shard_unqualified_controls.py
      - name: Double-shard P1 authority review
        run: python scripts/issue180/shard_p1_authority_review_x2.py
      - name: Double-shard P3 semantic research
        run: python scripts/issue180/shard_p3_semantic_research_x2.py
      - name: Double-shard unqualified controls
        run: python scripts/issue180/shard_unqualified_controls_x2.py
      - name: Validate doubled-parallel precision gate
        run: python scripts/issue180/validate_parallel_precision_gate.py
      - name: Build global approved qualifier HOME baseline
        run: python scripts/issue180/build_global_approved_qualifier_home_v1.py
      - name: Build global unresolved authority backlog
        run: python scripts/issue180/build_global_unresolved_backlog_v1.py
      - name: Shard all unresolved families into 96 review units
        run: python scripts/issue180/shard_global_unresolved_families_v1.py
      - name: Generate all 96 authority review packets
        run: python scripts/issue180/build_global_family_review_packets_v1.py
      - name: Build global exact Copyright candidate queue
        run: python scripts/issue180/build_global_exact_copyright_candidates_v1.py
      - name: Second-review global exact Copyright candidates
        run: python scripts/issue180/second_review_global_exact_copyright_v1.py
      - name: Rebuild global approved qualifier HOME with second review
        run: python scripts/issue180/build_global_approved_qualifier_home_v1.py
      - name: Build post-exact global unresolved worklists
        run: python scripts/issue180/build_post_exact_review_worklists_v1.py
      - name: Build remaining normalized Copyright candidates
        run: python scripts/issue180/build_remaining_normalized_candidates_v1.py
      - name: Second-review remaining normalized Copyright candidates
        run: python scripts/issue180/second_review_remaining_normalized_candidates_v1.py
      - name: Rebuild HOME after normalized second review
        run: python scripts/issue180/build_global_approved_qualifier_home_v1.py
      - name: Repartition unresolved after normalized review
        run: python scripts/issue180/build_post_normalized_worklists_v1.py
      - name: Build all unqualified roster candidates
        run: python scripts/issue180/build_unqualified_roster_candidates_v1.py
      - name: Review unqualified exact-overlap candidates
        run: python scripts/issue180/review_unqualified_exact_overlap_v1.py
      - name: Shard unresolved unqualified roster into 128 queues
        run: python scripts/issue180/shard_unqualified_roster_128_v1.py
      - name: Build attribute variant base inheritance candidates
        run: python scripts/issue180/build_attribute_variant_base_inheritance_v1.py
      - name: Apply first-party Splatoon roster authority
        run: python scripts/issue180/apply_splatoon_official_roster_v1.py
      - name: Build mega-batch authority queues
        run: python scripts/issue180/build_megabatch_authority_queues_v1.py
      - name: Build mega-batch authority ledger
        run: python scripts/issue180/build_megabatch_authority_ledger_v1.py
      - name: Build major roster authority expansion
        run: python scripts/issue180/build_major_roster_expansion_v1.py
      - name: Validate major roster expansion
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('artifacts/issue180-full-preflight/MAJOR_ROSTER_EXPANSION_V1.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          by={r['canonical_tag']:r for r in rows}
          expected={'momoi_(blue_archive)':'blue_archive','hakurei_reimu':'touhou','pikachu':'pokemon','shirakami_fubuki':'hololive'}
          assert len(rows)==35890
          for tag,home in expected.items():
            assert tag in by, ('missing_expected_tag',tag)
            assert by[tag]['roster_home']==home,(tag,by[tag])
          assert 'hatsune_miku' in by, 'missing_hatsune_miku'
          assert by['hatsune_miku']['roster_state']=='PIAPRO_OFFICIAL_HOME_POLICY_UNRESOLVED'
          s=json.load(open('artifacts/issue180-full-preflight/major_roster_expansion_v1_summary.json',encoding='utf-8'))
          assert s['multi_home_conflicts']==0 and not s['production_modified']
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue180-single-home-pilot
          path: |
            artifacts/issue180-single-home-pilot/
            artifacts/issue180-diverse-pilot/
            artifacts/issue180-full-preflight/

