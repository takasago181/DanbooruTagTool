name: Issue180 Character HOME v3

on:
  push:
    branches:
      - research/issue180-single-home-pilot
      - research/issue180-qa-integrator
      - "research/issue180-forward-*"
  workflow_dispatch:

concurrency:
  group: issue180-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forward-authority-batch:
    if: startsWith(github.ref_name, 'research/issue180-forward-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Fetch Issue180 canonical research branch
        run: git fetch origin research/issue180-single-home-pilot:refs/remotes/origin/research/issue180-single-home-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Issue180 research-only scope
        run: python scripts/issue180/validate_research_scope_v2.py
      - name: Run v2 lightweight scheduler and dispatch tests
        run: |
          python -m unittest discover -s tests/issue180 -p "test_issue180_parallel_v2.py" -v
          python -m unittest discover -s tests/issue180 -p "test_issue180_dispatch_v2.py" -v
      - name: Verify live canonical lane dispatch exists
        shell: bash
        run: |
          slot="${GITHUB_REF_NAME##*-}"
          git show "origin/research/issue180-single-home-pilot:docs/issue180/parallel/dispatch/fwd-${slot}.csv" >/dev/null
      - name: Validate v2 Forward mailbox scope, lane ownership and batch schema
        run: python scripts/issue180/validate_parallel_worktree_v2.py
      - name: Verify protected sources are unchanged
        shell: bash
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/issue70/data/runtime/issue70_translation_results.csv \
            docs/issue70/data/runtime/issue70_catalog_overlay.csv \
            src tools/production data/production

  full-v3:
    if: github.ref_name == 'research/issue180-single-home-pilot' || github.ref_name == 'research/issue180-qa-integrator'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Fetch Issue180 canonical research branch
        run: git fetch origin research/issue180-single-home-pilot:refs/remotes/origin/research/issue180-single-home-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Issue180 research-only scope
        run: python scripts/issue180/validate_research_scope_v2.py
      - name: Run all Issue180 tests
        run: python -m unittest discover -s tests/issue180 -v
      - name: Build, resolve, validate, and reproduce Issue180 v3
        run: python scripts/issue180/run_issue180_v3.py
      - name: Build v2 reusable-authority campaign queue
        run: python scripts/issue180/build_parallel_campaigns_v2.py
      - name: Validate source-review reuse ledger
        run: python scripts/issue180/validate_source_review_ledger_v2.py
      - name: Validate tracked Codex dispatch freshness
        run: python scripts/issue180/refresh_dispatch_snapshot_v2.py --check-tracked
      - name: Validate v2 branch ownership/write scope
        run: python scripts/issue180/validate_parallel_worktree_v2.py
      - name: Validate Issue179 handoff freshness
        run: python scripts/issue180/validate_issue179_origin_handoff_v1.py
      - name: Verify protected sources are unchanged
        shell: bash
        run: |
          git diff --exit-code origin/main...HEAD -- \
            docs/issue70/data/runtime/issue70_translation_results.csv \
            docs/issue70/data/runtime/issue70_catalog_overlay.csv \
            src tools/production data/production
