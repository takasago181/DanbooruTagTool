name: issue70-chunk149-156-debug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk149_156_debug.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find promotion tags
        shell: python
        run: |
          import csv
          from pathlib import Path
          wanted=['kawakami_tetsuya','hanamizawa_q-tarou','nishiwaki_yuuri','fujii_maki','suzuki_masahisa','takasaka_aka','ohtagaki_yasuo','orimoto_mimana','ishihama_masashi','matsuo_hiromi']
          files=sorted(Path('docs/issue70/data/source_chunks').glob('source_07*.csv'))
          found={}
          for p in files:
            with p.open('r',encoding='utf-8-sig',newline='') as f:
              for r in csv.DictReader(f):
                if r['canonical_tag'] in wanted:
                  found[r['canonical_tag']]=(r['row_id'],p.name)
          print('FOUND',len(found),found)
          print('MISSING',[x for x in wanted if x not in found])
