name: Issue118 Research Sidecar V53
on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v53.py
      - docs/issue118/research_sidecar_v52.csv
      - docs/issue118/general_action_interaction_none_review_v79/review_policy_v79.json
      - docs/issue118/general_action_interaction_none_review_v79/full_review_candidate_v79.csv
      - .github/workflows/issue118_research_sidecar_v53.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-sidecar-v53:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v53
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v53.py
          python3 scripts/issue118/materialize_research_sidecar_v53.py
      - name: Validate v53
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v53.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v53.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==100
          assert s['new_promotions']=={'CONTEXTUAL':18,'NON_SEXUAL':82}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':5480,'UNCLASSIFIED':3901}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1466,'NON_SEXUAL':24680,'NULL':3901,'SEXUAL':1705}
          assert s['remaining_unclassified']==3901
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V53_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v53.csv docs/issue118/research_sidecar_summary_v53.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v53'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
