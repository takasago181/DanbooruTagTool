name: issue70-chunk149-156-auditprep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk149_156_auditprep.yml'
permissions:
  contents: read
jobs:
  auditprep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Japanese candidates for 4000 rows
        shell: python
        run: |
          import csv, re
          from pathlib import Path
          files=[
            Path('docs/issue70/data/source_chunks/source_074001_074500.csv'),
            Path('docs/issue70/data/source_chunks/source_074501_075000.csv'),
            Path('docs/issue70/data/source_chunks/source_075001_075500.csv'),
            Path('docs/issue70/data/source_chunks/source_075501_076000.csv'),
            Path('docs/issue70/data/source_chunks/source_076001_076500.csv'),
            Path('docs/issue70/data/source_chunks/source_076501_077000.csv'),
            Path('docs/issue70/data/source_chunks/source_077001_077500.csv'),
            Path('docs/issue70/data/source_chunks/source_077501_078000.csv'),
          ]
          outputs=[
            Path('docs/issue70/data/results/queue/queue_chunk149_I70-074001_I70-074500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk150_I70-074501_I70-075000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk151_I70-075001_I70-075500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk152_I70-075501_I70-076000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk153_I70-076001_I70-076500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk154_I70-076501_I70-077000.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk155_I70-077001_I70-077500.csv'),
            Path('docs/issue70/data/results/queue/queue_chunk156_I70-077501_I70-078000.csv'),
          ]
          assert not any(p.exists() for p in outputs), 'one or more target queue files already exist'
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          kanji=re.compile(r'[\u3400-\u9fff]')
          nameish=re.compile(r"^[a-z][a-z0-9']+_[a-z][a-z0-9']+$")
          rows_all=[]; candidates=[]
          for p in files:
            with p.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            rows_all.extend(rows)
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): candidates.append(r)
          assert len(rows_all)==4000
          print('TOTAL_ROWS',len(rows_all))
          print('JP_CANDIDATE_COUNT',len(candidates))
          promising=[]
          for r in candidates:
            tag=r['canonical_tag']; c=r['existing_candidate_ja'].strip(); aliases=r['verified_aliases'].strip()
            ascii_letters=sum(ch.isascii() and ch.isalpha() for ch in c)
            jp_chars=sum(bool(jp.match(ch)) for ch in c)
            strong_jp=(jp_chars>=2 and ascii_letters<=2)
            if nameish.match(tag) or aliases or (strong_jp and kanji.search(c)):
              promising.append((r['row_id'],tag,aliases,c))
          print('PROMISING_COUNT',len(promising))
          for row in promising:
            print('CAND\t'+'\t'.join(row))
