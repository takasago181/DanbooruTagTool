name: issue70-chunk149-156-publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk149_156_auditprep.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validate and publish chunks 149-156
        shell: python
        run: |
          import csv, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path
          repo=Path.cwd()
          specs=[
            (149,'I70-074001','I70-074500','docs/issue70/data/source_chunks/source_074001_074500.csv','49b67841cccd893ddd85ec387a34b356d3b47178a142998b3fcb9c81a57eb43d','docs/issue70/data/results/queue/queue_chunk149_I70-074001_I70-074500.csv'),
            (150,'I70-074501','I70-075000','docs/issue70/data/source_chunks/source_074501_075000.csv','62dc49129cd30737f6fbde9f577990f46eac8f886a65a5ccda65dc8f0715849d','docs/issue70/data/results/queue/queue_chunk150_I70-074501_I70-075000.csv'),
            (151,'I70-075001','I70-075500','docs/issue70/data/source_chunks/source_075001_075500.csv','f770bde3dbb3477e67d5ce1c44b18af7bed2a185295cd2f6831fdf818f6726d4','docs/issue70/data/results/queue/queue_chunk151_I70-075001_I70-075500.csv'),
            (152,'I70-075501','I70-076000','docs/issue70/data/source_chunks/source_075501_076000.csv','9417f40e1ad3c6c3e37a570793cf879af34fd462f21fd12a90f13e55ce4f61b5','docs/issue70/data/results/queue/queue_chunk152_I70-075501_I70-076000.csv'),
            (153,'I70-076001','I70-076500','docs/issue70/data/source_chunks/source_076001_076500.csv','00d3692f2216ffe7fb9baa549e7f2107bd09845b572ed412c123b95fac873615','docs/issue70/data/results/queue/queue_chunk153_I70-076001_I70-076500.csv'),
            (154,'I70-076501','I70-077000','docs/issue70/data/source_chunks/source_076501_077000.csv','a05884366b2c604a5727bb9803431f061f34a41a0f0a311243aa8596d5e80f52','docs/issue70/data/results/queue/queue_chunk154_I70-076501_I70-077000.csv'),
            (155,'I70-077001','I70-077500','docs/issue70/data/source_chunks/source_077001_077500.csv','dfc1c02ca958fc4a8a1663ce2e9e0b6862fb7690507ae39dc6ca20aa11309d25','docs/issue70/data/results/queue/queue_chunk155_I70-077001_I70-077500.csv'),
            (156,'I70-077501','I70-078000','docs/issue70/data/source_chunks/source_077501_078000.csv','c4a545e28066ebb13884f8af4d9971bc75f1372b1a21b051b7d736925455e596','docs/issue70/data/results/queue/queue_chunk156_I70-077501_I70-078000.csv'),
          ]
          promotions={
            'kawakami_tetsuya':'川上哲也',
            'hanamizawa_q-tarou':'花見沢Q太郎',
            'nishiwaki_yuuri':'西脇ゆぅり',
            'fujii_maki':'藤井まき',
            'suzuki_masahisa':'鈴木雅久',
            'takasaka_aka':'赤坂アカ',
            'ohtagaki_yasuo':'太田垣康男',
            'orimoto_mimana':'おりもとみまな',
            'ishihama_masashi':'石浜真史',
            'matsuo_hiromi':'マツオヒロミ',
          }
          result_fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          manifest=json.loads((repo/'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          entries={e['chunk_index']:e for e in manifest['chunks']}
          loaded=[]
          for idx,first,last,src_rel,expected_sha,out_rel in specs:
            entry=entries[idx]
            assert entry['first_row_id']==first and entry['last_row_id']==last and entry['row_count']==500 and entry['file']==src_rel and entry['sha256']==expected_sha
            src=repo/src_rel
            assert hashlib.sha256(src.read_bytes()).hexdigest()==expected_sha
            dst=repo/out_rel
            if dst.exists():
              raise SystemExit(f'immutable queue result already exists: {out_rel}')
            with src.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500 and rows[0]['row_id']==first and rows[-1]['row_id']==last
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            loaded.append((entry,rows,out_rel))
          total=0; jp_candidates=0; used=[]
          for entry,rows,out_rel in loaded:
            out=[]
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): jp_candidates+=1
              tag=r['canonical_tag']
              if tag in promotions:
                display=promotions[tag]
                used.append((r['row_id'],tag,display))
                note='semantic artist audit: independently verified Japanese name'
              else:
                display=tag.replace('_',' ')
                note='semantic artist audit: canonical handle preserved; no independently verified Japanese name'
              out.append({'row_id':r['row_id'],'canonical_tag':tag,'category':r['category'],'display_ja':display,'search_ja':'','translation_status':'ACCEPTED_AI','translation_note':note})
            dst=repo/out_rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            with dst.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=result_fields,lineterminator='\n'); w.writeheader(); w.writerows(out)
            total+=len(out)
          spec=importlib.util.spec_from_file_location('publish_local_batch',repo/'scripts/issue70/publish_local_batch.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for *_,out_rel in specs:
            entry,rows=mod.validate_result(repo,repo/out_rel)
            assert len(rows)==500
            print('VALIDATED',entry['chunk_index'],out_rel,len(rows))
          assert total==4000
          assert jp_candidates==1161
          assert len(used)==len(promotions)==10
          print('TOTAL_ROWS',total)
          print('JP_CANDIDATE_COUNT',jp_candidates)
          print('PROMOTION_COUNT',len(used))
          for x in used: print('PROMOTE\t'+'\t'.join(x))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add']+[s[-1] for s in specs],check=True)
          subprocess.run(['git','commit','-m','issue70: publish 4000-row artist audit chunks 149-156'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
