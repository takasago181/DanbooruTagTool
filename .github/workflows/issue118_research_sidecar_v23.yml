name: Issue118 Research Sidecar V23

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v23.py
      - docs/issue118/research_sidecar_v22.csv
      - docs/issue118/special_none_review_v37/review_policy_v37.json
      - docs/issue118/special_none_review_v37/full_review_candidate_v37.csv
      - .github/workflows/issue118_research_sidecar_v23.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v23:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v23
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v23.py
          python3 scripts/issue118/materialize_research_sidecar_v23.py
      - name: Validate v23
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v23.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v23.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['remaining_unclassified']==6499
          assert s['new_promotions']=={'CONTEXTUAL':105,'NON_SEXUAL':66,'SEXUAL':69}
          assert s['kept_unclassified']==17
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V23_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v23.csv docs/issue118/research_sidecar_summary_v23.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v23'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
