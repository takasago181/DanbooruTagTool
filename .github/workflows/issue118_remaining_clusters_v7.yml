name: Issue118 Remaining Clusters V7

on:
  push:
    branches:
      - research/issue118-cluster-rules
    paths:
      - scripts/issue118/materialize_remaining_cluster_inventory_v7.py
      - .github/workflows/issue118_remaining_clusters_v7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize remaining cluster inventory
        run: |
          python3 -m py_compile scripts/issue118/materialize_remaining_cluster_inventory_v7.py
          python3 scripts/issue118/materialize_remaining_cluster_inventory_v7.py
      - name: Validate inventory
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('docs/issue118/remaining_cluster_inventory_v7')
          s=json.loads((p/'summary_v7.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader((p/'cluster_inventory_v7.csv').open(encoding='utf-8')))
          assert s['remaining_unclassified_rows']==15880
          assert sum(s['membership_counts'].values())==15880
          assert len(rows)==s['cluster_count']
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_REMAINING_CLUSTERS_V7_GATE=PASS')
          PY
      - name: Persist research inventory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/remaining_cluster_inventory_v7
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize remaining cluster inventory v7'
            git push origin HEAD:research/issue118-cluster-rules
          fi
