name: Issue70 Recurate Chunk 91 One Shot
on:
  push:
    paths: ['.github/workflows/issue70_recurate_chunk091.yml']
permissions:
  contents: write
jobs:
  recurate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-curate chunk 91 artist identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, sys
          from pathlib import Path
          ROOT=Path('.')
          path=ROOT/'docs/issue70/data/results/queue/queue_chunk091_I70-045001_I70-045500.csv'
          fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          known={
          'I70-045013':'40原','I70-045040':'西E田','I70-045054':'村田蓮爾','I70-045057':'むりりん','I70-045092':'杉森建','I70-045098':'ワダアルコ'
          }
          with path.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          if len(rows)!=500: raise SystemExit(f'expected 500 rows, found {len(rows)}')
          cats={r['category'] for r in rows}
          if cats!={'1'}: raise SystemExit(f'chunk 91 expected all category 1 artist rows, found {cats}')
          ids={r['row_id'] for r in rows}
          if set(known)-ids: raise SystemExit('known artist row-id mismatch')
          corrected=0
          for row in rows:
              old=row['display_ja']; rid=row['row_id']
              row['display_ja']=known.get(rid,row['canonical_tag'].replace('_',' '))
              if row['display_ja']!=old: corrected+=1
              row['translation_status']='ACCEPTED_AI'
              row['translation_note']='semantic re-curation: artist identity normalized; known Japanese credit used when clear, otherwise canonical handle preserved without machine translation'
          with path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          sys.path.insert(0,str(ROOT)); from scripts.issue70.publish_local_batch import validate_result
          entry,validated_rows=validate_result(ROOT,path)
          if int(entry['chunk_index'])!=91 or len(validated_rows)!=500: raise SystemExit('validator mismatch')
          print({'counts':{'ACCEPTED_AI':500,'REVIEW_REQUIRED':0},'corrected_display':corrected})
          PY
      - name: Commit re-curated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue70/data/results/queue/queue_chunk091_I70-045001_I70-045500.csv
          git commit -m 'Issue70: semantically re-curate chunk 91 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
