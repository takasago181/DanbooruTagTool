name: Issue118 Clothing Misc Review V32

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_clothing_misc_review_v32.py
      - docs/issue118/research_sidecar_v17.csv
      - .github/workflows/issue118_clothing_misc_review_v32.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clothing-misc-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize clothing misc v32 review set
        run: |
          python3 -m py_compile scripts/issue118/materialize_clothing_misc_review_v32.py
          python3 scripts/issue118/materialize_clothing_misc_review_v32.py
      - name: Validate v32
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('docs/issue118/clothing_misc_review_v32')
          s=json.loads((p/'summary_v32.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader((p/'full_review_candidate_v32.csv').open(encoding='utf-8')))
          assert len(rows)==72 and s['candidate_rows']==72
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_CLOTHING_MISC_V32_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/clothing_misc_review_v32
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize clothing misc review v32'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
