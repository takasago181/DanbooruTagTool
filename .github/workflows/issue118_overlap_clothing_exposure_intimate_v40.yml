name: Issue118 Overlap Clothing Exposure Intimate Review V40

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_overlap_clothing_exposure_intimate_review_v40.py
      - docs/issue118/research_sidecar_v24.csv
      - .github/workflows/issue118_overlap_clothing_exposure_intimate_v40.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v40:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v40 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_overlap_clothing_exposure_intimate_review_v40.py
          python3 scripts/issue118/materialize_overlap_clothing_exposure_intimate_review_v40.py
      - name: Validate v40
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/overlap_clothing_exposure_intimate_review_v40/full_review_candidate_v40.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/overlap_clothing_exposure_intimate_review_v40/summary_v40.json').read_text(encoding='utf-8'))
          assert len(rows)==66
          assert s['candidate_rows']==66
          assert s['auto_promotion_performed']=='NO'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_OVERLAP_CLOTHING_EXPOSURE_INTIMATE_V40_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/overlap_clothing_exposure_intimate_review_v40
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize overlap clothing exposure intimate review v40'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
