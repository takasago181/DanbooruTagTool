name: Issue118 Research Sidecar V6

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v6.py
      - docs/issue118/research_sidecar_v5.csv
      - docs/issue118/pose_movement_refinement_v14_2/pose_clean_v14_2.csv
      - docs/issue118/pose_movement_refinement_v14_2/holdout_gate_v14_2.json
      - .github/workflows/issue118_research_sidecar_v6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v6
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v6.py
          python3 scripts/issue118/materialize_research_sidecar_v6.py
      - name: Validate v6
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          side = Path('docs/issue118/research_sidecar_v6.csv')
          summary = Path('docs/issue118/research_sidecar_summary_v6.json')
          rows = list(csv.DictReader(side.open(encoding='utf-8')))
          s = json.loads(summary.read_text(encoding='utf-8'))
          assert len(rows) == 31752
          assert s['new_pose_auto_promotions'] == 706
          assert s['remaining_unclassified'] == 10728
          assert s['review_status_counts'] == {
              'AUTO_HIGH_CONF': 19962,
              'HUMAN_REVIEWED': 1062,
              'UNCLASSIFIED': 10728,
          }
          assert s['sexual_intent_counts'] == {
              'CONTEXTUAL': 201,
              'NON_SEXUAL': 20237,
              'NULL': 10728,
              'SEXUAL': 586,
          }
          assert s['review_verdicts_generated_by_materializer'] == 'NO'
          assert s['review_artifacts_are_external_inputs'] == 'YES'
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_V6_GATE=PASS')
          PY
      - name: Persist research sidecar v6 only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v6.csv docs/issue118/research_sidecar_summary_v6.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v6'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
