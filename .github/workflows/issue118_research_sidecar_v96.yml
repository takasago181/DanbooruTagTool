name: Issue118 Research Sidecar V96

on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_research_sidecar_v96.py
      - docs/issue118/research_sidecar_v95.csv
      - docs/issue118/final_unclassified_inventory_v129/review_policy_v129.json
      - docs/issue118/final_unclassified_inventory_v129/remaining_unclassified_v129.csv
      - .github/workflows/issue118_research_sidecar_v96.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-sidecar-v96:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v96
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v96.py
          python3 scripts/issue118/materialize_research_sidecar_v96.py
      - name: Validate v96
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/research_sidecar_v96.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/research_sidecar_summary_v96.json').read_text(encoding='utf-8'))
          assert len(rows)==31752
          assert s['new_total_promotions']==1
          assert s['new_promotions']=={'SEXUAL':1}
          assert s['review_status_counts']=={'AUTO_HIGH_CONF':22371,'HUMAN_REVIEWED':9376,'UNCLASSIFIED':5}
          assert s['sexual_intent_counts']=={'CONTEXTUAL':1951,'NON_SEXUAL':27759,'NULL':5,'SEXUAL':2037}
          assert s['remaining_unclassified']==5
          assert s['retained_unclassified']==['cock-tail','insertion_threshold_(meme)','knee_boobs','lilistia','powerful_ass']
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO'
          assert s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO'
          assert s['catalog_mutated']=='NO'
          assert s['user_db_mutated']=='NO'
          print('ISSUE118_RESEARCH_SIDECAR_V96_GATE=PASS')
          PY
      - name: Persist research sidecar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v96.csv docs/issue118/research_sidecar_summary_v96.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v96'
            git pull --rebase origin research/issue118-cluster-triage-v8
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
