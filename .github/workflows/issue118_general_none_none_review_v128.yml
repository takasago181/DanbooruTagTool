name: Issue118 General None None Review V128

on:
  push:
    branches: [research/issue118-cluster-triage-v8]
    paths:
      - scripts/issue118/materialize_general_none_none_review_v128.py
      - docs/issue118/research_sidecar_v94.csv
      - .github/workflows/issue118_general_none_none_review_v128.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  general-none-none-v128:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v128 review candidate
        run: |
          python3 -m py_compile scripts/issue118/materialize_general_none_none_review_v128.py
          python3 scripts/issue118/materialize_general_none_none_review_v128.py
      - name: Validate v128
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('docs/issue118/general_none_none_review_v128/full_review_candidate_v128.csv').open(encoding='utf-8')))
          s=json.loads(Path('docs/issue118/general_none_none_review_v128/summary_v128.json').read_text(encoding='utf-8'))
          assert len(rows)==37
          assert s['candidate_rows']==37
          assert s['source_cluster_rows']==39
          assert s['eligible_cluster_rows']==37
          assert s['retained_exclusions']==['insertion_threshold_(meme)','lilistia']
          assert s['source_sidecar']=='research_sidecar_v94.csv'
          assert s['selection_rules_use']=='DISCOVERY_ONLY_NOT_CLASSIFICATION_AUTHORITY'
          assert s['auto_promotion_performed']=='NO'
          assert s['review_verdicts_generated_by_materializer']=='NO'
          assert s['review_artifacts_are_external_inputs']=='YES'
          assert s['production_authority']=='NO' and s['main_mutated']=='NO'
          assert s['issue117_code_mutated']=='NO' and s['catalog_mutated']=='NO' and s['user_db_mutated']=='NO'
          assert all((r.get('human_intent') or '')=='' and (r.get('review_note') or '')=='' for r in rows)
          print('ISSUE118_GENERAL_NONE_NONE_V128_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/general_none_none_review_v128/
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize giant general-none review v128'
            git pull --rebase origin research/issue118-cluster-triage-v8
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
