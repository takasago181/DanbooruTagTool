name: issue70-chunk173-180-publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue70_chunk173_180_auditprep.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validate and publish chunks 173-180
        shell: python
        run: |
          import csv, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path
          repo=Path.cwd()
          specs=[
            (173,'I70-086001','I70-086500','docs/issue70/data/source_chunks/source_086001_086500.csv','f8607b75b807fc01989ed8a4618b9f6d080fd004a17bc35aff7b758d1a387ceb','docs/issue70/data/results/queue/queue_chunk173_I70-086001_I70-086500.csv'),
            (174,'I70-086501','I70-087000','docs/issue70/data/source_chunks/source_086501_087000.csv','108eb1964f8d0e8c89d462085d154c15976b6a07db296dcaa0dfc6b10c182f92','docs/issue70/data/results/queue/queue_chunk174_I70-086501_I70-087000.csv'),
            (175,'I70-087001','I70-087500','docs/issue70/data/source_chunks/source_087001_087500.csv','dc9f482716068e183a4b87a07c5bcc57f21d235c407c9e3377402f0594956b50','docs/issue70/data/results/queue/queue_chunk175_I70-087001_I70-087500.csv'),
            (176,'I70-087501','I70-088000','docs/issue70/data/source_chunks/source_087501_088000.csv','50f850f0724d6435797d5849abd399da30a379879b3b00d13db5088aa35f11ea','docs/issue70/data/results/queue/queue_chunk176_I70-087501_I70-088000.csv'),
            (177,'I70-088001','I70-088500','docs/issue70/data/source_chunks/source_088001_088500.csv','3159caf0fe8a2a0f865a689ee852df253c03a8addaf5b9701ba760d5799292fe','docs/issue70/data/results/queue/queue_chunk177_I70-088001_I70-088500.csv'),
            (178,'I70-088501','I70-089000','docs/issue70/data/source_chunks/source_088501_089000.csv','0548fa51b2ce4f26402c737c22007df7184bb66ce6da811078d2e7e9b52c71e9','docs/issue70/data/results/queue/queue_chunk178_I70-088501_I70-089000.csv'),
            (179,'I70-089001','I70-089500','docs/issue70/data/source_chunks/source_089001_089500.csv','6d3f815ae22b020d3c49350298c8f655a8adf843b3b57feb0ebf97e2919c44b9','docs/issue70/data/results/queue/queue_chunk179_I70-089001_I70-089500.csv'),
            (180,'I70-089501','I70-090000','docs/issue70/data/source_chunks/source_089501_090000.csv','564547da48ed6cb3f9cf07bf4132de56840617e0a1d2e7ef17cd344658531f71','docs/issue70/data/results/queue/queue_chunk180_I70-089501_I70-090000.csv'),
          ]
          promotions={
            'ujiga_waita':'氏賀Y太',
            'kazue_kato':'加藤和恵',
            'kodama_naoko':'コダマナオコ',
            'kubooka_toshiyuki':'窪岡俊之',
            'yamaguchi_sapuri':'山口さぷり',
            'kawamori_shouji':'河森正治',
            'kojima_ayami':'小島文美',
            'shibamoto_thores':'THORES柴本',
            'takemoto_yasuhiro':'武本康弘',
            'yamatogawa':'大和川',
            "inoue_jun'ya":'井上淳哉',
            'yamada_akihiro':'山田章博',
            'yamashita_ikuto':'山下いくと',
          }
          result_fields=['row_id','canonical_tag','category','display_ja','search_ja','translation_status','translation_note']
          jp=re.compile(r'[\u3040-\u30ff\u3400-\u9fff]')
          manifest=json.loads((repo/'docs/issue70/data/source_chunks_manifest.json').read_text(encoding='utf-8-sig'))
          entries={e['chunk_index']:e for e in manifest['chunks']}
          loaded=[]
          for idx,first,last,src_rel,expected_sha,out_rel in specs:
            entry=entries[idx]
            assert entry['first_row_id']==first and entry['last_row_id']==last and entry['row_count']==500 and entry['file']==src_rel and entry['sha256']==expected_sha
            src=repo/src_rel
            assert hashlib.sha256(src.read_bytes()).hexdigest()==expected_sha
            dst=repo/out_rel
            if dst.exists():
              raise SystemExit(f'immutable queue result already exists: {out_rel}')
            with src.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
            assert len(rows)==500 and rows[0]['row_id']==first and rows[-1]['row_id']==last
            assert all(r['category_name']=='Artist' and r['category']=='1' for r in rows)
            loaded.append((entry,rows,out_rel))
          total=0; jp_candidates=0; used=[]
          for entry,rows,out_rel in loaded:
            out=[]
            for r in rows:
              c=r['existing_candidate_ja'].strip()
              if c and jp.search(c): jp_candidates+=1
              tag=r['canonical_tag']
              if tag in promotions:
                display=promotions[tag]
                used.append((r['row_id'],tag,display))
                note='semantic artist audit: independently verified Japanese name'
              else:
                display=tag.replace('_',' ')
                note='semantic artist audit: canonical handle preserved; no independently verified Japanese name'
              out.append({'row_id':r['row_id'],'canonical_tag':tag,'category':r['category'],'display_ja':display,'search_ja':'','translation_status':'ACCEPTED_AI','translation_note':note})
            dst=repo/out_rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            with dst.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=result_fields,lineterminator='\n'); w.writeheader(); w.writerows(out)
            total+=len(out)
          spec=importlib.util.spec_from_file_location('publish_local_batch',repo/'scripts/issue70/publish_local_batch.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for *_,out_rel in specs:
            entry,rows=mod.validate_result(repo,repo/out_rel)
            assert len(rows)==500
            print('VALIDATED',entry['chunk_index'],out_rel,len(rows))
          assert total==4000
          assert jp_candidates==1042
          assert len(used)==len(promotions)==13
          print('TOTAL_ROWS',total)
          print('JP_CANDIDATE_COUNT',jp_candidates)
          print('PROMOTION_COUNT',len(used))
          for x in used: print('PROMOTE\t'+'\t'.join(x))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add']+[s[-1] for s in specs],check=True)
          subprocess.run(['git','commit','-m','issue70: publish 4000-row artist audit chunks 173-180'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
