name: Issue118 Research Sidecar V9

on:
  push:
    branches:
      - research/issue118-cluster-triage-v8
    paths:
      - scripts/issue118/materialize_research_sidecar_v9.py
      - docs/issue118/special_only_explicit_v21/explicit_sexual_candidate_v21.csv
      - docs/issue118/special_only_explicit_v21/review_decisions_v21.json
      - .github/workflows/issue118_research_sidecar_v9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize research sidecar v9
        run: |
          python3 -m py_compile scripts/issue118/materialize_research_sidecar_v9.py
          python3 scripts/issue118/materialize_research_sidecar_v9.py
      - name: Validate v9
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          s = json.loads(Path('docs/issue118/research_sidecar_summary_v9.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader(Path('docs/issue118/research_sidecar_v9.csv').open(encoding='utf-8')))
          assert len(rows) == 31752
          assert s['new_special_explicit_human_promotions'] == 96
          assert s['remaining_unclassified'] == 8119
          assert s['review_status_counts'] == {'AUTO_HIGH_CONF': 22371, 'HUMAN_REVIEWED': 1262, 'UNCLASSIFIED': 8119}
          assert s['sexual_intent_counts'] == {'CONTEXTUAL': 201, 'NON_SEXUAL': 22750, 'NULL': 8119, 'SEXUAL': 682}
          assert s['production_authority'] == 'NO'
          assert s['main_mutated'] == 'NO'
          assert s['issue117_code_mutated'] == 'NO'
          assert s['catalog_mutated'] == 'NO'
          assert s['user_db_mutated'] == 'NO'
          print('ISSUE118_RESEARCH_SIDECAR_V9_GATE=PASS')
          PY
      - name: Persist research evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/issue118/research_sidecar_v9.csv docs/issue118/research_sidecar_summary_v9.json
          if ! git diff --cached --quiet; then
            git commit -m 'Issue #118: materialize research sidecar v9'
            git push origin HEAD:research/issue118-cluster-triage-v8
          fi
