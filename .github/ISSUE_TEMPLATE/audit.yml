name: 監査
description: Stage・実装・仕様の第三者監査
title: "[StageX][AUDIT] "
body:
  - type: markdown
    attributes:
      value: |
        PASS / CONDITIONAL PASS / FAIL の後に、次に進めるGateまたはDEVへ戻す条件を明示してください。
        substageのPASSをStage全体PASSへ自動昇格させません。
  - type: input
    id: stage
    attributes:
      label: Stage
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 監査対象
      description: 対象Issue、PR、branch/commit、ファイル
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 監査基準
      description: PASS条件、禁止事項、回帰確認
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 結果
      options:
        - 未判定
        - PASS
        - CONDITIONAL PASS
        - FAIL
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: 指摘・根拠
  - type: textarea
    id: next_gate
    attributes:
      label: 次Gate / 戻り先
      description: PASS後に進めるIssue/Stage、またはFAIL/CONDITIONAL PASS時にDEVへ戻す条件
    validations:
      required: true
