name: Stage10 テストPrompt
description: A/B試験用Prompt作成
title: "[Stage10][PROMPT] "
body:
  - type: markdown
    attributes:
      value: |
        管理ボード運用: `docs/project/CONTROL_BOARD_POLICY.md` を確認してください。
        GitHub Projectは人間向け可視化であり、Issue本文 / CURRENT_STATE / PERMANENT_RULESを置き換えません。
        Project表示だけでStage10開始・Gate通過・本番A/B開始を判断しません。
  - type: input
    id: question
    attributes:
      label: 実験で答える疑問
      placeholder: "例: support有無でSpecial成立率が変わるか"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model family
      placeholder: "WAI / Illustrious / NoobAI / Anima"
    validations:
      required: true
  - type: textarea
    id: fixed
    attributes:
      label: A/Bで固定する条件
    validations:
      required: true
  - type: textarea
    id: variable
    attributes:
      label: A/Bで変えるもの
    validations:
      required: true
  - type: textarea
    id: judgment
    attributes:
      label: 画像上の判定条件
      description: 何が見えたら成立 / 不成立か
    validations:
      required: true
